{s:5,q:"Why encapsulate error handling and logging in a reusable component?",o:["It gives consistent, maintainable behavior across integrations and reduces duplicated logic.","It hides all errors from everyone.","It removes the need for any security.","It makes integrations run without an ISU."],a:0,e:["Correct — shared handling standardizes behavior and eases maintenance.","Good handling surfaces errors clearly; it does not hide them.","Reuse does not replace security configuration.","Runs still execute under an ISU regardless."]},
{s:5,q:"Your team keeps rewriting slightly different logging blocks in every orchestration.\n\nWhat is the maintainable fix?",o:["Create one reusable logging suborchestration with a defined message input and call it everywhere.","Ask everyone to keep their own version.","Move logging into the vendor's system.","Stop logging to avoid the duplication."],a:0,e:["Correct — a shared logging suborchestration standardizes behavior and removes duplication.","Divergent copies are exactly the maintenance problem to avoid.","The vendor cannot log your internal processing.","Removing logging destroys your ability to troubleshoot."]},
{s:5,q:"A suborchestration should expose which of the following to its callers?",o:["A clear contract of inputs it needs and outputs it returns.","The internal variable names of the parent.","The ISU password.","The vendor's private key."],a:0,e:["Correct — a well-defined input/output contract is what makes a suborchestration reusable and safe to call.","Callers should not depend on a parent's internals; that breaks encapsulation.","Passwords are never exposed as an interface.","Private keys are secrets, never part of a public contract."]},
/* ---- Section 6: Troubleshooting connectors & orchestrations ---- */
{s:6,q:"An outbound connector completed successfully, but one field is blank for all workers.\n\nWhat is the most likely cause?",o:["The ISSG lacks Get access to the domain that secures that field's data.","The vendor's server rejected the file.","The schedule ran at the wrong time.","The file name sequence rolled over."],a:0,e:["Correct — missing domain access typically blanks a secured field without failing the run.","A server rejection is a delivery failure, not a single blank field.","Run timing does not blank a specific field.","Filename sequencing does not affect field values."]},
{s:6,q:"A connector run shows Completed with Warnings.\n\nWhat is the correct first step?",o:["Open the event and review the warning messages to see which records or conditions need attention.","Immediately delete the event.","Re-launch repeatedly until it is clean.","Ignore it, since warnings never matter."],a:0,e:["Correct — the event's messages explain the warnings so you can decide on action.","Deleting the event discards the diagnostic information.","Blind re-launching does not address the underlying cause.","Warnings can indicate skipped or problematic records worth reviewing."]},
{s:6,q:"An orchestration's REST step returns HTTP 500 intermittently.\n\nWhat is the best interpretation and action?",o:["A server-side error occurred; add retry/backoff and, if it persists, investigate the endpoint with the vendor.","Your credentials are wrong; rotate the token.","The resource does not exist; fix the URL.","You are rate limited; slow down."],a:0,e:["Correct — 5xx is a server-side fault; transient ones warrant retry, persistent ones need vendor investigation.","Auth failures are 401, not 500.","Missing resources are 404, not 500.","Rate limiting is 429, not 500."]},
{s:6,q:"An orchestration fails at a step that navigates a JSON field that is sometimes absent.\n\nWhat is the robust fix?",o:["Add a presence/null check before accessing the field and handle the missing case explicitly.","Assume the field always exists and ignore the error.","Remove the step entirely.","Switch the whole integration to SOAP."],a:0,e:["Correct — guarding optional fields prevents null-navigation failures.","Assuming presence is exactly what caused the failure.","Removing the step loses required logic.","Changing API style does not fix unguarded field access."]},
{s:6,q:"A scheduled integration silently stopped producing files.\n\nWhere do you begin diagnosis?",o:["Check the schedule status and recent events/process monitor for errors or a disabled schedule.","Rebuild the orchestration from scratch.","Change the vendor's server password.","Delete and recreate the ISU immediately."],a:0,e:["Correct — start with schedule state and recent run history to localize the problem.","Rebuilding before diagnosing wastes effort and may not address the cause.","Changing vendor credentials blindly can break a working connection.","Recreating the ISU prematurely can cause new security gaps."]},
{s:6,q:"An inbound load reports many records failed with a data-type error.\n\nWhat is the most likely root cause?",o:["The source values do not match the expected field types/format the load requires.","The SFTP handshake failed.","The report was not shared.","Change detection produced an empty file."],a:0,e:["Correct — type/format mismatches between source and target are a classic inbound failure.","A handshake failure would prevent retrieval, not produce per-record type errors.","Sharing affects reads, not inbound type validation.","Change detection is an outbound connector feature, unrelated here."]},
{s:6,q:"A REST call works in a manual test tool but fails from the orchestration with 401.\n\nWhat is the most likely difference?",o:["The orchestration is not sending valid credentials/token that the manual tool had configured.","The endpoint changed between the two calls.","JSON is not supported by the orchestration.","The vendor blocked all traffic."],a:0,e:["Correct — a 401 gap between tools usually means the orchestration's auth/token is missing or wrong.","A changed endpoint would more likely yield 404, and both tools would then fail.","Orchestrations handle JSON fine; that is not a 401 cause.","A full block would fail the manual tool too."]},
{s:6,q:"Two teams report the same integration behaves differently in test and production.\n\nWhat is the most disciplined way to isolate the cause?",o:["Compare environment-specific configuration (endpoints, credentials, parameters, security) between the two.","Assume production is broken and disable it.","Rewrite the orchestration for production only.","Ask the vendor to change their system."],a:0,e:["Correct — environment drift in config, credentials, or security is the usual cause; compare them systematically.","Disabling production without diagnosis harms operations.","Forking logic per environment invites divergence and bugs.","Changing the vendor's system is premature before isolating your own config."]},
/* ================= EXPANSION BATCH ================= */
/* --- more Section 0: Connectors --- */
{s:0,q:"A connector must sign the outbound file so the vendor can verify it came from you, in addition to encrypting it.\n\nWhich keys are used?",o:["Sign with your private key; encrypt with the vendor's public key.","Sign with the vendor's public key; encrypt with your private key.","Sign and encrypt both with the vendor's public key.","Sign and encrypt both with your private key."],a:0,e:["Correct — signing uses your private key (they verify with your public key); encryption uses their public key (only they can decrypt).","This reverses both operations; you cannot sign with someone else's public key.","Signing needs your private key, not the vendor's public key.","Encrypting with your own private key would let anyone with your public key read it."]},
{s:0,q:"You want output documents from a connector purged automatically after 30 days to meet a data-retention policy.\n\nWhere is this set?",o:["The document retention configuration on the integration system.","A calculated field returning 30.","The sequence generator.","The ISSG domain policy."],a:0,e:["Correct — document retention settings control how long event output files are kept before purging.","Calculated fields shape data values, not retention.","Sequence generators build patterned identifiers, not lifecycle policy.","Domain policies grant access; they do not purge files."]},
{s:0,q:"A Core Connector: Worker integration should also react to organization assignment changes.\n\nWhich mechanism decides whether such a change causes the worker to appear in the next changes-only run?",o:["The change detection fields configured for the integration.","The delivery transport.","The output filename attribute.","The retention period."],a:0,e:["Correct — change detection is scoped to specific fields; a change in a tracked field makes the worker eligible for the delta.","Transport moves the file; it does not decide who changed.","Filenames do not influence change comparison.","Retention controls file lifecycle, not change eligibility."]},
{s:0,q:"You need a connector output field to fall back to a literal value when the source data is blank.\n\nWhat is the cleanest configuration?",o:["An integration map with a default value for the unmatched/blank case.","A sequence generator producing the default.","A retrieval configuration.","A separate ISU for blank values."],a:0,e:["Correct — maps can specify a default output for values that do not match or are empty.","Sequence generators create incrementing values, not conditional defaults.","Retrieval is inbound file pickup, unrelated to output defaults.","ISUs are identities and cannot supply data defaults."]},
{s:0,q:"An outbound EIB needs to reformat the report output into a fixed vendor XML layout the report cannot produce directly.\n\nWhich EIB capability handles this?",o:["An XSLT transformation applied in the EIB delivery/transformation step.","An integration map on the report.","Change detection.","Population eligibility."],a:0,e:["Correct — EIBs can apply an XSLT transformation to reshape output into the required layout.","Report-level maps do not restructure into arbitrary XML.","Change detection is a connector feature, not an EIB transform.","Eligibility filters people; it does not reshape output."]},
{s:0,q:"Which statement about integration services on a template is most accurate?",o:["Each service can be individually enabled or disabled to include or exclude its data and behavior.","All services are always on and cannot be changed.","Services define the SFTP password.","Services are the same thing as calculated fields."],a:0,e:["Correct — services are modular and toggled per integration system to shape output.","Services are configurable, not fixed on.","Credentials live in transport configuration, not services.","Services are delivered data/behavior blocks, not calculated fields."]},
{s:0,q:"A vendor requires the file only when at least one worker changed; on runs with no changes, send nothing.\n\nWhich connector behavior supports this?",o:["Change detection combined with suppressing empty-output delivery.","Sending a full file every run.","Disabling the ISU on quiet days.","Deleting the schedule after each run."],a:0,e:["Correct — delta detection plus not delivering empty output meets the send-only-on-change requirement.","Full files every run is the opposite of the requirement.","Disabling the ISU would break the integration entirely.","Deleting the schedule stops all future runs."]},
{s:0,q:"You must expose a worker's cost center, which lives on a related object, in the connector output.\n\nWhich tool retrieves it for the override?",o:["A calculated field that traverses the relationship to return the cost center.","A sequence generator.","A delivery transport.","A retention policy."],a:0,e:["Correct — calculated fields can navigate related business objects to return the needed value.","Sequence generators build identifiers, not related data.","Transports move files; they do not read related objects.","Retention governs file lifecycle only."]},
{s:0,q:"After adding a new integration service that outputs benefits data, the file still omits it.\n\nWhat is the most likely gap?",o:["The ISSG lacks Get access to the benefits domain the new service requires.","The vendor did not ask for it.","The filename sequence is wrong.","Retention purged the field."],a:0,e:["Correct — enabling a service surfaces the requirement for its domain security; without Get access the data is blank/omitted.","Vendor intent does not control whether Workday outputs the data.","Filenames do not affect field content.","Retention deletes files, not individual fields at generation."]},
{s:0,q:"Which is the correct order to make a connector's ISU able to read a newly required domain?",o:["Add the domain permission to the ISSG, then activate pending security policy changes.","Activate pending changes, then never add the permission.","Recreate the ISU, then delete the ISSG.","Encrypt the file, then add the ISU to Administrators."],a:0,e:["Correct — grant the ISSG the domain, then activate the pending policy change so it takes effect.","Activating with no permission added changes nothing.","Deleting the ISSG removes the very access you are granting.","Administrator membership violates least privilege and is unrelated to encryption."]},
{s:0,q:"A connector is producing a delimited file, but the vendor now needs the same data as Workday XML.\n\nWhat typically changes?",o:["The output format configuration of the integration system (or the chosen template output).","The ISU password.","The population eligibility.","The change detection fields."],a:0,e:["Correct — output format is a configuration choice on the integration/template output.","Credentials are unrelated to output format.","Eligibility controls who is included, not the format.","Change detection controls deltas, not format."]},
{s:0,q:"You want to test a connector safely without delivering files to the live vendor endpoint.\n\nWhat is a sound approach?",o:["Run it in a non-production tenant or point delivery to a test endpoint before enabling the production transport.","Run it in production and hope the vendor ignores it.","Delete the vendor from Workday temporarily.","Disable all security to speed testing."],a:0,e:["Correct — use a sandbox/implementation tenant or a test endpoint to validate before going live.","Sending test data to a live vendor risks real downstream processing.","There is no vendor object to delete, and this would not make testing safe.","Disabling security invalidates the test and is dangerous."]},
{s:0,q:"What does an integration attribute of type file/transport option typically control?",o:["Behavioral settings such as delimiter, header inclusion, or version used by the template.","The worker population.","The ISSG membership.","The calculated field formula."],a:0,e:["Correct — attributes tune template behavior like formatting and version options.","Population is set by eligibility, not attributes.","Membership is security configuration, not an attribute.","Formulas live in calculated fields, not attributes."]},
{s:0,q:"An inbound connector must apply changes with a specific effective date supplied at launch.\n\nWhich element carries that date into the transaction?",o:["A launch parameter mapped to the effective date of the load.","The output filename.","A sequence generator.","The retention policy."],a:0,e:["Correct — launch parameters feed run-time values such as effective date into the processing.","Filenames are cosmetic and not transaction inputs.","Sequence generators build identifiers, not dates for transactions.","Retention governs file lifecycle only."]},
{s:0,q:"Two vendors need the same worker feed but with different value codes for employee type.\n\nWhat is the most maintainable design?",o:["Two integration systems (or one with per-vendor maps) each using its own value map, sharing the same eligibility where possible.","One file manually edited twice each morning.","Hard-code both vendors' codes into one output column.","Ask both vendors to accept Workday's raw values."],a:0,e:["Correct — separate maps per vendor keep translations clean while reusing common configuration.","Manual editing does not scale and breaks automation.","One column cannot hold two different code schemes.","Overriding vendor requirements is not a design choice you control."]},
{s:0,q:"Which artifact records the specific documents delivered and the delivery outcome for a connector run?",o:["The integration event.","The integration template.","The security domain.","The calculated field."],a:0,e:["Correct — the event stores generated documents and delivery results for that run.","Templates hold definitions, not run outcomes.","Domains govern access, not delivery results.","Calculated fields compute values, storing no run history."]},
{s:0,q:"A connector's file arrives at the vendor but is unreadable because it was not decrypted.\n\nWhat is the most likely misconfiguration?",o:["The file was encrypted with the wrong public key, so the vendor's private key cannot decrypt it.","The report had too many columns.","The schedule ran a minute late.","The ISU name was too long."],a:0,e:["Correct — encrypting with a key that does not match the vendor's private key makes decryption impossible on their side.","Column count does not affect decryptability.","Timing does not corrupt encryption.","ISU naming has no effect on the payload."]},
{s:0,q:"You need the connector to include only workers in a specific supervisory organization and its subordinates.\n\nWhich eligibility choice fits?",o:["Membership in the supervisory organization hierarchy (include subordinates).","A single supervisory organization with subordinates excluded.","All workers in the tenant.","Only the organization's manager."],a:0,e:["Correct — hierarchy-based membership including subordinates captures the org and everything beneath it.","Excluding subordinates misses the required lower levels.","Tenant-wide is broader than required.","One manager is far narrower than the stated scope."]},
{s:0,q:"What is the effect of an integration field override that points a delivered output field to a calculated field returning empty for some workers?",o:["Those workers get a blank value in that field while others get the computed value.","The whole run fails.","All workers get blank.","Change detection is disabled."],a:0,e:["Correct — overrides apply per worker; empty results yield blanks only for those cases.","A per-worker empty value does not fail the run.","Only the workers with empty results are blank, not all.","Overrides do not toggle change detection."]},
{s:0,q:"A delivered connector template receives an update in a new Workday release.\n\nWhat is generally true about your configuration?",o:["Your services, maps, attributes, and overrides remain, layered on the updated template.","All your configuration is wiped and must be rebuilt.","The ISU is deleted.","Your calculated fields become reports."],a:0,e:["Correct — Workday maintains the template while your configuration persists on top.","Configuration is not wiped by template updates.","ISUs are independent security objects and are not deleted.","Calculated fields remain calculated fields."]},
/* --- more Section 1: Basics & RaaS --- */
{s:1,q:"An inbound EIB can load data from which source types?",o:["A spreadsheet you populate or a delimited/flat file matching the generated template.","Only live database connections.","Only Workday reports.","Only PDF files."],a:0,e:["Correct — inbound EIBs load from a populated spreadsheet or a matching text/delimited file.","EIBs do not connect to external live databases.","Reports are a data source for outbound EIBs, not the inbound load payload.","PDFs are not a structured load source for EIBs."]},
{s:1,q:"A RaaS endpoint should return only workers a specific ISU is allowed to see.\n\nHow is that enforced?",o:["The report runs as the calling ISU and applies that account's row-level security.","RaaS ignores security and returns everything.","Security is applied only in the browser.","The vendor filters the rows."],a:0,e:["Correct — RaaS honors the caller's security context, returning only permitted rows.","RaaS never bypasses security.","Security applies to service calls, not just the UI.","Relying on the vendor to filter leaks data you should have restricted."]},
{s:1,q:"Which report type is required to enable a custom report as a web service (RaaS)?",o:["An Advanced custom report.","A Simple report only.","A standard delivered report.","A dashboard."],a:0,e:["Correct — Advanced reports support web-service (RaaS) enablement.","Simple reports lack the web-service enablement needed here.","Standard delivered reports generally cannot be enabled as your RaaS source.","Dashboards are UI compositions, not RaaS sources."]},
{s:1,q:"You must supply a value for a required report prompt when calling RaaS from an integration.\n\nHow is the value passed?",o:["As a request parameter corresponding to the prompt.","By editing the report title.","By changing the tenant time zone.","It cannot be passed; remove the prompt."],a:0,e:["Correct — prompts map to request parameters on the RaaS call.","Titles are cosmetic and not read as inputs.","Time zone affects value formatting, not prompt input.","Prompts can be supplied; they need not be removed."]},
{s:1,q:"Which is the best reason to choose an EIB over Studio/Orchestrate for a new outbound feed?",o:["The requirement is a single report delivered simply, with minimal transformation.","The requirement involves several chained web-service calls and complex branching.","The requirement needs reusable suborchestrations.","The requirement needs custom retry with backoff on external APIs."],a:0,e:["Correct — EIB is ideal for simple, single-source report delivery.","Chained calls and branching point to orchestration, not EIB.","Reusable suborchestrations are an Orchestrate concept.","Sophisticated retry logic belongs to orchestration code, not EIB."]},
{s:1,q:"An integration event shows status Failed.\n\nWhat should you review to understand why?",o:["The event's error messages and process log.","The vendor's marketing site.","The tenant color theme.","The calculated field help text."],a:0,e:["Correct — the event's messages and log explain the failure.","External sites are irrelevant to your run.","Theme settings have nothing to do with failures.","Help text is documentation, not run diagnostics."]},
{s:1,q:"Why enable a report as CSV output for a downstream system that cannot parse XML?",o:["CSV is a flat delimited format that non-XML systems can ingest directly.","CSV encrypts the data.","CSV runs faster than the report.","CSV bypasses prompts."],a:0,e:["Correct — matching the consumer's format (CSV) avoids XML parsing they cannot do.","CSV is not encrypted by choosing that format.","Output format does not change report runtime meaningfully here.","Prompts still apply regardless of output format."]},
{s:1,q:"What distinguishes an integration event from an integration system?",o:["The system is the reusable definition; the event is one execution instance with its parameters and results.","They are identical.","Events store domain security.","Systems store output files."],a:0,e:["Correct — definition vs single run instance is the key distinction.","They are different objects with different roles.","Security lives on groups and policies, not events.","Output files attach to events, not the system definition."]},
{s:1,q:"A team needs a quick, secure way to expose a report's data to a partner tool that speaks JSON over HTTPS.\n\nWhat is the simplest fit?",o:["Enable the Advanced report as a web service and call it as RaaS with JSON output.","Build a Studio integration from scratch.","Email a spreadsheet daily.","Grant the partner a Workday login."],a:0,e:["Correct — RaaS with JSON output is the lightweight, secure way to expose report data over HTTPS.","Studio is heavy for a simple report exposure.","Emailing spreadsheets is manual and not a live service.","Handing out logins is a security and licensing problem, not an integration."]},
{s:1,q:"When scheduling an integration, why prefer relative launch parameters?",o:["They compute values like the prior day at each run so the schedule needs no manual edits.","They disable security.","They guarantee no failures.","They shorten the output file."],a:0,e:["Correct — relative parameters recompute per run, keeping schedules maintenance-free.","Security is unaffected by parameter style.","Failures can still occur.","File length depends on data, not parameter style."]},
/* --- more Section 2: REST, SOAP, WQL --- */
{s:2,q:"A REST call returns HTTP 403.\n\nWhat does this indicate compared with 401?",o:["The caller is authenticated but not authorized to access this resource.","The caller failed authentication entirely.","The resource does not exist.","The server crashed."],a:0,e:["Correct — 403 Forbidden means identity is known but access is denied; 401 means authentication failed.","That describes 401, not 403.","A missing resource is 404.","A server crash is a 5xx code."]},
{s:2,q:"A REST call returns HTTP 400.\n\nWhat is the most likely cause?",o:["The request was malformed or failed validation (bad body, missing parameter, wrong type).","The token expired.","The endpoint is rate limiting.","The server had an internal fault."],a:0,e:["Correct — 400 Bad Request points to a malformed or invalid request.","Expired tokens produce 401.","Rate limiting is 429.","Internal faults are 5xx."]},
{s:2,q:"Your orchestration uses OAuth 2.0 client credentials to reach a partner API.\n\nWhat does it obtain first?",o:["An access token from the token endpoint, then uses it as a bearer token.","A CSV file of workers.","A PGP key from the vendor.","A WQL result set."],a:0,e:["Correct — client-credentials flow exchanges the client id/secret for an access token used on subsequent calls.","Workers are business data, not an auth artifact.","PGP keys secure files; they are not OAuth tokens.","WQL queries Workday, not the partner's auth server."]},
{s:2,q:"You need to page a REST API that returns a nextPageToken in each response.\n\nWhat is the loop condition?",o:["Continue calling with the returned token until no nextPageToken is present.","Call exactly twice and stop.","Loop forever regardless of the token.","Never loop; one call is always complete."],a:0,e:["Correct — you follow the token until the response omits it, signaling the end.","A fixed two calls will miss or over-fetch depending on data.","Looping forever ignores the natural stop condition and risks runaway calls.","One call returns only the first page for a paged API."]},
{s:2,q:"Which WQL clause chooses the business object you are querying?",o:["FROM.","SELECT.","WHERE.","ORDER BY."],a:0,e:["Correct — FROM specifies the source business object.","SELECT lists the fields to return.","WHERE filters rows.","ORDER BY sorts results."]},
{s:2,q:"You want WQL results sorted by hire date, newest first.\n\nWhich clause and direction?",o:["ORDER BY hire date DESC.","GROUP BY hire date.","WHERE hire date DESC.","SELECT hire date DESC."],a:0,e:["Correct — ORDER BY with DESC sorts newest first.","GROUP BY aggregates; it does not sort for display order.","WHERE filters and does not take a sort direction.","SELECT projects columns; it does not sort."]},
{s:2,q:"A SOAP request must target a specific version of a Workday web service.\n\nWhere is the version indicated?",o:["In the endpoint URL/namespace for that web service version.","In the report title.","In the SFTP path.","In a calculated field."],a:0,e:["Correct — the web-service version is part of the endpoint/namespace you call.","Titles are cosmetic UI text.","SFTP paths are for file transport, not SOAP versions.","Calculated fields shape data, not endpoints."]},
{s:2,q:"Which is a correct reason to use SOAP Get operations rather than a REST/WQL read?",o:["You need a specific delivered operation and its detailed response elements that only the SOAP API exposes.","You want the smallest possible JSON.","You want to avoid schemas entirely.","REST cannot read Workday data."],a:0,e:["Correct — some detailed delivered operations are exposed via SOAP and return structured elements you need.","Minimal JSON favors REST/WQL, not SOAP.","SOAP is schema-driven; it does not avoid schemas.","REST/RaaS/WQL can read Workday data."]},
{s:2,q:"An orchestration must extract one field from a large JSON response.\n\nWhat is the efficient approach?",o:["Navigate directly to the field via its path rather than parsing the entire document manually.","Convert the JSON to a PDF first.","Email the JSON to a person to read.","Re-query with SOAP for the same field."],a:0,e:["Correct — direct path navigation extracts the field without heavy manual parsing.","PDF conversion adds needless steps and loses structure.","Human reading is not an automated extraction.","Switching to SOAP for one field is unnecessary overhead."]},
{s:2,q:"A REST response returns HTTP 405.\n\nWhat is wrong?",o:["The HTTP method used is not allowed for that endpoint (for example POST where only GET is supported).","The token is invalid.","The body failed validation.","The server is overloaded."],a:0,e:["Correct — 405 Method Not Allowed means the endpoint rejects that HTTP verb.","Invalid tokens give 401.","Validation failures are typically 400/422.","Overload is often 503, a 5xx code."]},
{s:2,q:"You must combine active workers with their manager's name in one read without maintaining a report.\n\nWhich fits best?",o:["A WQL query traversing the manager relationship, filtered on active status.","A SOAP Put operation.","A sequence generator.","An outbound EIB."],a:0,e:["Correct — WQL traverses related objects and filters in one self-contained query.","Put operations write data; this is a read.","Sequence generators build identifiers, not queries.","An outbound EIB requires a maintained report and delivers files, not an inline read."]},
{s:2,q:"A partner API requires a custom header on every request (for example an API key header).\n\nWhere is this configured in the orchestration call?",o:["In the request headers of the REST/HTTP step.","In the WQL SELECT clause.","In the report prompt.","In the retention policy."],a:0,e:["Correct — custom headers such as an API key are set on the HTTP request step.","WQL SELECT lists fields, not HTTP headers.","Report prompts feed report inputs, not external headers.","Retention governs file lifecycle."]},
{s:2,q:"What does WQL return by default that makes it convenient for orchestrations?",o:["Structured JSON that steps can navigate by field name.","A binary PDF.","Raw SQL rows over ODBC.","An encrypted archive."],a:0,e:["Correct — WQL returns JSON that is easy to navigate downstream.","PDF is for viewing, not field navigation.","WQL is not an ODBC/SQL wire protocol.","WQL output is not an encrypted archive by default."]},
{s:2,q:"An orchestration should only proceed if a REST call returns HTTP 200.\n\nWhat is the correct check?",o:["Inspect the response status code and branch on 200 (success) versus other codes.","Assume success and continue always.","Check only the response length.","Retry regardless of status."],a:0,e:["Correct — branch on the status code so only successful responses continue.","Assuming success ignores real errors.","Length alone does not indicate success.","Blind retry ignores the outcome and can loop on hard failures."]},
/* --- more Section 3: Build orchestration --- */
{s:3,q:"Which orchestration step type is used to call a web service or external endpoint?",o:["An invoke/HTTP (service call) step.","A mapping-only step.","A logging step.","A gateway step."],a:0,e:["Correct — invoke/service-call steps perform the outbound call.","Mapping steps transform data, they do not call services.","Logging steps record messages.","Gateways branch flow; they do not make calls."]},
{s:3,q:"You need the flow to take one of three paths based on a status value.\n\nWhich construct is appropriate?",o:["A gateway/router that branches on the status.","A single linear sequence with no branching.","A retention policy.","An encryption step."],a:0,e:["Correct — a gateway/router directs the flow down the matching branch.","A linear sequence cannot choose among paths.","Retention governs files, not flow.","Encryption secures data, it does not branch."]},
{s:3,q:"Data produced by an early step must be available to a later step.\n\nHow is this achieved?",o:["Store it in a variable/output that later steps reference.","Print it to a PDF.","Email it between steps.","Recompute it from scratch each time."],a:0,e:["Correct — orchestrations pass data through variables/outputs between steps.","PDFs are for humans, not inter-step data passing.","Email is not an internal data channel.","Recomputing wastes effort and risks inconsistency."]},
{s:3,q:"You want to run two independent calls at the same time to reduce runtime.\n\nWhich pattern applies where supported?",o:["Parallel execution of the independent branches.","Strictly sequential execution only.","A single conditional.","A retention policy."],a:0,e:["Correct — independent work can run in parallel to reduce total time where the tool supports it.","Forcing sequence wastes time when steps are independent.","One conditional does not parallelize work.","Retention is unrelated to execution timing."]},
{s:3,q:"An orchestration should handle a failed step gracefully and continue with a fallback.\n\nWhat construct supports this?",o:["A try/catch (error-handling) path around the risky step.","No handling; let it crash.","A sequence generator.","A delivery transport."],a:0,e:["Correct — catching the error lets the flow route to a fallback instead of crashing.","No handling makes the whole run fail on the first error.","Sequence generators build identifiers, not error paths.","Transports move files, not handle errors."]},
{s:3,q:"You must transform each element of an array and collect the results into a new array.\n\nWhich combination fits?",o:["A loop over the array with a mapping step, accumulating results.","A single mapping step with no loop.","A gateway with no body.","A retention setting."],a:0,e:["Correct — iterate and map each element, collecting outputs into a result set.","A single map cannot iterate a variable-length array element by element.","An empty gateway does no transformation.","Retention governs files, not transformation."]},
{s:3,q:"Before installing an orchestration, testing with representative sample data primarily lets you verify what?",o:["That logic, branching, and error handling behave correctly on realistic inputs.","That the tenant is encrypted.","That the ISU password is strong.","That the vendor received a file."],a:0,e:["Correct — sample-data testing validates behavior before deployment.","Testing does not encrypt tenants.","Password strength is a security setting, not a test outcome.","Delivery happens at runtime after install, not during Builder testing."]},
{s:3,q:"Why keep transformation logic separate from service-call logic in an orchestration?",o:["Separation of concerns makes each part easier to test, reuse, and troubleshoot.","It encrypts the data automatically.","It removes the need for security.","It doubles the file size."],a:0,e:["Correct — modular separation improves testability, reuse, and clarity.","Structure does not perform encryption.","Security is still required regardless of structure.","Structure does not inflate output size."]},
{s:3,q:"An orchestration must not send a downstream call when the input list is empty.\n\nWhat should you add?",o:["A guard/conditional that checks for an empty list and skips the call.","An unconditional call every run.","A retry loop.","A larger timeout."],a:0,e:["Correct — guard the call so an empty input skips it, avoiding pointless or failing requests.","Calling unconditionally wastes calls and may error on empty input.","Retry does not address the empty-input case.","Timeout tuning does not prevent an unnecessary call."]},
{s:3,q:"You want consistent error messages across an orchestration.\n\nWhat is a good practice?",o:["Centralize message formatting (for example via a shared step) so messages are uniform and searchable.","Let each step write ad hoc messages in any format.","Suppress all messages.","Only log to the vendor's system."],a:0,e:["Correct — uniform, centralized messages make logs consistent and easy to search.","Ad hoc formats make troubleshooting harder.","Suppressing messages removes diagnostic value.","The vendor cannot see your internal orchestration logs."]},
{s:3,q:"A step must map Workday field names to the vendor's expected field names.\n\nWhich step type does this?",o:["A mapping/transformation step.","A gateway.","A logging step.","An encryption step."],a:0,e:["Correct — mapping steps rename/reshape fields to the target contract.","Gateways branch flow, not map fields.","Logging records messages, not transformations.","Encryption secures data, it does not rename fields."]},
{s:3,q:"Which is the safest way to reference an environment-specific value (like a base URL) in an orchestration?",o:["Externalize it as a parameter/configuration rather than hard-coding it in a step.","Hard-code the production URL inline.","Store it in the output filename.","Put it in a comment only."],a:0,e:["Correct — parameterized configuration keeps one orchestration usable across environments.","Hard-coding forces edits and risks wrong-environment calls.","Filenames are not configuration stores.","A comment is not read at runtime."]},
{s:3,q:"You need to build a JSON request body from several source fields.\n\nWhich step assembles it?",o:["A mapping/transformation step that constructs the JSON payload.","A delivery transport.","A retention policy.","A sequence generator."],a:0,e:["Correct — a transformation step composes the outbound JSON from source fields.","Transports move the finished payload; they do not build it.","Retention governs lifecycle, not payload assembly.","Sequence generators build identifiers, not JSON bodies."]},
{s:3,q:"An orchestration must summarize how many records succeeded and failed at the end.\n\nWhat supports this?",o:["Counters accumulated during the loop, output in a final summary/log.","A single conditional at the start.","The vendor's server logs.","The output filename only."],a:0,e:["Correct — accumulate counters through the run and emit a final summary.","A start-of-run conditional cannot count end-of-run outcomes.","Vendor logs do not see your per-record processing.","A filename cannot convey success/failure counts reliably."]},
/* --- more Section 4: Inbound & Outbound orchestration --- */
{s:4,q:"An installed outbound orchestration must run under a controlled identity and be schedulable.\n\nWhat provides this in the tenant?",o:["The linked integration system with its ISU and schedule.","The Orchestration Builder alone.","The vendor's crontab.","A personal report subscription."],a:0,e:["Correct — the tenant-side integration system supplies identity and scheduling.","The Builder authors logic but does not schedule in the tenant.","The vendor's crontab cannot launch Workday runs.","A report subscription is not an integration run identity."]},
{s:4,q:"An inbound orchestration retrieves a vendor file, transforms it, and must create Workday records.\n\nWhich step performs the write?",o:["A service-call step invoking the appropriate Workday web service to create the records.","A delivery transport step.","A logging step.","A retention setting."],a:0,e:["Correct — writing into Workday is done by calling the relevant web service operation.","Delivery sends files out; it does not create records.","Logging records messages, not data writes.","Retention governs file lifecycle only."]},
{s:4,q:"An outbound orchestration must deliver to two different vendor endpoints.\n\nWhat is a clean approach?",o:["Configure two delivery targets/steps, one per endpoint, from the same produced output.","Manually copy the file to the second vendor.","Refuse the second delivery.","Encrypt twice with the same key to duplicate it."],a:0,e:["Correct — multiple delivery steps/targets send the same output to each endpoint.","Manual copying is not an automated delivery.","Refusing a requirement is not a solution.","Double encryption does not create a second delivery."]},
{s:4,q:"For an inbound orchestration that writes data, whose permissions decide if the write is allowed?",o:["The integration system's ISU via its ISSG domain and operation permissions.","The developer's browser session.","The vendor's SFTP account.","No one; inbound writes bypass security."],a:0,e:["Correct — the run executes as the ISU, whose ISSG must permit the write.","Scheduled runs do not use a person's session.","External SFTP credentials govern pickup, not Workday writes.","Security always applies to writes."]},
{s:4,q:"An outbound orchestration should only send records changed since the last run.\n\nWhich technique fits an orchestration design?",o:["Query on a last-modified timestamp or maintain a high-water mark between runs.","Assume connector change detection is automatically applied.","Send everything and let the vendor deduplicate.","Delete source records after sending."],a:0,e:["Correct — timestamp filtering or a persisted watermark implements deltas in orchestrations.","Connector change detection is not automatically part of an orchestration you built.","Full sends push work onto the vendor and waste resources.","Deleting source data to control a feed is destructive."]},
{s:4,q:"You must run the same outbound orchestration against test and production vendor endpoints without duplicating it.\n\nWhat is best practice?",o:["Parameterize the endpoint and supply the environment value at launch/schedule.","Keep two forked copies forever.","Hard-code production and edit for tests.","Ask the vendor to route it."],a:0,e:["Correct — a single parameterized orchestration serves both environments safely.","Forked copies drift and are hard to maintain.","Hard-coding invites wrong-environment sends.","Routing is not the vendor's responsibility and does not solve your config."]},
{s:4,q:"An inbound file occasionally contains duplicate keys.\n\nWhat is a robust orchestration behavior?",o:["Detect duplicates, decide a rule (skip or update), and log the handling.","Let duplicates create conflicting writes silently.","Reject the whole file with no detail.","Ignore keys entirely."],a:0,e:["Correct — deliberate duplicate handling with logging keeps writes consistent and traceable.","Silent conflicting writes corrupt data.","All-or-nothing rejection with no detail hinders correction.","Ignoring keys risks writing to the wrong records."]},
{s:4,q:"After an outbound run, the event shows the file generated but delivery failed.\n\nWhere do you look first?",o:["The delivery/transport step result and endpoint credentials/connectivity.","The WQL SELECT clause.","The calculated field library.","The report prompt list."],a:0,e:["Correct — generated-but-not-delivered points to the transport step or endpoint config.","Query projection does not affect delivery.","Field definitions are unrelated to transport.","Prompts affect data read, not delivery."]},
{s:4,q:"An inbound orchestration must confirm each write succeeded before moving to the next record.\n\nWhat should it check?",o:["The response of each write call, handling failures per record.","Only the final file size.","Nothing; assume success.","The vendor's SFTP timestamp."],a:0,e:["Correct — inspect each write's response so failures are handled individually.","File size does not confirm per-record writes.","Assuming success hides real failures.","An SFTP timestamp confirms pickup, not Workday write success."]},
/* --- more Section 5: Reuse code & secure orchestrations --- */
{s:5,q:"Multiple orchestrations call the same partner API with identical auth setup.\n\nWhat reduces duplication and eases credential rotation?",o:["A shared/reusable connection (and a reusable auth suborchestration) referenced by each.","Copying the auth steps into every orchestration.","Storing the secret in each output filename.","Letting each developer hard-code their own token."],a:0,e:["Correct — a shared connection and reusable auth centralize setup and simplify rotation.","Copying duplicates maintenance and spreads secrets.","Filenames are not secret stores.","Divergent hard-coded tokens are insecure and inconsistent."]},
{s:5,q:"A secret used by an orchestration must be rotated without editing every flow.\n\nWhat design supports this?",o:["Reference the secret from a central secure store so rotation happens in one place.","Hard-code it in each code step.","Email it whenever it changes.","Put it in a shared spreadsheet."],a:0,e:["Correct — centralizing the secret means one update rotates it everywhere.","Hard-coding forces edits across every flow.","Emailing secrets exposes them broadly.","Spreadsheets are an insecure, manual store."]},
{s:5,q:"A suborchestration's interface (inputs/outputs) is about to change.\n\nWhat is the safe practice?",o:["Version and coordinate the change so existing callers keep working or are updated together.","Change it silently and hope nothing breaks.","Delete it and let callers fail.","Rename it randomly."],a:0,e:["Correct — managing versions and coordinating callers prevents breakage.","Silent interface changes break dependents.","Deleting a shared component breaks every caller.","Random renames orphan callers."]},
{s:5,q:"Which is the strongest reason to encapsulate retry-with-backoff in a reusable component?",o:["Consistent, tested resilience behavior everywhere instead of ad hoc per-flow logic.","It hides all errors from view.","It removes the need for an ISU.","It encrypts the tenant."],a:0,e:["Correct — a shared, tested retry policy standardizes resilience across integrations.","Good retry surfaces persistent errors; it does not hide them.","Runs still execute under an ISU.","Retry logic does not perform encryption."]},
{s:5,q:"An orchestration integration should follow least privilege.\n\nWhat does that mean in practice?",o:["Its ISSG grants only the specific domains and operations the integration actually uses.","Its ISU is an administrator for convenience.","It has access to every domain in case it is needed.","Its domain security is turned off."],a:0,e:["Correct — grant only what is used, nothing more.","Admin access is far beyond least privilege.","Granting everything is a serious over-permission risk.","Domain security is not disabled for integrations."]},
{s:5,q:"Why define clear inputs and outputs for a reusable suborchestration?",o:["A clear contract lets many callers use it safely without depending on its internals.","So it can access the ISU password.","So it can bypass security.","So it can skip logging."],a:0,e:["Correct — a defined contract is what makes reuse safe and predictable.","Suborchestrations do not expose credentials as inputs.","Reuse does not bypass security.","Logging is still valuable in reusable components."]},
{s:5,q:"A partner requires OAuth 2.0; you must store the client id and secret used by several orchestrations.\n\nWhere should they live?",o:["In a secure credential/connection object referenced at runtime, not in flow logic.","Inline in each code step as plain text.","In the report title.","In a public wiki page."],a:0,e:["Correct — credentials belong in secure, referenced storage, kept out of logic.","Plain-text inline secrets are a serious risk.","Titles are visible and not secret stores.","Public pages expose secrets to everyone."]},
{s:5,q:"You want new integrations to reuse a validated transformation without copying it.\n\nWhat enables this?",o:["Publishing it as a reusable suborchestration with a defined interface.","Pasting the steps into each new integration.","Emailing the steps to teammates.","Storing it as a screenshot."],a:0,e:["Correct — a published, interfaced suborchestration is reused by reference, not by copy.","Pasting duplicates and drifts.","Emailing steps does not make them reusable in the tool.","A screenshot is not executable logic."]},
/* --- more Section 6: Troubleshooting --- */
{s:6,q:"An orchestration's REST step fails with HTTP 403 while a similar call in a test tool works.\n\nWhat is the likely difference?",o:["The orchestration's identity/scope lacks authorization the test tool had (wrong or under-privileged credentials).","The endpoint does not exist.","JSON is unsupported.","The vendor blocked all traffic."],a:0,e:["Correct — 403 with a working test tool usually means the orchestration's credentials/scope are insufficient.","A missing endpoint would be 404, and the test tool would also fail.","Orchestrations handle JSON fine.","A full block would fail the test tool too."]},
{s:6,q:"An orchestration errors while parsing a response with the message that the content is not valid JSON.\n\nWhat is the most likely cause?",o:["The endpoint returned non-JSON (for example an HTML error page or empty body) that the parse step did not expect.","The ISU password expired.","The schedule was disabled.","The report had too many columns."],a:0,e:["Correct — a non-JSON response (error page/empty body) breaks a JSON parse step; check the raw response and status.","Password expiry would surface as auth errors, not a JSON parse failure.","A disabled schedule prevents the run, not a parse error mid-run.","Column count is unrelated to JSON parsing."]},
{s:6,q:"A WQL step returns zero rows in production but rows in your own test.\n\nWhat should you check first?",o:["The ISU's security: it may not be permitted to see the data the query targets.","The output filename sequence.","The retention period.","The vendor's public key."],a:0,e:["Correct — WQL honors the caller's security, so an under-permissioned ISU can legitimately see zero rows.","Filenames do not affect query results.","Retention governs files, not query rows.","Keys are for encryption, unrelated to query results."]},
{s:6,q:"An inbound load fails many rows with a message about an invalid value for a reference field.\n\nWhat is the usual root cause?",o:["The source values do not match valid Workday reference IDs/values the field expects.","The SFTP handshake failed.","Change detection produced an empty file.","The report was not shared."],a:0,e:["Correct — reference fields require valid IDs/values; mismatches cause per-row failures.","A handshake failure blocks retrieval entirely, not per-row reference errors.","Change detection is an outbound feature, unrelated here.","Sharing affects reads, not inbound reference validation."]},
{s:6,q:"A SOAP call returns a fault indicating a validation error on a required element.\n\nWhat is the fix?",o:["Populate all mandatory elements with correctly typed values per the operation's schema.","Rotate the SFTP password.","Enable change detection.","Increase document retention."],a:0,e:["Correct — supply the required, correctly typed elements the schema mandates.","SFTP credentials are unrelated to a SOAP body.","Change detection is a connector concept, not SOAP validation.","Retention governs files, not request validity."]},
{s:6,q:"A scheduled orchestration produced nothing overnight, and no event appears.\n\nWhat is the most likely cause to check first?",o:["The schedule is disabled or was not created/owned correctly.","The JSON was too large.","The vendor changed their logo.","The calculated field was renamed."],a:0,e:["Correct — no event at all usually means the schedule did not fire (disabled or misconfigured).","Payload size would produce an event with errors, not no event.","Cosmetic vendor changes do not stop your schedule.","A rename would cause a run error, not a missing run."]},
{s:6,q:"An orchestration times out on an external call that normally responds quickly.\n\nWhat is a reasonable first response?",o:["Treat it as possibly transient: apply/verify retry with backoff and check the endpoint's health.","Conclude the integration is permanently broken and delete it.","Rotate the ISU immediately.","Switch every call to SOAP."],a:0,e:["Correct — a one-off timeout is often transient; bounded retry plus an endpoint health check is the right first move.","Deleting on one timeout is drastic and premature.","The ISU is unrelated to an external timeout.","Changing API style does not address a network timeout."]},
{s:6,q:"Two environments run the same orchestration but only production fails auth.\n\nWhat is the disciplined check?",o:["Compare the credentials/secrets and endpoint configuration between environments.","Rewrite the orchestration for production only.","Disable production security.","Ask the vendor to change their API."],a:0,e:["Correct — auth failing only in production points to environment-specific credentials/config drift.","Forking logic invites divergence and does not find the cause.","Disabling security is unsafe and hides the real issue.","Changing the vendor API is premature before checking your own config."]},
{s:6,q:"An event completed but the vendor says the file is empty.\n\nWhich cause fits an orchestration that queries changed data?",o:["No records met the change criteria for that run, producing an empty result.","The tenant was refreshed.","The ISU name changed.","The retention period is too long."],a:0,e:["Correct — with delta logic, a run with no qualifying changes legitimately yields an empty file; verify the criteria and watermark.","A refresh would more likely break config than silently empty a file.","ISU naming does not affect content.","A long retention period keeps files longer; it does not empty them."]},
{s:6,q:"An orchestration fails at a mapping step with a null-reference error only for some inputs.\n\nWhat is the robust fix?",o:["Add null/presence checks and handle optional fields before mapping them.","Assume every field is always present.","Remove the mapping step.","Convert the flow to an EIB."],a:0,e:["Correct — guarding optional fields prevents null-reference failures on sparse inputs.","Assuming presence is what caused the failure.","Removing the mapping loses required logic.","Switching tools does not fix unguarded field access."]}

];
</script>
<script>
"use strict";
/* ============ engine ============ */
const $ = (s,r=document)=>r.querySelector(s);
const app = $("#app");
const LETTER = ["A","B","C","D","E"];
Q.forEach((q,i)=>q.id=i);

const ARCH = `<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 26 A14 14 0 0 1 34 26" fill="none" stroke="var(--arch)" stroke-width="4" stroke-linecap="round"/></svg>`;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* shuffle a question's options, tracking the new correct index */
function prepare(q){
  const order = shuffle(q.o.map((_,i)=>i));
  return {
    ref:q, sec:q.s,
    stem:q.q,
    opts:order.map(i=>q.o[i]),
    exps:order.map(i=>q.e[i]),
    correct:order.indexOf(q.a)
  };
}

/* ---------- HOME ---------- */
function home(){
  const total = Q.length;
  const counts = SECTIONS.map((_,s)=>Q.filter(q=>q.s===s).length);
  let bar = SECTIONS.map(s=>`<span style="width:${s.w}%;background:${s.color}"></span>`).join("");
  let legend = SECTIONS.map((s,i)=>`<div class="row"><span class="sw" style="background:${s.color}"></span>${esc(s.short)} <span class="pct">${s.w}% · ${counts[i]} q</span></div>`).join("");
  app.innerHTML = `
  <div class="wrap">
    <div class="brand">${ARCH}<span class="name">Workday Integrations<span class="dot">.</span> Practice</span></div>
    <div class="hero">
      <h1>Practice for the Workday Integrations certification</h1>
      <p class="sub">Scenario-based questions across all exam domains, drawn from Creating and Securing Integrations and Creating Integrations Using Workday Orchestrate. Learning mode explains every option; Exam mode mirrors the timed Questionmark format.</p>
      <div class="bp">
        <div class="bar">${bar}</div>
        <div class="legend">${legend}</div>
      </div>
    </div>
    <div class="modes">
      <button class="mode" id="mLearn">
        <h2>Learning mode</h2>
        <p>Work through the full bank of ${total} questions. Answer, then see why the right choice is right and each wrong choice is wrong. Filter by domain.</p>
        <span class="go">Start learning</span>
      </button>
      <button class="mode" id="mExam">
        <h2>Exam mode</h2>
        <p>A timed, weighted mock exam in the Questionmark style: progress bar, question flagging, navigator, and a ${PASS_PCT}% pass bar with a full review afterward.</p>
        <span class="go">Start exam</span>
      </button>
    </div>
    <div class="foot">Unofficial study aid built from the public course-manual topics and blueprint weighting. Not affiliated with or endorsed by Workday. Your progress stays in this browser tab.</div>
  </div>`;
  $("#mLearn").onclick=()=>startLearn();
  $("#mExam").onclick=()=>examConfig();
}

/* ---------- LEARNING ---------- */
let L = null;
function startLearn(filter=-1){
  const pool = filter<0 ? Q.slice() : Q.filter(q=>q.s===filter);
  L = {filter, list:shuffle(pool).map(prepare), i:0, answered:0, correct:0, picked:null, done:false};
  renderLearn();
}
function renderLearn(){
  const q = L.list[L.i];
  const chips = [`<button class="chip ${L.filter<0?'sel':''}" data-f="-1">All domains</button>`]
    .concat(SECTIONS.map((s,i)=>`<button class="chip ${L.filter===i?'sel':''}" data-f="${i}">${esc(s.short)}</button>`)).join("");
  const pct = L.answered? Math.round(L.correct/L.answered*100):0;
  app.innerHTML = `
    <div class="topbar"><div class="in">
      <button class="back" id="back">← Menu</button>
      <div class="stat"><span>Score <b>${L.correct}/${L.answered}</b> (${pct}%)</span><span>Question <b>${L.i+1}</b> of ${L.list.length}</span></div>
    </div></div>
    <div class="chips">${chips}</div>
    <div class="wrap">
      <div class="qcard">
        <div class="qmeta"><span class="sec">${esc(SECTIONS[q.sec].short)}</span><span>${esc(SECTIONS[q.sec].src)}</span></div>
        <div class="stem">${esc(q.stem)}</div>
        <div class="opts" id="opts">
          ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="radio"></span><span><b>${LETTER[i]}.</b> ${esc(o)}</span></button>`).join("")}
        </div>
        <div class="explain" id="explain"></div>
      </div>
      <div class="wrap" style="padding:0"><div class="learnnav">
        <button class="btn ghost" id="prev" ${L.i===0?'disabled':''}>Previous</button>
        <button class="btn" id="next" ${L.i>=L.list.length-1?'disabled':''}>Next</button>
        <span class="count">${L.answered} answered this session</span>
      </div></div>
    </div>`;
  $("#back").onclick=home;
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>startLearn(+c.dataset.f));
  $("#prev").onclick=()=>{if(L.i>0){L.i--;L.picked=null;renderLearn();}};
  $("#next").onclick=()=>{if(L.i<L.list.length-1){L.i++;L.picked=null;renderLearn();}};
  const optEls = [...document.querySelectorAll("#opts .opt")];
  if(q.picked!=null){ lockLearn(q); }
  optEls.forEach(el=>el.onclick=()=>{
    if(q.picked!=null) return;
    q.picked = +el.dataset.i;
    L.answered++; if(q.picked===q.correct) L.correct++;
    lockLearn(q);
    // refresh score line
    const pct2 = Math.round(L.correct/L.answered*100);
    document.querySelector(".stat b").textContent = `${L.correct}/${L.answered}`;
    document.querySelector(".stat span b").parentElement.innerHTML = `Score <b>${L.correct}/${L.answered}</b> (${pct2}%)`;
  });
}
function lockLearn(q){
  const optEls=[...document.querySelectorAll("#opts .opt")];
  optEls.forEach((el,i)=>{
    el.disabled=true; el.classList.add("dim");
    if(i===q.correct) el.classList.add("correct");
    if(i===q.picked && q.picked!==q.correct) el.classList.add("wrong");
    if(i===q.correct||i===q.picked) el.classList.remove("dim");
  });
  const good = q.picked===q.correct;
  const ex = $("#explain");
  ex.classList.add("on");
  ex.innerHTML = `
    <div class="verdict ${good?'good':'bad'}">${good?'Correct.':'Not quite.'} The right answer is ${LETTER[q.correct]}.</div>
    <div class="why">
      ${q.opts.map((o,i)=>`<div class="w ${i===q.correct?'right':''}"><span class="mark">${i===q.correct?'✓':'✕'}</span><span><b>${LETTER[i]}.</b> ${esc(q.exps[i])}</span></div>`).join("")}
    </div>`;
}

/* ---------- EXAM ---------- */
let E=null, timer=null;
function examConfig(){
  app.innerHTML=`
   <div class="wrap">
     <div class="brand">${ARCH}<span class="name">Exam setup</span></div>
     <div class="hero">
       <h1>Choose your exam length</h1>
       <p class="sub">Questions are weighted to match the blueprint, just like the real exam. The 20-question form mirrors the official timing of 20 questions in 60 minutes.</p>
       <div class="examlen" id="len">
         <span>Length:</span>
         <button data-n="20" class="sel">20 questions · 60 min</button>
         <button data-n="40">40 questions · 120 min</button>
         <button data-n="60">60 questions · 180 min</button>
       </div>
       <div class="learnnav" style="margin-top:20px">
         <button class="btn ghost" id="back">Back</button>
         <button class="btn" id="go">Begin exam</button>
       </div>
     </div>
   </div>`;
  let n=20;
  $("#back").onclick=home;
  document.querySelectorAll("#len button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#len button").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); n=+b.dataset.n;
  });
  $("#go").onclick=()=>startExam(n);
}
function buildExam(n){
  // scale the 20-question blueprint mix to n
  const scale=n/20;
  const picks=[];
  SECTIONS.forEach((s,si)=>{
    let want=Math.round(EXAM_MIX_20[si]*scale);
    const pool=shuffle(Q.filter(q=>q.s===si));
    picks.push(...pool.slice(0,Math.min(want,pool.length)));
  });
  // adjust to exactly n
  let all=shuffle(Q.slice());
  let chosen=shuffle(picks);
  if(chosen.length>n) chosen=chosen.slice(0,n);
  const ids=new Set(chosen.map(q=>q.id));
  for(const q of all){ if(chosen.length>=n) break; if(!ids.has(q.id)){chosen.push(q);ids.add(q.id);} }
  return shuffle(chosen).map(prepare);
}
function startExam(n){
  E={list:buildExam(n), i:0, secs:n*180, flags:new Set(), navOpen:false};
  renderExam();
  clearInterval(timer);
  timer=setInterval(()=>{
    E.secs--;
    if(E.secs<=0){clearInterval(timer);gradeExam();return;}
    const t=$("#time"); if(t){t.textContent=fmt(E.secs); t.classList.toggle("low",E.secs<=300);}
  },1000);
}
function fmt(s){const h=String(Math.floor(s/3600)).padStart(2,"0");const m=String(Math.floor(s%3600/60)).padStart(2,"0");const x=String(s%60).padStart(2,"0");return `${h}:${m}:${x}`;}
function renderExam(){
  const q=E.list[E.i];
  const prog=Math.round((E.i)/(E.list.length)*100);
  app.innerHTML=`
   <div class="qm-head"><div class="brand" style="padding:0">${ARCH}<span class="name">workday<span class="dot">.</span></span></div></div>
   <div class="qm-bar">
     <span class="plabel">Assessment progress:</span>
     <span class="qm-track"><span class="qm-fill" style="width:${prog}%"></span></span>
     <span class="qm-time" id="time">${fmt(E.secs)}</span>
   </div>
   <div class="qm-body">
     <div class="qm-num">${E.i+1} of ${E.list.length}</div>
     <div class="qm-stem">${esc(q.stem)}</div>
     <div class="qm-opts" id="opts">
       ${q.opts.map((o,i)=>`<button class="qm-opt ${q.picked===i?'sel':''}" data-i="${i}"><span class="radio"></span><span>${esc(o)}</span></button>`).join("")}
     </div>
   </div>
   <div class="qm-foot">
     <button class="qm-btn grey" id="prev" ${E.i===0?'disabled':''}>◀ Previous</button>
     <button class="qm-btn grey" id="next" ${E.i>=E.list.length-1?'disabled':''}>Next ▶</button>
     <button class="qm-btn grey" id="nav">Navigator ▦</button>
     <button class="qm-flag ${E.flags.has(E.i)?'on':''}" id="flag"><span class="bm"></span>Flag</button>
     <button class="qm-btn qm-submit" id="submit">Submit ⏎</button>
   </div>
   <div class="navgrid" id="navgrid"><div class="navpanel">
     <h3>Question navigator</h3>
     <div class="key"><span>▦ current · outlined</span><span>■ answered</span><span>▸ flagged</span></div>
     <div class="cells" id="cells">
       ${E.list.map((_,i)=>`<button class="cell ${E.list[i].picked!=null?'ans':''} ${i===E.i?'cur':''} ${E.flags.has(i)?'flg':''}" data-i="${i}">${i+1}</button>`).join("")}
     </div>
     <button class="btn ghost close" id="closeNav">Close</button>
   </div></div>`;
  document.querySelectorAll("#opts .qm-opt").forEach(el=>el.onclick=()=>{
    q.picked=+el.dataset.i;
    document.querySelectorAll("#opts .qm-opt").forEach(x=>x.classList.remove("sel"));
    el.classList.add("sel");
  });
  $("#prev").onclick=()=>{if(E.i>0){E.i--;renderExam();}};
  $("#next").onclick=()=>{if(E.i<E.list.length-1){E.i++;renderExam();}};
  $("#flag").onclick=()=>{E.flags.has(E.i)?E.flags.delete(E.i):E.flags.add(E.i);renderExam();};
  $("#nav").onclick=()=>{$("#navgrid").classList.add("on");};
  $("#closeNav").onclick=()=>{$("#navgrid").classList.remove("on");};
  $("#navgrid").onclick=(e)=>{if(e.target.id==="navgrid")$("#navgrid").classList.remove("on");};
  document.querySelectorAll("#cells .cell").forEach(c=>c.onclick=()=>{E.i=+c.dataset.i;renderExam();});
  $("#submit").onclick=()=>{
    const un=E.list.filter(x=>x.picked==null).length;
    const msg=un>0?`You have ${un} unanswered question${un>1?'s':''}. Submit anyway and end the exam?`:`Submit the exam and see your score?`;
    if(confirm(msg)) gradeExam();
  };
}
function gradeExam(){
  clearInterval(timer);
  const total=E.list.length;
  const correct=E.list.filter(q=>q.picked===q.correct).length;
  const pct=Math.round(correct/total*100);
  const pass=pct>=PASS_PCT;
  // per-section
  const rows=SECTIONS.map((s,si)=>{
    const qs=E.list.filter(q=>q.sec===si);
    if(!qs.length) return null;
    const c=qs.filter(q=>q.picked===q.correct).length;
    return `<tr><td>${esc(s.short)}</td><td>${c} / ${qs.length}</td></tr>`;
  }).filter(Boolean).join("");
  app.innerHTML=`
   <div class="wrap">
     <div class="brand">${ARCH}<span class="name">Exam results</span></div>
     <div class="res">
       <div class="big">${pct}%</div>
       <div class="pf ${pass?'pass':'fail'}">${pass?'Pass':'Below pass bar'}</div>
       <div class="sub2">${correct} of ${total} correct · pass bar ${PASS_PCT}%</div>
     </div>
     <div class="card">
       <h3>By domain</h3>
       <table class="sect"><thead><tr><th>Domain</th><th>Correct</th></tr></thead><tbody>${rows}</tbody></table>
     </div>
     <div class="card">
       <h3>Review every question</h3>
       ${E.list.map((q,idx)=>{
         const good=q.picked===q.correct;
         const yours = q.picked==null?'<i>No answer</i>':`${LETTER[q.picked]}. ${esc(q.opts[q.picked])}`;
         return `<div class="revq">
           <div class="rs">${idx+1}. ${esc(q.stem)}</div>
           <div class="rv">Your answer: <b class="${good?'g':'b'}">${yours}</b></div>
           ${good?'':`<div class="rv">Correct answer: <b class="g">${LETTER[q.correct]}. ${esc(q.opts[q.correct])}</b></div>`}
           <div class="rv" style="margin-top:6px;color:var(--ink-soft)">${esc(q.exps[q.correct])}</div>
         </div>`;
       }).join("")}
     </div>
     <div class="center">
       <button class="btn" id="retry">New exam</button>
       <button class="btn ghost" id="menu">Back to menu</button>
     </div>
   </div>`;
  $("#retry").onclick=examConfig;
  $("#menu").onclick=home;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
