<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workday Integrations Certification — Practice Exam</title>
<style>
:root{
  --blueberry:#0875e1; --blueberry-dark:#005cb9; --blueberry-soft:#e8f1fc;
  --ink:#333333; --ink-soft:#494949; --ink-faint:#767676;
  --paper:#ffffff; --bg:#f6f7f9; --line:#d4d9e0;
  --arch:#f38b00;
  --good:#1e8a44; --good-soft:#e9f6ee;
  --bad:#d13c30; --bad-soft:#fdeeec;
  --flag:#e5177b;
  --radius:10px;
  --shadow:0 1px 3px rgba(30,42,58,.10), 0 4px 14px rgba(30,42,58,.06);
  font-size:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit;}
button:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--blueberry); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

/* ---------- shared chrome ---------- */
.wrap{max-width:900px; margin:0 auto; padding:0 20px;}
.brand{display:flex; align-items:center; gap:10px; padding:18px 0 10px;}
.brand svg{flex:none;}
.brand .name{font-size:1.35rem; font-weight:600; letter-spacing:.01em; color:var(--ink);}
.brand .dot{color:var(--arch);}
.screen{display:none;}
.screen.on{display:block;}

/* ---------- home ---------- */
.hero{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 28px; margin-top:8px;}
.hero h1{font-size:1.5rem; font-weight:600; line-height:1.3;}
.hero p.sub{color:var(--ink-soft); margin-top:6px; max-width:62ch;}
.bp{margin-top:20px;}
.bp .bar{display:flex; height:16px; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
.bp .bar span{display:block; height:100%;}
.bp .legend{margin-top:12px; display:grid; grid-template-columns:1fr; gap:5px; font-size:.86rem; color:var(--ink-soft);}
.bp .legend .row{display:flex; align-items:center; gap:8px;}
.bp .legend .sw{width:11px; height:11px; border-radius:3px; flex:none;}
.bp .legend .pct{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-faint);}
.modes{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:20px 0;}
@media (max-width:640px){ .modes{grid-template-columns:1fr;} }
.mode{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; text-align:left; display:block; width:100%; transition:border-color .15s;}
.mode:hover{border-color:var(--blueberry);}
.mode h2{font-size:1.08rem; font-weight:600; display:flex; align-items:center; gap:8px;}
.mode p{color:var(--ink-soft); font-size:.92rem; margin-top:6px;}
.mode .go{display:inline-block; margin-top:14px; background:var(--blueberry); color:#fff; padding:8px 16px; border-radius:6px; font-weight:600; font-size:.92rem;}
.examlen{margin-top:12px; display:flex; gap:8px; align-items:center; font-size:.88rem; color:var(--ink-soft);}
.examlen button{border:1.5px solid var(--line); border-radius:6px; padding:4px 12px; font-size:.88rem;}
.examlen button.sel{border-color:var(--blueberry); background:var(--blueberry-soft); color:var(--blueberry-dark); font-weight:600;}
.foot{color:var(--ink-faint); font-size:.82rem; padding:14px 2px 30px;}

/* ---------- learning ---------- */
.topbar{background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;}
.topbar .in{max-width:900px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.topbar .back{color:var(--blueberry); font-weight:600; font-size:.92rem;}
.topbar .stat{margin-left:auto; display:flex; gap:14px; font-size:.88rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
.topbar .stat b{color:var(--ink);}
.chips{max-width:900px; margin:0 auto; padding:10px 20px 2px; display:flex; gap:8px; flex-wrap:wrap;}
.chip{border:1.5px solid var(--line); background:var(--paper); border-radius:999px; padding:5px 13px; font-size:.84rem; color:var(--ink-soft);}
.chip.sel{background:var(--blueberry); border-color:var(--blueberry); color:#fff; font-weight:600;}
.qcard{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px 26px; margin:16px 0;}
.qmeta{display:flex; gap:10px; align-items:center; font-size:.8rem; color:var(--ink-faint); margin-bottom:12px; flex-wrap:wrap;}
.qmeta .sec{background:var(--blueberry-soft); color:var(--blueberry-dark); border-radius:5px; padding:2px 9px; font-weight:600;}
.stem{font-size:1.02rem; white-space:pre-line;}
.opts{margin-top:18px; display:grid; gap:10px;}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; border:1.5px solid var(--line); border-radius:8px; padding:12px 14px; background:var(--paper); transition:border-color .12s, background .12s;}
.opt:not([disabled]):hover{border-color:var(--blueberry);}
.opt .radio{flex:none; width:20px; height:20px; border-radius:50%; border:2.5px solid #23395b; margin-top:1px; position:relative;}
.opt.correct{border-color:var(--good); background:var(--good-soft);}
.opt.correct .radio{border-color:var(--good); background:var(--good);}
.opt.correct .radio::after{content:"✓"; color:#fff; font-size:12px; font-weight:700; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft);}
.opt.wrong .radio{border-color:var(--bad); background:var(--bad);}
.opt.wrong .radio::after{content:"✕"; color:#fff; font-size:11px; font-weight:700; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.opt.dim{opacity:.75;}
.explain{margin-top:16px; border-top:1px solid var(--line); padding-top:14px; display:none;}
.explain.on{display:block;}
.verdict{font-weight:600; margin-bottom:10px;}
.verdict.good{color:var(--good);} .verdict.bad{color:var(--bad);}
.why{display:grid; gap:8px; font-size:.9rem;}
.why .w{display:flex; gap:9px; align-items:flex-start; padding:8px 11px; border-radius:7px; background:var(--bg);}
.why .w.right{background:var(--good-soft);}
.why .mark{flex:none; font-weight:700; width:1.1em;}
.why .w.right .mark{color:var(--good);} .why .w:not(.right) .mark{color:var(--bad);}
.learnnav{display:flex; gap:10px; margin:6px 0 40px; align-items:center;}
.btn{background:var(--blueberry); color:#fff; border-radius:6px; padding:10px 20px; font-weight:600; font-size:.94rem;}
.btn:hover{background:var(--blueberry-dark);}
.btn.ghost{background:var(--paper); color:var(--blueberry); border:1.5px solid var(--blueberry);}
.btn[disabled]{opacity:.45; cursor:default;}
.learnnav .count{margin-left:auto; color:var(--ink-faint); font-size:.88rem; font-variant-numeric:tabular-nums;}

/* ---------- exam (Questionmark look) ---------- */
.qm-head{background:var(--paper); padding:10px 24px 8px; border-bottom:0;}
.qm-bar{background:#0b6fd6; color:#fff; padding:12px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.qm-bar .plabel{font-size:1rem;}
.qm-track{flex:1 1 160px; max-width:340px; height:14px; background:#fff; border-radius:8px; overflow:hidden;}
.qm-fill{height:100%; width:0%; background:#59c3e8; transition:width .2s;}
.qm-time{font-variant-numeric:tabular-nums; font-size:1rem;}
.qm-time.low{color:#ffd3cd; font-weight:700;}
.qm-body{max-width:960px; margin:0 auto; padding:26px 28px 120px;}
.qm-num{font-size:1.02rem; margin-bottom:8px;}
.qm-stem{font-size:1.06rem; white-space:pre-line;}
.qm-opts{margin-top:22px; display:grid; gap:14px;}
.qm-opt{display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%; padding:2px 0;}
.qm-opt .radio{flex:none; width:22px; height:22px; border-radius:50%; border:3px solid #23395b; margin-top:0; position:relative; background:#fff;}
.qm-opt.sel .radio{border-color:#0b6fd6; background:#0b6fd6;}
.qm-opt.sel .radio::after{content:"✓"; color:#fff; font-size:13px; font-weight:700; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.qm-foot{position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line); padding:12px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; z-index:6;}
.qm-btn{background:#0b6fd6; color:#fff; border-radius:4px; padding:11px 18px; font-weight:600; font-size:.95rem;}
.qm-btn:hover{background:#0959ab;}
.qm-btn.grey{background:#5a6069;}
.qm-btn.grey:hover{background:#474c54;}
.qm-flag{display:flex; align-items:center; gap:7px; color:var(--ink); font-weight:600; font-size:.9rem;}
.qm-flag .bm{width:16px; height:20px; border:2.5px solid var(--flag); border-bottom:none; position:relative; display:inline-block;}
.qm-flag .bm::after{content:""; position:absolute; left:-2.5px; right:-2.5px; bottom:-7px; border-left:9.5px solid var(--flag); border-right:9.5px solid var(--flag); border-bottom:7px solid transparent;}
.qm-flag.on{color:var(--flag);}
.qm-flag.on .bm{background:var(--flag);}
.qm-submit{margin-left:auto;}
.navgrid{position:fixed; inset:0; background:rgba(20,28,40,.55); display:none; z-index:9;}
.navgrid.on{display:flex; align-items:center; justify-content:center; padding:20px;}
.navpanel{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; max-width:560px; width:100%;}
.navpanel h3{font-size:1.02rem; margin-bottom:6px;}
.navpanel .key{font-size:.8rem; color:var(--ink-faint); margin-bottom:14px; display:flex; gap:14px; flex-wrap:wrap;}
.navpanel .cells{display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:8px;}
.cell{border:1.5px solid var(--line); border-radius:6px; padding:9px 0; text-align:center; font-weight:600; position:relative; font-variant-numeric:tabular-nums;}
.cell.ans{background:var(--blueberry-soft); border-color:var(--blueberry);}
.cell.cur{outline:2.5px solid var(--ink);}
.cell.flg::after{content:""; position:absolute; top:3px; right:4px; width:7px; height:9px; background:var(--flag); clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%);}
.navpanel .close{margin-top:16px;}

/* ---------- results ---------- */
.res{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px; margin:18px 0; text-align:center;}
.res .big{font-size:2.6rem; font-weight:700; font-variant-numeric:tabular-nums;}
.res .pf{display:inline-block; margin-top:6px; padding:4px 16px; border-radius:999px; font-weight:700;}
.res .pf.pass{background:var(--good-soft); color:var(--good);}
.res .pf.fail{background:var(--bad-soft); color:var(--bad);}
.res .sub2{color:var(--ink-soft); margin-top:10px; font-size:.92rem;}
.sect{width:100%; border-collapse:collapse; margin:8px 0 22px; font-size:.9rem;}
.sect th,.sect td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line);}
.sect td:last-child,.sect th:last-child{text-align:right; font-variant-numeric:tabular-nums;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px; margin:16px 0;}
.card h3{font-size:1.02rem; margin-bottom:10px;}
.revq{border-top:1px solid var(--line); padding:18px 0;}
.revq:first-of-type{border-top:none;}
.revq .rs{font-weight:600; margin-bottom:8px; white-space:pre-line;}
.rv{font-size:.9rem; margin:3px 0;}
.rv b.g{color:var(--good);} .rv b.b{color:var(--bad);}
.center{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:18px 0 40px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===== blueprint sections (from inte.xlsx) ===== */
const SECTIONS = [
 {name:"Outbound & Inbound Connectors, Connector Security, Calculated Fields", short:"Connectors", w:22, color:"#0875e1", src:"Creating and Securing Integrations"},
 {name:"Integration Basics & Reporting / RaaS", short:"Basics & RaaS", w:11, color:"#59c3e8", src:"Creating and Securing Integrations"},
 {name:"REST APIs, SOAP APIs & WQL", short:"APIs & WQL", w:16, color:"#f38b00", src:"Workday Orchestrate"},
 {name:"Build an Orchestration, Code & Flow Control", short:"Build Orchestration", w:16, color:"#ffb84d", src:"Workday Orchestrate"},
 {name:"Inbound & Outbound Orchestration", short:"In/Out Orchestration", w:11, color:"#7a5fd0", src:"Workday Orchestrate"},
 {name:"Reuse Code & Secure Orchestrations", short:"Reuse & Security", w:14, color:"#1e8a44", src:"Workday Orchestrate"},
 {name:"Troubleshoot Connectors & Orchestrations", short:"Troubleshooting", w:10, color:"#d13c30", src:"Both courses"}
];
/* exam sampling per blueprint weight: 20-question form */
const EXAM_MIX_20 = [5,2,3,3,2,3,2];
const PASS_PCT = 75;

/* ===== question bank =====
   {s:section, q:stem, o:[options], a:correctIndex, e:[per-option rationale]} */
const Q = [
/* ---- Section 0: Connectors (outbound, inbound, security, calc fields & overrides) ---- */
{s:0,q:"You need to send worker demographic changes to a benefits vendor on a nightly basis. The vendor accepts a standard file layout, and Workday delivers a packaged template for this vendor category.\n\nWhich integration tool is the best fit?",o:["An outbound EIB using a custom report data source.","A Core Connector integration system built from the delivered template.","A Workday Studio integration built from scratch.","A manual report export scheduled in My Reports."],a:1,e:["An EIB can output a report, but it cannot use delivered connector services like change detection.","Correct — Core Connector templates are packaged integrations with delivered services, maps, and change detection for exactly this pattern.","Studio is for complex custom logic; it adds unnecessary build and maintenance effort here.","Manual exports are not an integration system and cannot be secured, scheduled, or audited the same way."]},
{s:0,q:"You create a Core Connector: Worker integration system. The vendor only wants workers from the USA company hierarchy.\n\nHow do you restrict the population?",o:["Delete non-USA workers from the output file after delivery.","Configure Integration Population Eligibility with a hierarchy-based filter.","Disable the integration services for non-USA workers.","Ask the vendor to filter the file on their side."],a:1,e:["Editing the file after delivery is manual and defeats the purpose of an automated integration.","Correct — population eligibility criteria (for example organization membership) control which workers the connector processes.","Integration services control which data sections and fields are output, not which workers are included.","Sending unneeded worker data externally is a data-privacy risk and poor design."]},
{s:0,q:"A vendor file requires the worker's job title but not compensation data. Your Core Connector: Worker output currently includes compensation fields.\n\nWhat is the cleanest way to remove them?",o:["Disable the compensation-related integration services on the integration system.","Remove the ISU's access to all domains.","Add an integration map that blanks compensation values.","Write XSLT to strip the fields after generation."],a:0,e:["Correct — enabling or disabling integration services controls which sections and fields the connector outputs.","Removing all domain access would break the whole integration, not just compensation output.","Maps translate values; they do not remove entire data sections.","Connectors are configuration-driven; you should not need custom transformation to drop delivered sections."]},
{s:0,q:"The vendor wants marital status delivered as \"M\" or \"S\" instead of Workday's values \"Married\" and \"Single\".\n\nWhich configuration handles this?",o:["An integration attribute.","A calculated field on the worker.","An integration map on the integration system.","A sequence generator."],a:2,e:["Attributes configure integration behavior such as version or file settings, not value translation.","A calculated field could work but is more effort; maps are the delivered mechanism for value translation.","Correct — integration maps translate internal Workday values to the external values a vendor expects.","Sequence generators build incrementing values for filenames and IDs, not data translation."]},
{s:0,q:"You need the output filename of a connector to be BEN_EXPORT_ plus an incrementing number plus the run date.\n\nWhat should you configure?",o:["A sequence generator referenced by the integration system's filename attribute.","A calculated field on the integration event.","An integration map for the filename.","Rename the file manually in the delivered folder."],a:0,e:["Correct — sequence generators produce patterned, incrementing values and are referenced where the filename is defined.","Filenames are not built with report-level calculated fields.","Maps translate data values inside the file, not the file's name.","Manual renaming is not repeatable or auditable."]},
{s:0,q:"A Core Connector integration must only send workers whose data changed since the last successful run.\n\nWhich feature enables this?",o:["Change detection on the connector.","Running the integration in the sandbox tenant.","An integration map comparing old and new values.","A custom report filtered on last updated date."],a:0,e:["Correct — change detection compares the current run against the last successful run and outputs only changed workers.","The tenant type has nothing to do with detecting changed data.","Maps translate values; they cannot compare runs.","Connectors do not use custom reports as their data source; change detection is the delivered mechanism."]},
{s:0,q:"You launch a brand-new Core Connector with change detection for the first time.\n\nWhat do you expect in the output?",o:["An empty file, because nothing has changed.","A full file of the eligible population, since there is no prior run to compare against.","Only workers hired today.","An error, because change detection requires two prior runs."],a:1,e:["An empty first file would mean the baseline already existed, which it does not.","Correct — with no baseline, the first run outputs the full eligible population and establishes the comparison point.","Change detection is not limited to hires; the first run has no comparison at all.","Change detection needs only one prior successful run, and a missing baseline is not an error."]},
{s:0,q:"Your connector must process future-dated and effective-dated transactions correctly when it launches, using launch parameters such as Effective Date and As Of Entry Moment.\n\nWhich delivered service supports this?",o:["The Data Initialization Service (DIS).","The sequence generator service.","The integration map service.","Document retention."],a:0,e:["Correct — DIS uses launch parameters to determine which effective-dated data and transactions the run should consider.","Sequence generators only build patterned values.","Maps translate values, they do not control data timing.","Retention controls how long files are kept, not what data is extracted."]},
{s:0,q:"When launching a DIS-based connector, the Effective Date launch parameter primarily controls what?",o:["When the background process is allowed to start.","The as-of date used to evaluate effective-dated data in the extraction.","The date stamped into the output filename.","How long the event's files are retained."],a:1,e:["Scheduling controls when the process starts; Effective Date does not.","Correct — it sets the point in time at which effective-dated values are evaluated.","Filenames can include dates, but that is a filename configuration, not the parameter's purpose.","Retention is a separate document setting."]},
{s:0,q:"A vendor requires files to be dropped on their SFTP server and encrypted so only they can read them.\n\nWhat do you configure on the integration system?",o:["A delivery transport of SFTP and PGP encryption using the vendor's public key.","A delivery transport of email with a password-protected ZIP.","PGP encryption using your own private key only.","A retrieval configuration pointing at the vendor's server."],a:0,e:["Correct — outbound delivery uses a transport such as SFTP, and PGP encryption with the recipient's public key ensures only they can decrypt.","Email with ZIP passwords is weak, hard to automate, and not the requested transport.","You encrypt with the recipient's public key; your private key is for signing, and alone it would not protect the file for them.","Retrieval is for inbound files; this requirement is outbound delivery."]},
{s:0,q:"For PGP-encrypted outbound delivery, whose key encrypts the file?",o:["The vendor's public key.","The vendor's private key.","Workday's private key.","Any symmetric key shared over email."],a:0,e:["Correct — encrypting with the recipient's public key means only their private key can decrypt it.","Private keys are never shared; the vendor keeps theirs to decrypt.","Your private key is used for signing, not for encrypting to the vendor.","Sharing keys over email is insecure and is not how PGP key exchange should work."]},
{s:0,q:"You are building an inbound connector that loads files a vendor places on an external SFTP server.\n\nWhat must you configure so the integration can pick up the file?",o:["A delivery configuration to the vendor's server.","A retrieval configuration with the SFTP endpoint and credentials.","An outbound EIB pointed at the SFTP server.","A subscription to the vendor's web service."],a:1,e:["Delivery pushes files out; this scenario needs to pull a file in.","Correct — inbound integrations use a retrieval configuration to fetch the file from the transport endpoint.","An outbound EIB sends data out of Workday; it cannot ingest a vendor file.","Retrieving a file from SFTP is transport configuration, not a web-service subscription."]},
{s:0,q:"An inbound connector run completes, but several records in the vendor file failed validation.\n\nWhere do you look first to see which records failed and why?",o:["The integration event's messages and audit output.","The vendor's SFTP server logs.","The tenant sign-on report.","The business process definition for the integration."],a:0,e:["Correct — the integration event captures per-record errors and warnings raised while processing the inbound file.","The vendor's server can confirm pickup, but it knows nothing about Workday validation results.","Sign-on reports track authentication, not record processing.","The event, not the business process definition, holds run-time results."]},
{s:0,q:"Why does Workday recommend a dedicated Integration System User (ISU) per integration rather than sharing one account?",o:["Shared ISUs cost extra licensing fees.","A dedicated ISU isolates permissions and makes auditing and troubleshooting each integration's activity possible.","Workday allows only one integration per ISU as a hard limit.","ISUs expire after each run and must be recreated."],a:1,e:["There is no per-ISU licensing charge; this is a security practice, not a cost issue.","Correct — one ISU per integration gives least-privilege scoping and clean audit trails per integration.","It is a best practice, not a technical limit.","ISUs are persistent accounts; they do not expire per run."]},
{s:0,q:"You create an ISU for a new connector. Which additional step actually grants it access to worker data domains?",o:["Adding the ISU to an Integration System Security Group (ISSG) that has the required domain permissions.","Marking the ISU account as exempt from password expiration.","Assigning the ISU to the integration system on the Launch screen.","Giving the ISU a Workday user license."],a:0,e:["Correct — security comes from ISSG membership plus the domain permissions granted to that group.","Password expiration settings affect account maintenance, not data access.","Associating the ISU with the integration identifies who runs it, but grants no domain access by itself.","Data access in Workday is policy-driven, not license-driven."]},
{s:0,q:"After granting your ISSG Get access to a new domain, the connector still cannot see the data.\n\nWhat step was most likely missed?",o:["Restarting the Workday tenant.","Running Activate Pending Security Policy Changes.","Recreating the ISU account.","Re-uploading the PGP key."],a:1,e:["Tenants are not restarted for security changes.","Correct — domain security policy edits take effect only after pending changes are activated.","The ISU is fine; the policy change simply is not active yet.","Encryption keys are unrelated to domain access."]},
{s:0,q:"A connector outputs worker files but the National ID field is blank for every worker, with no errors raised.\n\nWhat is the most likely cause?",o:["The ISSG lacks Get access to the domain securing National ID data.","The SFTP password expired.","The sequence generator is misconfigured.","Change detection suppressed the field."],a:0,e:["Correct — missing domain permission typically produces silently blank fields rather than errors.","A transport failure would fail delivery, not blank one field.","Sequence generators affect filenames, not field values.","Change detection controls which workers appear, not which fields populate."]},
{s:0,q:"When would you choose a constrained ISSG over an unconstrained one?",o:["When the integration should only access data for workers in specific organizations.","When the integration needs access to every worker in the tenant.","When the ISU must bypass domain security entirely.","Constrained groups are required for all outbound integrations."],a:0,e:["Correct — constrained ISSGs limit access to a subset of the organization structure, supporting least privilege.","Tenant-wide access is the unconstrained case.","No security group bypasses domain security.","There is no such requirement; the choice depends on data scope."]},
{s:0,q:"The vendor needs a field showing each worker's years of service, which is not a delivered field on the connector.\n\nWhat is the recommended approach?",o:["Create a calculated field that derives years of service and use it in an integration field override.","Ask the vendor to compute it from hire date.","Build the whole integration again in Studio to add one field.","Hard-code the value in an integration attribute."],a:0,e:["Correct — calculated fields plus field overrides are the delivered way to change or extend a connector's output values.","Pushing derivation to the vendor may not be possible and does not meet the stated requirement.","Rebuilding in Studio for one field is disproportionate effort.","Attributes are static configuration, not per-worker values."]},
{s:0,q:"Integration field overrides on a Core Connector allow you to do what?",o:["Replace the value a delivered field outputs with the value of a calculated field.","Change which workers are eligible for the integration.","Modify the transport protocol per field.","Grant field-level security to the ISU."],a:0,e:["Correct — an override points a delivered output field at a calculated field you define.","Eligibility is population configuration, not a field override.","Transport applies to the whole file, not individual fields.","Security is granted through ISSG domain permissions, not overrides."]},
{s:0,q:"Which calculated field function would you use to return a worker's original hire date formatted as YYYYMMDD for a vendor file?",o:["Format Date.","Extract Single Instance.","Evaluate Expression Band.","Count Related Instances."],a:0,e:["Correct — Format Date converts a date field into a specified text pattern.","Extract Single Instance pulls one instance from a multi-instance field, not formatting.","Expression bands categorize numeric ranges.","Counting related instances returns a number, not a formatted date."]},
{s:0,q:"You need a single field that returns \"Manager\" when a worker has direct reports and \"Individual Contributor\" otherwise.\n\nWhich calculated field type fits?",o:["True/False condition used inside an Evaluate Expression.","Format Text on the worker's title.","Sum Related Instances.","A sequence generator."],a:0,e:["Correct — Evaluate Expression returns different values based on one or more true/false conditions.","Formatting the title does not test whether direct reports exist.","Summing instances returns totals, not conditional text.","Sequence generators build patterned identifiers, not conditional logic."]},
{s:0,q:"A calculated field you built for a field override works in a report but is not selectable on the integration system.\n\nWhat is a common cause?",o:["It was created for the wrong business object relative to what the override expects.","Calculated fields can never be used in integrations.","The field name contains spaces.","The ISU created too many calculated fields."],a:0,e:["Correct — overrides expect fields on a specific business object; a field built elsewhere will not appear.","Calculated fields are a core part of connector overrides.","Naming does not control availability.","There is no such per-user limit affecting availability."]},
{s:0,q:"What does enabling an integration service on a Core Connector template do?",o:["Activates a delivered group of output data and its related configuration for that run type.","Grants the ISU access to a security domain.","Schedules the integration to run automatically.","Encrypts the output file."],a:0,e:["Correct — services are modular blocks of delivered functionality/data you switch on or off per integration system.","Security still comes from the ISSG's domain permissions.","Scheduling is configured when you launch/schedule the integration.","Encryption is a delivery configuration."]},
{s:0,q:"The vendor wants one file per company, but your connector produces a single combined file.\n\nWhat is the most maintainable approach with delivered tooling?",o:["Create one integration system per company with population eligibility filtered to that company.","Manually split the file each morning.","Ask the vendor to split it.","Add a calculated field that hides other companies' rows."],a:0,e:["Correct — separate integration systems (or delivered splitting options where the template provides them) keep each feed independently secured, scheduled, and monitored.","Manual work does not scale and breaks automation.","This pushes your requirement onto the vendor and may not be accepted.","Calculated fields change values; they do not split files."]},
{s:0,q:"Which statement about connector templates is true?",o:["They are delivered by Workday and updated by Workday, while your configuration layers on top.","They must be recompiled after each Workday release.","They are editable XML you maintain yourself.","They only support outbound direction."],a:0,e:["Correct — Workday maintains the template; you configure services, maps, attributes, and overrides on your integration system.","Connectors are configuration, not compiled code.","The template internals are not customer-editable XML.","Delivered connectors exist for inbound and outbound patterns."]},
{s:0,q:"You need last name, first name order and a fixed 8-character worker ID padded with zeros in the output.\n\nWhich pair of tools accomplishes this?",o:["Calculated fields (Format Text / concatenation) applied through integration field overrides.","Integration maps and sequence generators.","Population eligibility and change detection.","Retention policy and delivery transport."],a:0,e:["Correct — text formatting and concatenation calculated fields, applied via overrides, reshape output values.","Maps translate discrete values and sequence generators build IDs for filenames; neither reformats existing field text.","Those control who is included and when, not how values look.","Those control file lifecycle and transport, not content."]},
{s:0,q:"What is the purpose of the As Of Entry Moment launch parameter on a DIS connector?",o:["It controls which transactions are considered based on when they were entered into Workday.","It sets the time the file is delivered to the vendor.","It defines the session timeout of the ISU.","It determines the output file's timezone label."],a:0,e:["Correct — it bounds the run by entry moment, so late-entered transactions are picked up predictably by the next run.","Delivery timing comes from the schedule, not this parameter.","ISU session settings are on the account, unrelated to launches.","It is about transaction selection, not file labeling."]},
{s:0,q:"A nightly connector with change detection was accidentally launched twice in quick succession, both completing successfully.\n\nWhat is the likely consequence for the second file?",o:["It contains few or no workers because the baseline advanced after the first successful run.","It contains the full population again.","It fails with a locking error.","It doubles every worker record."],a:0,e:["Correct — change detection compares to the last successful run, so the immediate rerun sees almost no changes.","Full output happens only when there is no baseline or full-file mode is chosen.","Connectors do not hard-fail merely because a prior run recently completed.","Duplication is not how run comparison behaves."]},
{s:0,q:"Where do you typically maintain external endpoint details such as SFTP host, directory, and credentials for a connector?",o:["In the integration system's delivery/retrieval transport configuration.","Inside a calculated field.","In the domain security policy.","In the vendor's integration map."],a:0,e:["Correct — transport endpoints and credentials are part of delivery (outbound) or retrieval (inbound) configuration.","Calculated fields shape data values, not connectivity.","Domain policies control data access, not endpoints.","Maps translate data values; they hold no connection details."]},
{s:0,q:"Your security team asks how the connector's ISU should be set up to reduce risk.\n\nWhich combination reflects best practice?",o:["No UI login use, membership only in its own ISSG, least-privilege domain grants, and credentials stored securely.","Assign the ISU to the Administrators security group for reliability.","Share the ISU with the nightly Studio job to reduce account count.","Set an easily memorable password so support can log in as it."],a:0,e:["Correct — ISUs are service accounts: scoped narrowly, not used interactively, and tightly controlled.","Administrator-level grants violate least privilege badly.","Sharing accounts destroys per-integration audit trails.","Humans logging in as ISUs is exactly what should not happen."]},
{s:0,q:"Which task association actually ties an ISU to a specific integration system so the integration runs as that account?",o:["Configuring the integration system's security to use that ISU (Workday account on the integration system).","Adding the ISU to the vendor's SFTP server.","Naming the ISU the same as the integration.","Scheduling the integration from the ISU's session."],a:0,e:["Correct — the integration system references the ISU as its Workday account, so events process under that identity.","External server accounts are separate credentials, not the Workday run identity.","Naming conventions help humans; they grant nothing.","Schedules capture an owner, but the run identity comes from the integration's configured account."]},
{s:0,q:"The vendor changed their SFTP host. Existing scheduled runs must keep working without rebuilding the integration.\n\nWhat do you do?",o:["Update the transport endpoint in the integration's delivery configuration.","Create a new integration system from scratch.","Update the integration map with the new host.","Change the ISU password."],a:0,e:["Correct — endpoints are configuration; update delivery details and the same integration keeps running.","A host change does not require a rebuild.","Maps have nothing to do with connectivity.","The Workday ISU password is unrelated to the vendor's server move."]},
{s:0,q:"What is the role of integration attributes on a connector integration system?",o:["They hold configuration values (such as version or file options) that control how the integration behaves.","They translate Workday values to vendor values.","They grant security permissions to the event.","They define the population of workers."],a:0,e:["Correct — attributes are named settings that tune template behavior per integration system.","Value translation is the job of integration maps.","Permissions come from the ISSG.","Population comes from eligibility criteria."]},
{s:0,q:"A weekly outbound connector must also produce an ad hoc full file for a vendor audit without disturbing the weekly changes-only baseline pattern.\n\nWhat is the safest approach?",o:["Use the connector's full-file launch option (or a separate full-file integration system) for the audit run.","Delete the baseline so the next weekly run is full.","Edit the output file to add all workers.","Switch the weekly schedule permanently to full file."],a:0,e:["Correct — an explicit full-file run (or parallel system) satisfies the audit without corrupting the ongoing change cycle.","Deleting the baseline disrupts the vendor's weekly delta expectations.","Manual edits are error-prone and unauditable.","Permanently changing the pattern overshoots a one-time need."]},
{s:0,q:"Which statement best describes the relationship between an integration system and an integration event?",o:["The system is the configured definition; each launch creates an event that records that run's parameters, messages, and files.","They are two names for the same object.","Events are created only when integrations fail.","The event stores the ISSG's permissions."],a:0,e:["Correct — system = definition, event = a single execution instance with its runtime artifacts.","They are distinct objects with different lifecycles.","Every launch, successful or not, produces an event.","Permissions live on security groups and policies, not events."]},
{s:0,q:"You must prove to auditors which files a connector produced last quarter and who received them.\n\nWhere is this evidence found?",o:["On the integration events, including their output files, delivery details, and messages.","In the calculated field definitions.","On the vendor's marketing site.","In the tenant's custom label configuration."],a:0,e:["Correct — events retain run history: parameters, generated documents, delivery results, and messages (within retention limits).","Field definitions show design, not run history.","External sites are not audit evidence for your tenant.","Labels are UI text, unrelated to run evidence."]},
{s:0,q:"An outbound connector must exclude contingent workers.\n\nWhere is this enforced most appropriately?",o:["In the integration population eligibility criteria.","By deleting contingent workers from Workday.","In the delivery configuration.","By the vendor after receipt."],a:0,e:["Correct — eligibility filters (for example, worker type Employee only) define the processed population.","Removing real workers from the tenant to fix a feed is obviously wrong.","Delivery moves the file; it cannot filter people.","Sending then filtering externally leaks data unnecessarily."]},
{s:0,q:"What advantage does change detection give the receiving vendor system?",o:["Smaller files and less processing, since only changed records arrive.","Stronger encryption of the payload.","Guaranteed ordering of workers alphabetically.","Automatic acknowledgment files."],a:0,e:["Correct — deltas reduce volume and downstream processing compared with full files.","Encryption is a separate delivery setting.","Sorting is unrelated to change detection.","Acknowledgments are a vendor-side or separately built pattern."]},
{s:0,q:"Which pairing of direction and mechanism is correct for connector-based designs?",o:["Outbound uses delivery to an endpoint; inbound uses retrieval from an endpoint.","Outbound uses retrieval; inbound uses delivery.","Both directions use retrieval.","Direction is set by the ISU type."],a:0,e:["Correct — outbound pushes files out via delivery; inbound pulls files in via retrieval before processing.","This reverses the two mechanisms.","Retrieval alone cannot send files to a vendor.","ISUs are identities; they do not define direction."]},
{s:0,q:"A new field override you configured returns blank in the file, but the calculated field shows values in a report you run as yourself.\n\nWhat should you check first?",o:["Whether the ISU/ISSG can access the fields the calculated field depends on.","Whether the vendor's server is online.","Whether the filename sequence is correct.","Whether the tenant is in a maintenance window."],a:0,e:["Correct — the integration evaluates fields as the ISU; missing domain access on underlying fields yields blanks for the ISU even when your account sees data.","Transport issues would affect delivery, not values inside the generated file.","Filenames do not influence field values.","Maintenance windows block runs entirely rather than blanking one field."]},
/* ---- Section 1: Integration basics & Reporting / RaaS ---- */
{s:1,q:"A stakeholder asks for the difference between an integration system and the integration template it is based on.\n\nWhich answer is correct?",o:["The template is the reusable delivered (or built) definition; the integration system is your configured instance of it.","They are identical objects with different icons.","Templates run; systems only store settings.","Systems are delivered by Workday; templates are customer-built."],a:0,e:["Correct — you instantiate a template into an integration system and configure that instance.","They are different object types with a parent/instance relationship.","It is the integration system that is launched to create events.","It is generally the reverse: Workday delivers templates, customers create systems."]},
{s:1,q:"Which sequence best describes what happens when you launch an integration?",o:["An integration event is created, the background process runs with the launch parameters, and results, messages, and files attach to the event.","The template is copied into a new integration system.","The ISU password is reset, then the file is emailed.","A business process approval is always required first."],a:0,e:["Correct — the event is the run record from creation through completion.","Launching runs an existing system; it does not clone templates.","Nothing about launching resets credentials.","Approvals only occur if you have specifically built them into the process; they are not inherent to launching."]},
{s:1,q:"Where can you monitor a running integration and view its status, messages, and percent complete?",o:["Process Monitor / the integration's event record.","The vendor's SFTP logs.","The domain security policy report.","The calculated field editor."],a:0,e:["Correct — Process Monitor and the integration event show live and historical run details.","External logs show only file arrival, not Workday processing.","Security reports show access configuration, not runs.","The field editor is design-time only."]},
{s:1,q:"A simple, low-volume outbound feed just needs a custom report delivered as CSV to an SFTP server weekly, with no delivered connector available and no complex logic.\n\nWhich tool fits best?",o:["An outbound EIB.","Workday Studio.","A Core Connector template.","Manual export from the report."],a:0,e:["Correct — EIB is the lightweight tool for report-based outbound feeds with simple transformation and delivery.","Studio is warranted for complex logic, multiple sources, or advanced error handling — overkill here.","The scenario states no delivered connector exists for this need.","Manual steps are not a sustainable integration."]},
{s:1,q:"An outbound EIB's data source must be which kind of report?",o:["A custom report that is web service enabled (typically Advanced).","Any standard delivered report.","A matrix report shared to all users.","A dashboard."],a:0,e:["Correct — the EIB reads the report through its web-service (RaaS) enablement, which Advanced custom reports support.","Standard reports generally cannot be enabled as a web service data source for your EIB.","Matrix reports are for analysis views, and sharing alone is not web-service enablement.","Dashboards are UI collections, not data sources."]},
{s:1,q:"For an inbound EIB that creates new positions, where does the spreadsheet template come from?",o:["You generate it from the selected web service operation, so columns match the operation's schema.","You design any columns you like in Excel.","The vendor supplies their own layout and Workday adapts.","It is downloaded from the domain security policy."],a:0,e:["Correct — Generate Spreadsheet Template builds the workbook from the chosen operation so the load maps correctly.","Arbitrary columns will not map to the web service request.","Inbound EIB expects the generated structure, not vendor-defined layouts.","Security policies have no templates."]},
{s:1,q:"What does enabling a custom report \"as a web service\" allow?",o:["The report can be called via a URL (RaaS) and returned in formats such as Workday XML, CSV, or JSON.","The report becomes visible to all employees.","The report runs faster in the browser.","The report bypasses row-level security."],a:0,e:["Correct — RaaS exposes report output over HTTP in multiple formats for integrations.","Visibility is still controlled by sharing and security.","Web-service enablement is about access method, not UI speed.","Security always applies as the calling user; RaaS never bypasses it."]},
{s:1,q:"A RaaS URL returns data when you call it, but the same URL returns an empty result set for the integration's ISU.\n\nWhat is the most likely reason?",o:["Row-level security: the ISU's ISSG cannot see the underlying data or the report is not shared with it.","The URL format parameter is wrong.","RaaS only works for human accounts.","The report has too many columns."],a:0,e:["Correct — RaaS output reflects the caller's security; an under-permissioned ISU sees fewer or zero rows, and the report must also be shared appropriately.","A bad format parameter changes structure or errors, not the row count per user.","ISUs commonly call RaaS; that is a primary use case.","Column count does not vary by caller."]},
{s:1,q:"How do you request JSON output from a RaaS endpoint that defaults to Workday XML?",o:["Append the appropriate format parameter (for example ?format=json) to the report URL.","Change the tenant locale to JSON.","JSON is not supported by RaaS.","Convert the response in Excel."],a:0,e:["Correct — the format query parameter selects alternate outputs such as csv or json.","Locale affects language and formats of values, not the payload type.","JSON is a supported RaaS output.","Client-side conversion is unnecessary when the service can return JSON directly."]},
{s:1,q:"Your advanced report has a prompt for Organization. How does an integration supply this value when calling the report as a service?",o:["As a parameter in the RaaS request (prompt values become request/URL parameters).","It cannot; prompted reports are not callable.","By hard-coding the organization into the report title.","By emailing the value to Workday support."],a:0,e:["Correct — report prompts are exposed as parameters on the web-service call.","Prompted reports are callable; prompts simply become inputs.","Titles are cosmetic and not read by the engine.","Support does not inject runtime values."]},
{s:1,q:"Which is a key reason to schedule integrations with a recurrence instead of launching manually?",o:["Consistent, unattended execution with predictable launch parameter handling (for example, relative dates).","Scheduled runs skip security evaluation.","Scheduled runs cannot fail.","Manual launches are disabled in production."],a:0,e:["Correct — schedules provide reliable timing and computed parameters like \"yesterday\" each run.","Security is evaluated identically for scheduled runs.","Failures can still occur; scheduling does not change that.","Manual launches remain available in production."]},
{s:1,q:"A colleague asks when Workday Studio (or Orchestrate) is justified over EIB and Core Connectors.\n\nWhich answer is best?",o:["When requirements exceed configuration: multiple sources or calls, complex transformation or error handling, or custom orchestration logic.","Whenever the vendor is external.","For every inbound integration.","When the file is larger than 1 MB."],a:0,e:["Correct — tool choice escalates with complexity; use the simplest tool that meets the requirement.","External vendors are served by all tools, including EIB and connectors.","Inbound EIB and inbound connectors handle many inbound needs.","File size alone rarely dictates the tool at that threshold."]},
{s:1,q:"What does the integration event's \"Completed with Warnings\" status generally indicate?",o:["The run finished and produced output, but some non-fatal issues were logged for review.","The run failed and produced nothing.","The event is still processing.","The ISU account is locked."],a:0,e:["Correct — warnings flag records or conditions to review while the overall run succeeded.","Failure is a distinct status; warnings imply completion.","In-progress runs show processing status, not completion.","A locked account would prevent processing rather than warn."]},
{s:1,q:"Which statement about launch parameters is true?",o:["They are defined by the integration's services/template and supplied at launch to control that run (dates, options, population inputs).","They permanently change the integration system's configuration.","They are stored in the vendor's system.","Only Studio integrations have launch parameters."],a:0,e:["Correct — parameters are per-run inputs recorded on the event.","They affect that event only; the definition is unchanged.","They live on the Workday event, not externally.","EIBs, connectors, and orchestration-linked systems all take launch parameters."]},
{s:1,q:"You need yesterday's transactions in every scheduled nightly run without editing the schedule daily.\n\nHow is this handled?",o:["Use relative date launch parameters (for example, minus one day from the run date) on the schedule.","Edit the launch date by hand each evening.","Create 365 schedules, one per day.","Ask the vendor to discard extra data."],a:0,e:["Correct — schedules support computed/relative parameter values evaluated at each run.","Manual daily edits defeat scheduling.","One recurrence with relative dates replaces hundreds of static schedules.","Over-extracting and discarding is wasteful and risky."]},
{s:1,q:"Why might you deliver a RaaS report in CSV rather than Workday XML for a vendor?",o:["The vendor's system consumes flat delimited files, and CSV avoids XML parsing on their side.","CSV is encrypted by default.","XML is deprecated in Workday.","CSV bypasses report security."],a:0,e:["Correct — output format should match the consumer's ingestion capability.","No format is encrypted by default; encryption is separate.","Workday XML remains fully supported.","Security applies regardless of format."]},
{s:1,q:"Which object records the documents (files) an integration produced for a given run?",o:["The integration event.","The integration template.","The ISSG.","The calculated field."],a:0,e:["Correct — generated and delivered files attach to the event for that run.","Templates are definitions; they hold no run files.","Security groups hold members and permissions.","Fields compute values; they store no files."]},
{s:1,q:"A business user wants a one-time extract of current data to review in Excel, with no vendor delivery.\n\nWhat is the lightest appropriate approach?",o:["Run (or share) a custom report and export it, rather than building an integration.","Build a Studio integration.","Create a connector with change detection.","Stand up an SFTP server for them."],a:0,e:["Correct — one-time human consumption is a reporting need, not an integration build.","Studio for a one-off export is heavy overkill.","Change detection solves recurring delta feeds, not a single review.","No transport is needed when a person just needs a file."]},
/* ---- Section 2: REST APIs, SOAP APIs & WQL ---- */
{s:2,q:"An orchestration must read worker data from Workday and you want a lightweight JSON response you can navigate easily.\n\nWhich approach fits best?",o:["Call a Workday RaaS report or a WQL query and consume the JSON in the orchestration.","Call the SOAP Get_Workers operation and parse the XML manually.","Export a spreadsheet and re-import it.","Screen-scrape the Workday UI."],a:0,e:["Correct — RaaS/WQL return JSON that orchestrations consume with dot/JSONPath-style navigation.","SOAP works but returns verbose XML; it is heavier when JSON meets the need.","Spreadsheet round-trips are manual, not an API integration.","Scraping the UI is fragile and unsupported."]},
{s:2,q:"When should you prefer a Workday SOAP API operation over REST/RaaS in an orchestration?",o:["When you must write data with a public web service operation that only SOAP exposes (for example, a specific Put/Submit operation).","Whenever the payload is JSON.","Only when the tenant has no reports.","SOAP is always preferred for reads."],a:0,e:["Correct — many transactional write operations are exposed through SOAP public web services.","JSON payloads point toward REST, not SOAP.","Report availability does not determine API style.","For simple reads, REST/RaaS/WQL are often lighter than SOAP."]},
{s:2,q:"A REST call in your orchestration returns HTTP 401.\n\nWhat is the most likely cause?",o:["Authentication failed — missing or invalid credentials/token for the endpoint.","The requested resource does not exist.","The server had an internal error.","The request body was too large."],a:0,e:["Correct — 401 Unauthorized signals an authentication problem.","A missing resource is 404, not 401.","Server-side faults are 5xx.","Payload-size problems surface as 413, not 401."]},
{s:2,q:"A REST call returns HTTP 404.\n\nWhat does this most directly indicate?",o:["The endpoint URL or resource path is wrong or the resource does not exist.","Your token expired.","The service is rate limiting you.","The JSON body failed schema validation."],a:0,e:["Correct — 404 Not Found means the resource/path could not be located.","Expired tokens give 401.","Rate limiting is typically 429.","Body validation failures are usually 400/422."]},
{s:2,q:"You must page through a large REST result set that returns a limited number of records per call.\n\nWhat is the correct orchestration pattern?",o:["Loop, requesting successive pages using the offset/limit or next-page token until no more pages remain.","Increase the timeout and request all records in one call.","Call the endpoint once and accept partial data.","Switch to SOAP because REST cannot page."],a:0,e:["Correct — you iterate over pages, advancing the cursor or offset until the response signals the end.","A single call still respects the server's page size; a longer timeout does not remove paging.","Accepting partial data loses records.","REST APIs commonly support paging; the claim is false."]},
{s:2,q:"WQL is best described as what?",o:["A SQL-like query language for reading Workday data returned as structured JSON.","A transformation language for editing XML.","A scripting language for writing data into Workday.","A file transport protocol."],a:0,e:["Correct — WQL queries Workday business objects with SQL-like syntax and returns JSON.","XML transformation is XSLT's role.","WQL reads data; it is not a write/transaction mechanism.","It is a query language, not a transport."]},
{s:2,q:"Which WQL clause limits results to active, regular workers?",o:["A WHERE clause with conditions on the worker's status/type fields.","An ORDER BY clause.","A SELECT clause listing only columns.","A GROUP BY clause."],a:0,e:["Correct — WHERE filters rows by field conditions, just like SQL.","ORDER BY sorts; it does not filter.","SELECT chooses columns, not which rows qualify.","GROUP BY aggregates; it does not filter the base set."]},
{s:2,q:"You want only worker ID and legal name from a WQL query to keep the payload small.\n\nWhich clause controls this?",o:["SELECT, which lists exactly the fields to return.","FROM, which sets the business object.","WHERE, which filters rows.","LIMIT, which caps row count."],a:0,e:["Correct — SELECT projects the specific columns you want.","FROM chooses the object, not the columns.","WHERE filters rows, not fields.","LIMIT restricts how many rows, not which fields."]},
{s:2,q:"An advantage of WQL over calling a RaaS report inside an orchestration is:",o:["You can write and adjust the query inline without maintaining a separate report definition.","WQL can write data back to Workday.","WQL bypasses security.","WQL always returns XML for XSLT."],a:0,e:["Correct — WQL is self-contained query text, avoiding a separately maintained report object.","WQL is read-only, like RaaS.","Security still applies to WQL as the calling identity.","WQL returns JSON, not XML for XSLT."]},
{s:2,q:"Your orchestration calls an external REST API that needs a bearer token obtained from a token endpoint.\n\nWhat is the typical flow?",o:["First call the token endpoint to obtain the token, then include it in the Authorization header of subsequent calls.","Put the username and password directly in each data call's body.","Disable authentication for the connection.","Store the token in the report title."],a:0,e:["Correct — acquire the token, then pass it as a bearer credential on each request.","Sending raw credentials on every call is insecure and usually unsupported.","Disabling auth is not an option for a protected API.","Titles are not credential stores."]},
{s:2,q:"A SOAP request to Workday fails with a validation fault naming a required element.\n\nWhat should you check?",o:["That the request includes all mandatory elements the operation's WSDL/schema requires, correctly ordered and typed.","That the SFTP server is online.","That change detection is enabled.","That the report is shared."],a:0,e:["Correct — SOAP operations enforce their schema; missing/mis-typed required elements cause validation faults.","SFTP is unrelated to a SOAP request body.","Change detection is a connector feature, not a SOAP concern.","Report sharing is unrelated to a SOAP transactional call."]},
{s:2,q:"Which HTTP method would an orchestration typically use to create a new resource via a REST API?",o:["POST.","GET.","DELETE.","HEAD."],a:0,e:["Correct — POST is the conventional method for creating resources.","GET retrieves data and should not change state.","DELETE removes resources.","HEAD returns headers only, with no body."]},
{s:2,q:"A REST response returns HTTP 429.\n\nWhat is the appropriate orchestration behavior?",o:["Back off and retry after a delay, respecting the API's rate limit.","Immediately retry in a tight loop.","Treat it as success and continue.","Abort the whole integration permanently."],a:0,e:["Correct — 429 means too many requests; wait and retry (ideally with backoff).","Hammering the API worsens the limit and may extend the block.","429 is not success; data was not returned.","A transient limit does not warrant permanent failure without retry."]},
{s:2,q:"You need to join worker data with organization data in a single read.\n\nWhich tool most directly supports relating business objects in one query?",o:["WQL, using related business objects/fields in one query.","A sequence generator.","An integration map.","A PGP key."],a:0,e:["Correct — WQL can traverse related business objects and return combined results.","Sequence generators build patterned values only.","Maps translate discrete values, not join data.","Keys are for encryption, unrelated to querying."]},
{s:2,q:"What format does a Workday RaaS report most conveniently return for an orchestration that navigates fields by name?",o:["JSON.","A binary PDF.","A password-protected ZIP.","A fixed-width text file."],a:0,e:["Correct — JSON is easy to navigate by key within the orchestration.","PDF is for human viewing, not field navigation.","ZIP is a container, not a directly navigable structure.","Fixed-width requires position parsing and is harder to navigate by name."]},
/* ---- Section 3: Build an orchestration, use code, control flow ---- */
{s:3,q:"You are creating a new orchestration for integrations.\n\nWhere do you build it?",o:["In the Orchestration Builder on the Workday Developer Site.","In the tenant's report writer.","In an Excel macro.","In the SFTP client."],a:0,e:["Correct — orchestrations are authored in the Orchestration Builder on the Developer Site.","Report writer builds reports, not orchestrations.","Macros are unrelated to Workday orchestration.","SFTP clients move files; they do not build logic."]},
{s:3,q:"After building an orchestration, what must happen before a Workday integration system can use it?",o:["It is promoted and installed so it becomes available to link to an integration system.","It is emailed to the vendor.","It is printed as a PDF.","It is deleted from the Developer Site."],a:0,e:["Correct — orchestrations are promoted/installed, then linked to an integration system to run in the tenant.","Emailing does not deploy logic to the tenant.","Printing has no effect on deployment.","Deleting it removes the logic entirely."]},
{s:3,q:"Which component lets you run custom logic (such as transforming a payload) inside an orchestration?",o:["A code/script step that executes your logic on the data in the flow.","A delivery transport.","A domain security policy.","A sequence generator."],a:0,e:["Correct — code steps execute custom logic against the in-flight data.","Transports move files; they do not run logic.","Security policies grant access; they do not transform data.","Sequence generators build patterned values only."]},
{s:3,q:"You must branch the flow so that only workers with a termination date proceed to the next step.\n\nWhich control mechanism do you use?",o:["A conditional (if/branch) step evaluating the termination date.","A retry policy.","A PGP encryption step.","A sequence generator."],a:0,e:["Correct — conditional/branch steps direct the flow based on data tests.","Retry handles failures, not branching.","Encryption secures payloads; it does not branch.","Sequence generators do not evaluate conditions."]},
{s:3,q:"An orchestration must process each worker in a collection individually.\n\nWhich construct handles this?",o:["A loop/iteration step over the collection.","A single conditional step.","A delivery transport.","An integration map."],a:0,e:["Correct — a loop iterates over each item in the collection.","One conditional evaluates once, not per item.","Transports move files, not iterate data.","Maps translate values; they do not iterate."]},
{s:3,q:"You want to record the count of records processed and any skipped items for later review.\n\nWhat is the recommended practice?",o:["Add logging steps that write meaningful messages during the flow.","Rely on the vendor to tell you what happened.","Store nothing and re-run if needed.","Rename the output file with the count."],a:0,e:["Correct — logging surfaces run details for monitoring and troubleshooting.","External parties cannot see your internal processing.","Storing nothing removes your ability to diagnose issues.","A filename cannot capture per-record processing detail."]},
{s:3,q:"Your orchestration calls an external API that occasionally times out transiently.\n\nWhat is the best-practice handling?",o:["Apply retry with backoff for transient errors and fail clearly if retries are exhausted.","Ignore all errors and continue.","Retry forever with no limit.","Abort the entire integration on the first timeout with no retry."],a:0,e:["Correct — bounded retry with backoff absorbs transient faults while still failing loudly when truly broken.","Ignoring errors hides real failures and corrupts results.","Unbounded retries can hang the integration indefinitely.","No retry makes the integration brittle to normal transient blips."]},
{s:3,q:"You need to validate that a required field is present before making a downstream call.\n\nWhere should this happen?",o:["In a validation step early in the flow, so bad data is caught before side effects.","Only after the downstream call fails.","In the vendor's system.","Never; downstream systems handle everything."],a:0,e:["Correct — validate early to fail fast and avoid partial side effects.","Validating after the fact wastes calls and may leave inconsistent state.","You cannot rely on external validation for your own data integrity.","Assuming downstream handles all validation is unsafe."]},
{s:3,q:"During development, what is the value of testing an orchestration with sample inputs in the Builder before installing it?",o:["You can verify logic, data navigation, and error handling before deploying to the tenant.","It automatically encrypts the tenant.","It grants the ISU new domains.","It schedules the integration."],a:0,e:["Correct — iterative test runs validate behavior prior to promotion.","Testing does not perform encryption.","Domain grants come from security configuration, not testing.","Scheduling is a separate deployment/launch activity."]},
{s:3,q:"An orchestration step that transforms JSON keys should ideally be:",o:["Focused and single-purpose, so it is testable and reusable.","As large as possible, doing everything in one step.","Hard-coded to one tenant's data only.","Undocumented, to save time."],a:0,e:["Correct — small, single-purpose steps are easier to test, reuse, and maintain.","Monolithic steps are hard to debug and reuse.","Hard-coding to one tenant hurts portability.","Skipping documentation harms maintainability."]},
{s:3,q:"You need the flow to stop and surface a clear error when a mandatory upstream call returns no data.\n\nWhich approach is best?",o:["Check the result and raise a descriptive error/log, halting before dependent steps run.","Let dependent steps run and fail with a cryptic null error.","Silently substitute default data.","Continue and deliver an empty file."],a:0,e:["Correct — explicit checks with clear errors make failures diagnosable and prevent bad downstream side effects.","Cryptic null failures waste troubleshooting time.","Silent defaults mask real problems and can corrupt output.","Delivering empty files can break the vendor's process without explanation."]},
{s:3,q:"What is the purpose of mapping/transformation steps in an orchestration?",o:["To reshape source data into the structure the target system expects.","To grant security to the ISU.","To schedule the integration.","To encrypt the tenant database."],a:0,e:["Correct — transformation aligns source structure with the target's required format.","Security is configured separately.","Scheduling is a launch concern.","Encryption of the database is not an orchestration step."]},
{s:3,q:"You must call one Workday web service and then, using its output, call a second service.\n\nWhich orchestration capability enables this?",o:["Sequencing steps so the second call consumes the first call's output.","Change detection.","A single conditional with no data passing.","Delivery transport."],a:0,e:["Correct — orchestrations pass data between sequential steps.","Change detection is a connector feature, unrelated here.","A lone conditional does not chain calls or pass data.","Transports move files, not intermediate call results."]},
{s:3,q:"You want an orchestration to send a notification only when the number of error records exceeds a threshold.\n\nWhich combination of components fits?",o:["A counter/aggregation of errors followed by a conditional that triggers the notification step when the threshold is exceeded.","A single delivery transport with no logic.","A sequence generator that counts errors.","An integration map keyed on the error count."],a:0,e:["Correct — you accumulate a count, then branch conditionally to the notification when it crosses the threshold.","A transport moves files; it cannot evaluate a threshold.","Sequence generators build patterned values, not conditional counts of errors.","Maps translate discrete values; they do not implement threshold logic."]},
{s:3,q:"An orchestration must transform a nested JSON structure into a flat record per line for a vendor CSV.\n\nWhat is the general approach?",o:["Iterate the nested collection and, for each item, project the needed fields into a flat output row.","Deliver the raw nested JSON and let the vendor flatten it.","Encrypt the JSON so it appears flat.","Change the ISU so the JSON flattens automatically."],a:0,e:["Correct — loop the nested items and map each to a flat row with only the required fields.","Pushing transformation onto the vendor does not meet a CSV requirement you own.","Encryption changes confidentiality, not structure.","The ISU is an identity; it does not reshape data."]},
{s:3,q:"Why is it good practice to give orchestration steps clear, descriptive names?",o:["Named steps make the flow readable and logs/errors easier to trace during troubleshooting.","Names change the security applied to each step.","Names determine the file transport used.","Names are required for the ISU to authenticate."],a:0,e:["Correct — descriptive names improve readability and make run logs far easier to interpret.","Security comes from the ISSG, not step names.","Transport is configured explicitly, independent of names.","Authentication uses credentials, not step names."]},
/* ---- Section 4: Inbound & Outbound orchestration ---- */
{s:4,q:"You link an orchestration to a Workday integration system so it can be launched and scheduled in the tenant.\n\nWhat does this linkage provide?",o:["A launchable, schedulable, and securable integration system that runs the orchestration.","A new report definition.","A vendor SFTP account.","A PGP key pair."],a:0,e:["Correct — the integration system is the tenant-side wrapper that launches, schedules, and secures the orchestration.","Reports are separate objects.","External accounts are configured on the vendor side.","Keys are generated/exchanged separately for encryption."]},
{s:4,q:"An outbound orchestration must deliver its final file to a vendor's SFTP server.\n\nHow is delivery handled?",o:["Configure the integration system's delivery/transport (or a delivery step) to send the file via SFTP.","Ask the vendor to log into Workday and download it.","Print the file and mail it.","Store it only in the event and never send it."],a:0,e:["Correct — outbound delivery uses the integration system's transport configuration (or a delivery step) to push the file.","Vendors do not log into your tenant to pull files.","Physical mail is not an integration delivery method.","Leaving it only in the event does not deliver it to the vendor."]},
{s:4,q:"An inbound orchestration must retrieve a file a vendor drops on SFTP and then load it into Workday.\n\nWhat is the correct high-level flow?",o:["Retrieve the file via transport, parse/transform it, then call the appropriate Workday web service to load the data.","Deliver a file to the vendor, then wait.","Encrypt the tenant, then export.","Only read a report and stop."],a:0,e:["Correct — inbound = retrieve, transform, then write into Workday via a service call.","Delivery is outbound, the opposite direction.","Encrypting the tenant is not a load step.","Reading a report does not ingest the vendor file."]},
{s:4,q:"For an inbound orchestration that writes data, which identity's security governs whether the write succeeds?",o:["The integration system's ISU/ISSG, which must have permission for the write operation and data.","The vendor's SFTP account.","The developer's personal browser session.","No security applies to inbound writes."],a:0,e:["Correct — the run executes as the ISU, whose ISSG must permit the operation and data domains.","External SFTP credentials govern file pickup, not Workday writes.","Scheduled runs do not use a person's browser session.","Security always applies; inbound writes are not exempt."]},
{s:4,q:"An outbound orchestration should send the vendor only changed records each run.\n\nWhich approach fits an orchestration-based design?",o:["Query only changed data (for example, by last-modified timestamp) or track a high-water mark between runs.","Rely on connector change detection, which orchestrations cannot use at all.","Send the full dataset every time and let the vendor sort it out.","Delete old records from Workday."],a:0,e:["Correct — orchestrations implement deltas by querying on change timestamps or persisting a watermark.","This distractor overstates the point; the orchestration pattern here is timestamp/watermark querying.","Full sends every run waste resources and push filtering onto the vendor.","Deleting source records to control a feed is destructive and wrong."]},
{s:4,q:"You must supply the vendor's environment (test vs prod endpoint) without editing the orchestration each time.\n\nWhat is the best practice?",o:["Externalize the endpoint as a launch parameter or configuration value on the integration system.","Hard-code the production URL in the orchestration.","Maintain two separate copies of the orchestration forever.","Ask the vendor to ignore the wrong environment."],a:0,e:["Correct — parameterizing environment-specific values keeps one orchestration usable across environments.","Hard-coding forces edits and risks sending test data to prod.","Duplicate copies drift and are hard to maintain.","Sending to the wrong environment is a real hazard, not a workaround."]},
{s:4,q:"An inbound file sometimes arrives with a few malformed rows.\n\nWhat is the most robust orchestration behavior?",o:["Validate each row, load the good ones, and log/report the rejected rows with reasons.","Reject the entire file if any row is malformed, with no detail.","Load everything and hope Workday ignores bad rows.","Silently drop bad rows with no record."],a:0,e:["Correct — partial success with a clear reject report maximizes throughput and traceability.","All-or-nothing rejection can block good data unnecessarily depending on requirements.","Hoping bad rows are ignored risks incorrect writes or failures.","Silent drops hide data-quality problems."]},
{s:4,q:"Where do you schedule an installed orchestration to run nightly?",o:["On its linked Workday integration system, using a scheduled recurrence.","On the vendor's server crontab.","In the Orchestration Builder only.","In a personal calendar reminder."],a:0,e:["Correct — the tenant-side integration system provides scheduling.","The vendor's crontab cannot launch a Workday integration.","The Builder authors logic; the tenant schedules the linked system.","Reminders do not launch integrations."]},
{s:4,q:"After delivering an outbound file, the vendor reports they never received it, though the event shows the file was generated.\n\nWhere do you look first?",o:["The delivery/transport step result and connection details for the outbound send.","The WQL SELECT clause.","The calculated field library.","The report prompt values."],a:0,e:["Correct — a generated-but-not-received file points to the delivery/transport step or endpoint configuration.","Query projection does not affect delivery.","Field definitions are unrelated to transport.","Prompts affect what data is read, not whether the file was sent."]},
/* ---- Section 5: Reuse code & secure orchestrations ---- */
{s:5,q:"Several orchestrations need the same token-acquisition logic.\n\nWhat is the recommended way to avoid duplicating it?",o:["Build it once as a suborchestration and call it from each parent orchestration.","Copy and paste the steps into every orchestration.","Ask each developer to rewrite it their own way.","Put the logic in a report."],a:0,e:["Correct — suborchestrations encapsulate reusable logic callable from multiple parents.","Copy-paste duplicates maintenance and drifts over time.","Divergent implementations create inconsistency and bugs.","Reports cannot host orchestration logic."]},
{s:5,q:"A suborchestration is best described as:",o:["A modular, reusable orchestration invoked by other orchestrations, with defined inputs and outputs.","A one-time script that cannot be reused.","A report data source.","A delivery transport."],a:0,e:["Correct — suborchestrations are parameterized, reusable building blocks.","Reusability is exactly their purpose.","They are logic, not a report source.","They are not a transport mechanism."]},
{s:5,q:"When designing a suborchestration for reuse, what makes it most broadly usable?",o:["Clear, generic inputs and outputs with no hard-coded tenant- or vendor-specific values.","Hard-coding one vendor's endpoint inside it.","Embedding a specific worker ID.","Relying on a fixed file path on one server."],a:0,e:["Correct — parameterized, assumption-free interfaces let many callers reuse it.","Hard-coded endpoints tie it to one use case.","Embedded IDs make it single-purpose.","Fixed paths break portability."]},
{s:5,q:"An orchestration handles sensitive data and calls an external API with a secret key.\n\nHow should the secret be managed?",o:["Store it securely as a managed credential/secret referenced by the orchestration, not hard-coded in plain text.","Type it directly into a code step in clear text.","Put it in the output filename.","Email it to the team for convenience."],a:0,e:["Correct — secrets belong in secure credential storage, referenced at runtime.","Clear-text secrets in logic are a serious security risk.","Filenames are visible and not a secret store.","Emailing secrets exposes them broadly."]},
{s:5,q:"Which identity governs what a scheduled orchestration integration can read and write in Workday?",o:["Its Integration System User via Integration System Security Group domain permissions.","The last human who edited it.","Any tenant administrator automatically.","No identity; scheduled runs are unrestricted."],a:0,e:["Correct — the ISU/ISSG determines the run's data access, following least privilege.","The editor's identity is not the run identity.","Admin rights are not automatically granted to integrations.","Runs are always security-governed."]},
{s:5,q:"You want to grant an orchestration integration the minimum access it needs and nothing more.\n\nWhich practice supports this?",o:["Least privilege: grant the ISSG only the specific domains/operations required.","Add the ISU to the Administrators group for simplicity.","Grant every domain to avoid future tickets.","Disable domain security for the integration."],a:0,e:["Correct — scope permissions narrowly to exactly what the integration uses.","Administrator access is far beyond least privilege.","Granting everything is a major security risk.","Domain security cannot and should not be disabled."]},
{s:5,q:"A shared suborchestration changes its expected input structure.\n\nWhat is the risk to its callers?",o:["Parent orchestrations that pass the old structure may break, so changes must be coordinated and versioned carefully.","Nothing; callers are unaffected by interface changes.","Only the vendor is affected.","The tenant automatically rewrites all callers."],a:0,e:["Correct — changing a shared interface can break every caller, so manage versions and compatibility deliberately.","Interface changes propagate to callers by definition.","Callers, not the vendor, depend on the interface.","There is no automatic rewrite of dependent logic."]},
