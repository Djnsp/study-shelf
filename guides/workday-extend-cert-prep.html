<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extend Pro | Workday Extend Certification Prep</title>
<style>
:root{
  --blue:#0875e1; --blue-dark:#005cb9; --navy:#0b2545; --ink:#333333;
  --soap:#f6f7f8; --border:#e8ebed; --border2:#d4d9dd;
  --green:#43a047; --green-bg:#e8f5e9; --red:#e53935; --red-bg:#fdecea;
  --amber:#ff9800; --amber-bg:#fff3e0; --purple:#6b46c1;
  --mono:'Consolas','Menlo','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--ink);background:var(--soap);line-height:1.55}
header{background:var(--navy);color:#fff;padding:0 24px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.logo{font-size:19px;font-weight:700;padding:14px 0;white-space:nowrap}
.logo span{color:#ffb74d;font-weight:400}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:none;color:#cfd8e3;font-size:14px;font-weight:600;padding:18px 16px;cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{color:#fff}
nav button.active{color:#fff;border-bottom-color:#ffb74d}
main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:22px 24px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:24px;color:var(--navy);margin-bottom:6px}
h2{font-size:18px;color:var(--navy);margin-bottom:12px}
h3{font-size:15px;color:var(--navy);margin:16px 0 8px}
.sub{color:#667;font-size:14px;margin-bottom:18px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:12px;margin-right:6px;vertical-align:middle}
.pill.mc{background:#e3f0fd;color:var(--blue-dark)}
.pill.ae{background:#ede7f6;color:var(--purple)}
.pill.dl{background:var(--amber-bg);color:#c77700}
.pill.exam{background:var(--green-bg);color:#2e7d32}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.stat .big{font-size:26px;font-weight:700;color:var(--blue-dark)}
.stat .lbl{font-size:12.5px;color:#667;text-transform:uppercase;letter-spacing:.4px}
.wbar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:10px 0 6px;font-size:12px;color:#fff;font-weight:700}
.wbar div{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.btn{background:var(--blue);color:#fff;border:none;border-radius:22px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--blue-dark)}
.btn.sec{background:#fff;color:var(--blue-dark);border:1.5px solid var(--blue)}
.btn.sec:hover{background:#eef6fe}
.btn.warn{background:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 14px;font-size:13px}
select,input[type=number]{padding:8px 10px;border:1px solid var(--border2);border-radius:6px;font-size:14px;background:#fff}
code,pre{font-family:var(--mono)}
code{background:#eef1f4;padding:1px 5px;border-radius:4px;font-size:.9em;color:#b3005c}
pre{background:#0d1b2a;color:#d9e2ec;padding:14px 16px;border-radius:8px;font-size:12.5px;line-height:1.5;overflow-x:auto;margin:10px 0}
pre code{background:none;color:inherit;padding:0;font-size:inherit}
.layout{display:grid;grid-template-columns:250px 1fr;gap:20px}
.sidebar{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow-y:auto}
.sidebar .card{padding:10px}
.sidebar button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;font-size:13.5px;cursor:pointer;border-radius:6px;color:var(--ink)}
.sidebar button:hover{background:var(--soap)}
.sidebar button.active{background:#e3f0fd;color:var(--blue-dark);font-weight:700}
.sidebar .grp{font-size:11px;font-weight:800;color:#889;text-transform:uppercase;letter-spacing:.6px;padding:12px 12px 4px}
ul.pts{margin:8px 0 8px 20px}
ul.pts li{margin-bottom:7px}
.tip{background:var(--amber-bg);border-left:4px solid var(--amber);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:13.5px}
.tip b{color:#c77700}
table.t{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px}
table.t td{border:1px solid var(--border);padding:7px 10px;vertical-align:top}
table.t tr:nth-child(even) td{background:var(--soap)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border2);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:14px;cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--blue);background:#f5faff}
.opt.sel{border-color:var(--blue);background:#e3f0fd}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.dim{opacity:.65}
.opt .l{font-weight:800;margin-right:8px;color:var(--blue-dark)}
.expl{border-radius:8px;padding:12px 16px;margin-top:10px;font-size:13.5px}
.expl.ok{background:var(--green-bg);border-left:4px solid var(--green)}
.expl.no{background:var(--red-bg);border-left:4px solid var(--red)}
.qmeta{font-size:12.5px;color:#778;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.navgrid button{padding:8px 0;border:1.5px solid var(--border2);border-radius:6px;background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:#556}
.navgrid button.cur{border-color:var(--navy);background:var(--navy);color:#fff}
.navgrid button.ans{background:#e3f0fd;border-color:var(--blue)}
.navgrid button.flag{background:var(--amber-bg);border-color:var(--amber)}
.timer{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--navy);background:#fff;border:1.5px solid var(--border2);border-radius:8px;padding:6px 14px}
.timer.low{color:var(--red);border-color:var(--red)}
.qcode{white-space:pre-wrap}
.pbar{height:10px;background:var(--border);border-radius:6px;overflow:hidden;margin:6px 0}
.pbar div{height:100%;background:var(--green)}
.score{font-size:44px;font-weight:800}
.pass{color:var(--green)} .fail{color:var(--red)}
.review-q{border-top:1px solid var(--border);padding-top:16px;margin-top:16px}
.hidden{display:none}
.footer-note{text-align:center;color:#99a;font-size:12px;margin-top:30px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Extend<span>Pro</span> Cert Prep</div>
  <nav id="nav">
    <button data-v="dash" class="active">Dashboard</button>
    <button data-v="learn">Learn</button>
    <button data-v="practice">Practice</button>
    <button data-v="exam">Exam Simulator</button>
  </nav>
</header>
<main id="main"></main>

<script>
"use strict";
/* ==================== DATA (populated below) ==================== */
const TOPICS = {
  MC: {name:'Model Components', weight:30, cls:'mc'},
  AE: {name:'App Experience', weight:60, cls:'ae'},
  DL: {name:'Development Lifecycle', weight:10, cls:'dl'}
};
const QUESTIONS = [];   // filled by data blocks appended below
const LEARN = [];       // filled by learn content block

/* ==================== STATE ==================== */
const store = {
  get(k,d){ try{ const v = localStorage.getItem('xtdpro_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('xtdpro_'+k, JSON.stringify(v)); }catch(e){} }
};
let view='dash', learnSec=0;
let practice = {pool:[], idx:0, sel:null, checked:false, right:0, done:0, fTopic:'ALL', fSrc:'ALL'};
let exam = null; // {qs, idx, answers[], flags[], secs, timerId, submitted, results}
let history = store.get('history', []);

/* ==================== HELPERS ==================== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtQ(t){ // escape, then restore `code` spans and code blocks marked with @@
  let s = esc(t);
  s = s.replace(/@@([\s\S]*?)@@/g, (m,c)=>'<pre class="qcode"><code>'+c+'</code></pre>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}
function pillFor(q){ return '<span class="pill '+TOPICS[q.t].cls+'">'+TOPICS[q.t].name+'</span>' + (q.src==='exam' ? '<span class="pill exam">Workday Practice Exam</span>':''); }

/* ==================== ROUTER ==================== */
document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(exam && !exam.submitted && b.dataset.v!=='exam'){
    if(!confirm('An exam is in progress. Leaving keeps the timer running. Continue?')) return;
  }
  setView(b.dataset.v);
});
function setView(v){
  view=v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  render();
}
function render(){
  if(view==='dash') renderDash();
  else if(view==='learn') renderLearn();
  else if(view==='practice') renderPractice();
  else renderExam();
  window.scrollTo(0,0);
}

/* ==================== DASHBOARD ==================== */
function bankCounts(){
  const c={MC:0,AE:0,DL:0,exam:0};
  QUESTIONS.forEach(q=>{c[q.t]++; if(q.src==='exam')c.exam++;});
  return c;
}
function renderDash(){
  const c = bankCounts();
  const best = history.length? Math.max(...history.map(h=>h.pct)) : null;
  const last = history.length? history[history.length-1] : null;
  $('#main').innerHTML = `
  <h1>Workday Pro &mdash; Workday Extend Certification</h1>
  <div class="sub">Built from the official Exam Guide, the Workday Education course manuals (Workday Extend for Developers; Model Components &amp; Orchestrations for Developers), and your 9 Sep 2026 Questionmark practice exam.</div>

  <div class="grid3">
    <div class="stat"><div class="big">~50</div><div class="lbl">Questions on real exam</div></div>
    <div class="stat"><div class="big">120 min</div><div class="lbl">Time limit &middot; one attempt</div></div>
    <div class="stat"><div class="big">${QUESTIONS.length}</div><div class="lbl">Questions in this bank</div></div>
    <div class="stat"><div class="big">${c.exam}</div><div class="lbl">Real practice-exam questions</div></div>
    <div class="stat"><div class="big">${best===null?'&ndash;':best+'%'}</div><div class="lbl">Best simulated score</div></div>
    <div class="stat"><div class="big">${history.length}</div><div class="lbl">Exams completed</div></div>
  </div>

  <div class="card" style="margin-top:18px">
    <h2>Exam topic weights</h2>
    <div class="wbar">
      <div style="width:30%;background:var(--blue)">Model Components 30%</div>
      <div style="width:60%;background:var(--purple)">App Experience 60%</div>
      <div style="width:10%;background:var(--amber)">Dev Lifecycle 10%</div>
    </div>
    <div class="sub" style="margin:6px 0 0">Question bank: Model Components ${c.MC} &middot; App Experience ${c.AE} &middot; Development Lifecycle ${c.DL}. The Exam Simulator samples 50 questions in the official 30 / 60 / 10 ratio.</div>
  </div>

  <div class="card">
    <h2>How to use this app</h2>
    <ul class="pts">
      <li><b>Learn</b> &mdash; condensed study notes for every task in the exam guide, with PMD / model component code samples and exam tips.</li>
      <li><b>Practice</b> &mdash; work through the full bank with instant feedback and explanations. Filter to a topic you're weak on, or to the 18 real practice-exam questions.</li>
      <li><b>Exam Simulator</b> &mdash; 50 questions, 120-minute countdown, question navigator with flagging, weighted sampling, and a score report broken down by topic. 70&ndash;75% is a typical Workday Pro passing bar &mdash; aim for 80%+ here.</li>
    </ul>
    ${last? `<div class="tip"><b>Last simulation:</b> ${last.pct}% (${last.right}/${last.total}) on ${last.date} &mdash; MC ${last.by.MC}, AE ${last.by.AE}, DL ${last.by.DL}</div>`:''}
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="setView('exam')">Start an exam</button>
      <button class="btn sec" onclick="setView('learn')">Open study notes</button>
      <button class="btn sec" onclick="setView('practice')">Practice questions</button>
    </div>
  </div>
  <div class="footer-note">Offline single-file app &middot; progress saved locally in this browser when available</div>`;
}

/* ==================== LEARN ==================== */
function renderLearn(){
  const side = LEARN.map((s,i)=>{
    const g = (i===0||LEARN[i-1].t!==s.t) ? `<div class="grp">${TOPICS[s.t].name} (${TOPICS[s.t].weight}%)</div>` : '';
    return g+`<button class="${i===learnSec?'active':''}" onclick="learnSec=${i};renderLearn()">${s.title}</button>`;
  }).join('');
  const s = LEARN[learnSec];
  $('#main').innerHTML = `
  <div class="layout">
    <div class="sidebar"><div class="card">${side}</div></div>
    <div>
      <div class="card">
        <div>${'<span class="pill '+TOPICS[s.t].cls+'">'+TOPICS[s.t].name+'</span>'}</div>
        <h1 style="margin-top:8px">${s.title}</h1>
        <div class="sub">${s.sub||''}</div>
        ${s.html}
        <div class="spread" style="margin-top:22px">
          <button class="btn sec" ${learnSec===0?'disabled':''} onclick="learnSec--;renderLearn()">&larr; Previous</button>
          <button class="btn" ${learnSec===LEARN.length-1?'disabled':''} onclick="learnSec++;renderLearn()">Next section &rarr;</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ==================== PRACTICE ==================== */
function buildPool(){
  practice.pool = shuffle(QUESTIONS.map((q,i)=>i).filter(i=>{
    const q=QUESTIONS[i];
    return (practice.fTopic==='ALL'||q.t===practice.fTopic) && (practice.fSrc==='ALL'||q.src==='exam');
  }));
  practice.idx=0; practice.sel=null; practice.checked=false; practice.right=0; practice.done=0;
}
function renderPractice(){
  if(!practice.pool.length) buildPool();
  if(!practice.pool.length){ $('#main').innerHTML='<div class="card">No questions match this filter.</div>'; return; }
  const qi = practice.pool[practice.idx], q = QUESTIONS[qi];
  const opts = q.o.map((o,i)=>{
    let cls='opt';
    if(practice.checked){
      if(i===q.a) cls+=' correct';
      else if(i===practice.sel) cls+=' wrong';
      else cls+=' dim';
    } else if(i===practice.sel) cls+=' sel';
    return `<button class="${cls}" onclick="pickPractice(${i})"><span class="l">${'ABCDEF'[i]}.</span>${fmtQ(o)}</button>`;
  }).join('');
  $('#main').innerHTML = `
  <div class="spread" style="margin-bottom:14px">
    <h1>Practice</h1>
    <div class="row">
      <select onchange="practice.fTopic=this.value;buildPool();renderPractice()">
        <option value="ALL" ${practice.fTopic==='ALL'?'selected':''}>All topics</option>
        <option value="MC" ${practice.fTopic==='MC'?'selected':''}>Model Components</option>
        <option value="AE" ${practice.fTopic==='AE'?'selected':''}>App Experience</option>
        <option value="DL" ${practice.fTopic==='DL'?'selected':''}>Development Lifecycle</option>
      </select>
      <select onchange="practice.fSrc=this.value;buildPool();renderPractice()">
        <option value="ALL" ${practice.fSrc==='ALL'?'selected':''}>All sources</option>
        <option value="exam" ${practice.fSrc==='exam'?'selected':''}>Practice-exam questions only</option>
      </select>
    </div>
  </div>
  <div class="card">
    <div class="spread qmeta">
      <span>${pillFor(q)} &nbsp; Question ${practice.idx+1} of ${practice.pool.length} &middot; ${q.s}</span>
      <span>Session: ${practice.right}/${practice.done} correct</span>
    </div>
    <div style="font-size:15px;margin:10px 0 14px">${fmtQ(q.q)}</div>
    ${opts}
    ${practice.checked ? `<div class="expl ${practice.sel===q.a?'ok':'no'}"><b>${practice.sel===q.a?'Correct.':'Not quite &mdash; the answer is '+'ABCDEF'[q.a]+'.'}</b> ${fmtQ(q.e)}</div>`:''}
    <div class="row" style="margin-top:14px">
      ${practice.checked
        ? `<button class="btn" onclick="nextPractice()">Next question &rarr;</button>`
        : `<button class="btn" ${practice.sel===null?'disabled':''} onclick="checkPractice()">Check answer</button>`}
      <button class="btn sec sm" onclick="buildPool();renderPractice()">Reshuffle</button>
    </div>
  </div>`;
}
function pickPractice(i){ if(practice.checked) return; practice.sel=i; renderPractice(); }
function checkPractice(){ practice.checked=true; practice.done++; if(practice.sel===QUESTIONS[practice.pool[practice.idx]].a) practice.right++; renderPractice(); }
function nextPractice(){ practice.idx=(practice.idx+1)%practice.pool.length; practice.sel=null; practice.checked=false; renderPractice(); }

/* ==================== EXAM ==================== */
function weightedSample(n){
  const want = {MC:Math.round(n*.30), AE:Math.round(n*.60), DL:0};
  want.DL = n - want.MC - want.AE;
  const out=[];
  for(const t of ['MC','AE','DL']){
    const pool = shuffle(QUESTIONS.map((q,i)=>i).filter(i=>QUESTIONS[i].t===t));
    out.push(...pool.slice(0, Math.min(want[t], pool.length)));
  }
  return shuffle(out);
}
function startExam(n, mins){
  exam = {qs: weightedSample(n), idx:0, answers:{}, flags:{}, secs:mins*60, timerId:null, submitted:false, results:null};
  exam.timerId = setInterval(()=>{ exam.secs--; const t=$('#tmr'); if(t){ t.textContent=clock(exam.secs); t.classList.toggle('low', exam.secs<600);} if(exam.secs<=0) submitExam(true); }, 1000);
  renderExam();
}
function clock(s){ s=Math.max(0,s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h? h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function renderExam(){
  if(!exam){ // setup screen
    $('#main').innerHTML = `
    <h1>Exam Simulator</h1>
    <div class="sub">Mirrors the real exam: ~50 questions, 120 minutes, weighted 30% Model Components / 60% App Experience / 10% Development Lifecycle.</div>
    <div class="card">
      <h2>Full simulation</h2>
      <p>50 questions &middot; 120-minute countdown &middot; navigator with flagging &middot; topic-weighted sampling.</p>
      <button class="btn" style="margin-top:10px" onclick="startExam(50,120)">Start full exam</button>
    </div>
    <div class="card">
      <h2>Quick drill</h2>
      <p>20 questions &middot; 45 minutes. Same weighting, shorter sitting &mdash; matches the Questionmark practice-exam length.</p>
      <button class="btn sec" style="margin-top:10px" onclick="startExam(20,45)">Start quick drill</button>
    </div>
    ${history.length? `<div class="card"><h2>Past attempts</h2>${history.slice().reverse().map(h=>`<div class="spread" style="border-bottom:1px solid var(--border);padding:8px 0"><span>${h.date} &middot; ${h.total} questions</span><b class="${h.pct>=75?'pass':'fail'}">${h.pct}%</b></div>`).join('')}</div>`:''}`;
    return;
  }
  if(exam.submitted){ renderResults(); return; }
  const q = QUESTIONS[exam.qs[exam.idx]];
  const opts = q.o.map((o,i)=>`<button class="opt ${exam.answers[exam.idx]===i?'sel':''}" onclick="exam.answers[${exam.idx}]===${i}?delete exam.answers[${exam.idx}]:exam.answers[${exam.idx}]=${i};renderExam()"><span class="l">${'ABCDEF'[i]}.</span>${fmtQ(o)}</button>`).join('');
  const navg = exam.qs.map((_,i)=>`<button class="${i===exam.idx?'cur':(exam.flags[i]?'flag':(exam.answers[i]!==undefined?'ans':''))}" onclick="exam.idx=${i};renderExam()">${i+1}</button>`).join('');
  const answered = Object.keys(exam.answers).length;
  $('#main').innerHTML = `
  <div class="spread" style="margin-bottom:14px">
    <h1>Question ${exam.idx+1} of ${exam.qs.length}</h1>
    <div class="row"><span class="timer ${exam.secs<600?'low':''}" id="tmr">${clock(exam.secs)}</span></div>
  </div>
  <div class="layout" style="grid-template-columns:1fr 260px">
    <div class="card">
      <div class="qmeta">${'<span class="pill '+TOPICS[q.t].cls+'">'+TOPICS[q.t].name+'</span>'} ${q.s}</div>
      <div style="font-size:15px;margin:10px 0 14px">${fmtQ(q.q)}</div>
      ${opts}
      <div class="spread" style="margin-top:16px">
        <div class="row">
          <button class="btn sec sm" ${exam.idx===0?'disabled':''} onclick="exam.idx--;renderExam()">&larr; Previous</button>
          <button class="btn sm" ${exam.idx===exam.qs.length-1?'disabled':''} onclick="exam.idx++;renderExam()">Next &rarr;</button>
        </div>
        <button class="btn sec sm" onclick="exam.flags[exam.idx]=!exam.flags[exam.idx];renderExam()">${exam.flags[exam.idx]?'Unflag':'Flag for review'}</button>
      </div>
    </div>
    <div class="sidebar">
      <div class="card">
        <b style="font-size:13.5px">Navigator</b>
        <div class="qmeta" style="margin-top:4px">${answered}/${exam.qs.length} answered</div>
        <div class="pbar"><div style="width:${Math.round(answered/exam.qs.length*100)}%"></div></div>
        <div class="navgrid">${navg}</div>
        <button class="btn warn" style="width:100%;margin-top:14px" onclick="submitExam(false)">Submit exam</button>
      </div>
    </div>
  </div>`;
}
function submitExam(auto){
  if(!auto){
    const un = exam.qs.length - Object.keys(exam.answers).length;
    if(!confirm(un>0 ? un+' question(s) are unanswered. Submit anyway?' : 'Submit your exam?')) return;
  }
  clearInterval(exam.timerId);
  let right=0; const by={MC:[0,0],AE:[0,0],DL:[0,0]};
  exam.qs.forEach((qi,i)=>{ const q=QUESTIONS[qi]; by[q.t][1]++; if(exam.answers[i]===q.a){right++; by[q.t][0]++;} });
  const pct = Math.round(right/exam.qs.length*100);
  exam.results = {right, pct, by};
  exam.submitted = true;
  history.push({date:new Date().toLocaleDateString(), total:exam.qs.length, right, pct,
    by:{MC:by.MC[0]+'/'+by.MC[1], AE:by.AE[0]+'/'+by.AE[1], DL:by.DL[0]+'/'+by.DL[1]}});
  store.set('history', history);
  renderExam();
}
function renderResults(){
  const r = exam.results;
  const rows = ['MC','AE','DL'].map(t=>{
    const [c,n]=r.by[t]; const p=n?Math.round(c/n*100):0;
    return `<tr><td>${TOPICS[t].name}</td><td>${c} / ${n}</td><td style="width:45%"><div class="pbar"><div style="width:${p}%;background:${p>=75?'var(--green)':'var(--amber)'}"></div></div></td><td><b>${p}%</b></td></tr>`;
  }).join('');
  const review = exam.qs.map((qi,i)=>{
    const q=QUESTIONS[qi]; const mine=exam.answers[i]; const ok=mine===q.a;
    return `<div class="review-q">
      <div class="qmeta">${pillFor(q)} Question ${i+1} &middot; ${q.s} &middot; <b style="color:${ok?'var(--green)':'var(--red)'}">${ok?'Correct':(mine===undefined?'Unanswered':'Incorrect')}</b></div>
      <div style="margin:6px 0 8px">${fmtQ(q.q)}</div>
      ${q.o.map((o,j)=>`<div class="opt dim ${j===q.a?'correct':(j===mine?'wrong':'')}" style="cursor:default"><span class="l">${'ABCDEF'[j]}.</span>${fmtQ(o)}</div>`).join('')}
      <div class="expl ok">${fmtQ(q.e)}</div>
    </div>`;
  }).join('');
  $('#main').innerHTML = `
  <h1>Results</h1>
  <div class="card" style="text-align:center">
    <div class="score ${r.pct>=75?'pass':'fail'}">${r.pct}%</div>
    <div class="sub">${r.right} of ${exam.qs.length} correct &middot; ${r.pct>=75?'On track &mdash; at or above a typical passing bar.':'Below a typical passing bar &mdash; review the weak topics below.'}</div>
    <table class="t" style="text-align:left"><tr><th>Topic</th><th>Score</th><th></th><th>%</th></tr>${rows}</table>
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="btn" onclick="exam=null;renderExam()">New exam</button>
      <button class="btn sec" onclick="setView('learn')">Back to study notes</button>
    </div>
  </div>
  <div class="card"><h2>Answer review</h2>${review}</div>`;
}

/* ==================== INIT (called after data loads) ==================== */
window.addEventListener('DOMContentLoaded', ()=>{ render(); });
</script>

<script id="learn-data">
/* ---------- LEARNING SECTIONS ---------- */
(function(){
const S = (t,title,sub,html)=>LEARN.push({t,title,sub,html});

S('MC','Designing the Data Model','Exam guide: determine necessary model components, define business objects and relationships, select appropriate field types.',`
<ul class="pts">
<li>Model components live in your app's <b>model</b> folder: business objects, security domains, business processes, tasks, orchestrations, and attributes. Presentation components (PMD/AMD/SMD) consume them.</li>
<li>A <b>model component business object (MCBO)</b> defines app-owned data stored in your tenant. Contrast with <b>Workday-delivered business objects</b> (WORKER, ORGANIZATION, etc.): you can reference delivered objects from fields, but you cannot change their definition or store new fields on them.</li>
<li>Common field types: <code>TEXT</code>, <code>RICH_TEXT</code>, <code>NUMBER</code>, <code>CURRENCY</code>, <code>BOOLEAN</code>, <code>DATE</code>, plus reference types <code>SINGLE_INSTANCE</code> and <code>MULTI_INSTANCE</code> and <code>ATTACHMENT</code> via a model attachment object.</li>
<li><b>SINGLE_INSTANCE</b> = the field holds one reference to a <code>target</code> business object (delivered or custom). <b>MULTI_INSTANCE</b> = the field holds a collection of references.</li>
<li><b>One-to-many pattern:</b> put a SINGLE_INSTANCE field on the <i>many</i> side pointing at the <i>one</i> side. An Event with many Attendees = Attendee has a SINGLE_INSTANCE field referencing Event (each attendee belongs to exactly one event).</li>
<li>Relationships are how reports and WQL traverse your data: a SINGLE_INSTANCE field exposes the target object's fields to reporting from the source data source.</li>
</ul>
<pre><code>{
  "id": 1,
  "name": "Attendee",
  "label": "Attendee",
  "defaultSecurityDomains": ["ManageEvents"],
  "defaultCollection": { "name": "attendees", "label": "Attendees" },
  "fields": [
    { "id": 1, "name": "event", "label": "Event",
      "type": "SINGLE_INSTANCE", "target": "Event" },
    { "id": 2, "name": "attendeeWorker", "label": "Worker",
      "type": "SINGLE_INSTANCE", "target": "WORKER", "secureByTarget": true }
  ]
}</code></pre>
<div class="tip"><b>Exam tip:</b> when a question asks how to make "one X have many Y with a SINGLE_INSTANCE field," the answer is always: add the SINGLE_INSTANCE field to Y (the many side) referencing X &mdash; never to WORKER or to both sides.</div>`);

S('MC','Business Object Attributes &amp; Limitations','Field properties you must recognize on sight: enableIndex, secureByTarget, useForDisplay, isPurgeable, defaultCollection.',`
<table class="t">
<tr><th>Attribute</th><th>What it does</th></tr>
<tr><td><code>defaultCollection</code></td><td>Names the collection (data source) for the object's REST API and reporting, e.g. <code>attendees</code>. This is the collection name you see in API URLs and pick as a report data source.</td></tr>
<tr><td><code>defaultSecurityDomains</code></td><td>The security domain(s) that secure the object's data by default.</td></tr>
<tr><td><code>enableIndex</code></td><td>Set <code>true</code> on a field to make it usable as a <b>query parameter</b> (filtering in GET requests / WQL). SINGLE_INSTANCE fields are indexed automatically.</td></tr>
<tr><td><code>secureByTarget</code></td><td>On a SINGLE_INSTANCE field, makes instance access follow the security of the <code>target</code> (contextual security). Required to use <b>constrained security groups</b> in the domain policy &mdash; e.g. managers see only instances tied to their direct reports.</td></tr>
<tr><td><code>useForDisplay</code></td><td>Marks the field whose value represents the instance when it's displayed/referenced (the instance's display name).</td></tr>
<tr><td><code>isPurgeable</code></td><td>Allows the field's data to be purged (e.g. for data-privacy processes).</td></tr>
<tr><td><code>required</code></td><td>Field must be populated when creating/updating instances.</td></tr>
</table>
<ul class="pts">
<li>Design limitations to remember: field <code>name</code>/<code>id</code> values must stay stable once deployed with data (schema changes with existing production data are constrained); you cannot add fields to Workday-delivered objects; effective dating is not a property you toggle with secureByTarget (distractor!).</li>
</ul>
<div class="tip"><b>Exam tip (from the practice exam):</b> "make a TEXT field available as a query parameter" &rarr; <code>enableIndex: true</code>. "Constrained security group option missing in the domain policy" &rarr; add <code>secureByTarget: true</code> to the SINGLE_INSTANCE field.</div>`);

S('MC','Business Object REST API &amp; the bulk Parameter','Exam guide: use the business object API, including the bulk parameter.',`
<ul class="pts">
<li>Every MCBO gets a generated REST API on its collection: <code>GET /apps/{appId}/v1/{collection}</code> (list), <code>GET .../{id}</code>, <code>POST</code> (create), <code>PATCH/PUT .../{id}</code> (update), <code>DELETE .../{id}</code>.</li>
<li><b>Query parameters</b> on GET: <code>limit</code> and <code>offset</code> for paging (limit caps how many items are returned &mdash; it is <i>not</i> a bulk-create mechanism), plus any indexed fields for filtering.</li>
<li><b>Bulk operations:</b> add <code>?bulk=true</code> to create, update, or delete <i>multiple instances in a single request</i> &mdash; send an array in the body (up to 100 instances per request).</li>
<li>Instance references in request bodies use the instance's <code>id</code>; in PMDs you generate references for new instances with <code>graph:createId()</code> patterns when building payloads.</li>
</ul>
<pre><code>POST /apps/eventTracker_abc123/v1/attendees?bulk=true
[
  { "event": { "id": "EVT1" }, "attendeeWorker": { "id": "worker-3aa1" } },
  { "event": { "id": "EVT1" }, "attendeeWorker": { "id": "worker-77b2" } }
]</code></pre>
<div class="tip"><b>Exam tip:</b> "create multiple instances in a single API request" &rarr; <code>?bulk=true</code>. Distractors like <code>?allowMultiple=true</code>, <code>?isCollection=true</code>, or <code>limit=1000</code> are fabricated or unrelated.</div>`);

S('MC','Model Component Business Processes','Exam guide: create and configure a model component business process, including process steps and page routes.',`
<ul class="pts">
<li>A <b>model business process (MBP)</b> definition in your app creates a custom business process type in the tenant (e.g. "Event Approval"). After deployment, administrators configure its definition (steps, routing, approvers) in the tenant like any BP.</li>
<li>Typical steps: <b>initiation</b>, <b>approval</b>, <b>to-do</b>, <b>action/service</b> steps &mdash; including steps that <b>launch an orchestration</b>.</li>
<li><b>Page routes</b> connect BP steps back to your app's pages &mdash; e.g. which PMD page opens for the initiating step or for an approval's view/edit experience.</li>
<li><b>Launching:</b> a PMD can launch a business process (e.g. on submit); a BP step can launch an <b>orchestration</b>, passing values by populating the orchestration's <b>launch parameters</b> in the BP definition.</li>
<li>A business process does <b>not</b> automatically write values back into your business object. To update a field after approval (e.g. set approval status), run an <b>orchestration</b> (or integration) as a step after the approval that calls the object's API.</li>
</ul>
<div class="tip"><b>Exam tip (practice exam):</b> pass values BP &rarr; orchestration by creating a <b>parameter on the orchestration</b> and setting its value in the BP definition. Update a field post-approval with an <b>orchestration after the approval step</b> &mdash; there is no 'updateField' property.</div>`);

S('MC','App Security: Domains &amp; Policies','Exam guide: configure app security with Workday-delivered and model component security domains.',`
<ul class="pts">
<li>Two kinds of domains secure an Extend app: <b>Workday-delivered security domains</b> (secure delivered data your app touches) and <b>model component security domains</b> you define in the app (secure your MCBO data sources, tasks, and pages).</li>
<li>Define the domain in App Builder (model component), attach it to business objects via <code>defaultSecurityDomains</code> (or per-field <code>securityDomains</code>), reference it in PMD <code>securityDomains</code> for page-level security, then deploy.</li>
<li><b>After deployment</b>, grant access in the Workday tenant: from <b>Workday Extend App Manager</b>, open the app's security domain and edit its <b>domain security policy</b> &mdash; add security groups with View/Modify (GET/PUT etc.) permissions &mdash; then run <b>Activate Pending Security Policy Changes</b>.</li>
<li><b>Constrained security groups</b> (e.g. "Manager" constrained to their org) only become selectable on a policy when the data supports contextual security &mdash; for MCBOs that means a SINGLE_INSTANCE field with <code>secureByTarget: true</code>.</li>
<li>The <b>Developer Site Console</b> is for app-level administration (attributes, promotion, logs) &mdash; not for editing domain security policies. <b>App Builder</b> only defines domains in source.</li>
<li>Multi-level access model: separate domains per audience (e.g. "View: My Feedback" self-service vs "Manage: All Feedback" admin) and secure pages, tasks, and data sources with the matching domain.</li>
</ul>
<div class="tip"><b>Exam tip (practice exam):</b> "where do you configure the new domain after deployment?" &rarr; in the tenant via <b>Workday Extend App Manager</b> (domain security policy), not the Developer Site Console.</div>`);

S('MC','Attachments &amp; Multi-Instance Data','From the Model Components course: model attachment objects, uploading and displaying attachments; advanced multi-instance usage.',`
<ul class="pts">
<li>To store files, define a <b>model attachment object</b> and reference it from a business object with an <code>ATTACHMENT</code>-type field; upload via the attachment API/endpoints from the PMD (e.g. a <code>fileUploader</code> widget) and render stored files back in the page.</li>
<li><b>MULTI_INSTANCE fields</b> hold collections of references &mdash; use them when an instance genuinely owns a set of references (e.g. tags), and remember reporting/WQL traversal differs from SINGLE_INSTANCE.</li>
<li>Advanced grid features from the course: <b>filtering</b>, <b>export to Excel</b>, and <b>pagination</b> are enabled through grid widget attributes backed by indexed fields and endpoint paging (<code>limit</code>/<code>offset</code>).</li>
</ul>`);

S('AE','Data Access: REST APIs, WQL &amp; Data Sources','Exam guide: use REST and WQL APIs; explain the appropriate use for each data source type.',`
<table class="t">
<tr><th>Data access option</th><th>Use it for</th></tr>
<tr><td><b>App business object API</b> (collection REST API)</td><td>CRUD on your own MCBO data from pages and orchestrations.</td></tr>
<tr><td><b>Workday REST APIs</b> (e.g. <code>/common/v1/workers</code>, staffing, etc.)</td><td>Reading/acting on delivered Workday data with JSON over REST.</td></tr>
<tr><td><b>WQL</b> (<code>/wql/v1/data?query=SELECT ... FROM ...</code>)</td><td>Report-style, read-only queries across data sources &mdash; select specific fields, filter, join through relationships; great for grids and analytics-style reads.</td></tr>
<tr><td><b>RaaS / custom reports</b></td><td>Reusing tenant report logic (calc fields, delivered data sources) as a service.</td></tr>
<tr><td><b>SOAP APIs</b></td><td>Operations only exposed via Workday Web Services (e.g. <code>Import_Change_Home_Contact_Information</code>) &mdash; call them from an <b>orchestration</b>, never directly from a PMD endpoint.</td></tr>
</table>
<pre><code>SELECT event, attendeeWorker, registrationDate
FROM attendees
WHERE registrationDate &gt;= '2026-01-01'</code></pre>
<ul class="pts">
<li>Custom reports on an app data source can traverse SINGLE_INSTANCE relationships &mdash; fields on both the base object and the referenced object are available (indexing is a performance aid, not a prerequisite).</li>
<li>Data source security: an app data source is secured by its business object's security domain(s); delivered data sources by their delivered domains &mdash; users need access on <i>both</i> sides of any traversal.</li>
</ul>
<div class="tip"><b>Exam tip (practice exam):</b> SOAP = orchestration. Reporting on an app data source exposes related SINGLE_INSTANCE fields with no extra setup.</div>`);

S('AE','Endpoints: Inbound, Outbound &amp; Deferred','Exam guide: configure inbound, outbound, and deferred endpoints.',`
<ul class="pts">
<li><b>Inbound endpoints</b> (<code>endPoints</code> array) fetch data when the page loads. Reference the response in expressions by endpoint name: <code>&lt;% getEmployees.data %&gt;</code>.</li>
<li><b>Deferred endpoints</b> are inbound endpoints with <code>"deferred": true</code> &mdash; they do <i>not</i> run at page load; you invoke them from script (e.g. after a user picks filters, or for instanceList search endpoints).</li>
<li><b>Outbound endpoints</b> (under <code>outboundData.outboundEndPoints</code>) send data &mdash; typically fired on submit or from a button. Build the request body in the endpoint's <code>onSend</code> script (return the value to send).</li>
<li><b>Error handling attributes</b> (per endpoint, in the PMD &mdash; not the AMD): <code>failOnStatusCodes</code> (raise an error for specific HTTP codes, e.g. 400 for bad request), <code>onFail</code> (script to run on failure), <code>bestEffort</code> (don't block on failure).</li>
<li>Auth: endpoints commonly use <code>"authType": "sso"</code> against Workday APIs; <code>baseUrlType</code> points at the API category (e.g. app, workday, or a configured external site).</li>
</ul>
<pre><code>"outboundData": {
  "outboundEndPoints": [{
    "name": "createAttendee",
    "url": "&lt;% site.applicationId + '/v1/attendees' %&gt;",
    "authType": "sso",
    "httpMethod": "POST",
    "failOnStatusCodes": [ { "code": 400 } ],
    "onSend": "&lt;% { 'event': {'id': queryParams.eventId},
                    'attendeeWorker': {'id': self.data.workerId} } %&gt;"
  }]
}</code></pre>
<div class="tip"><b>Exam tip (practice exam):</b> configure the request body &rarr; <code>onSend</code>. Raise an error on a failed bad request &rarr; <code>failOnStatusCodes</code> with <b>400</b> on the <b>outbound endpoint</b> (not in the AMD, not 404). <code>deferred</code> is only about when inbound endpoints fetch.</div>`);

S('AE','Widgets (PMD Tags)','Exam guide: define PMD widgets — buttons, grids, instance lists, and more; configure attributes such as visibility.',`
<ul class="pts">
<li>Everyday widgets: <code>text</code>, <code>richText</code>, <code>title</code>, <code>image</code>, <code>banner</code>, <code>section</code>/<code>fieldSet</code>, <code>button</code>, <code>checkBox</code>, <code>radioButtonGroup</code>, <code>dropDownButton</code>/select lists, <code>date</code>, <code>number</code>, <code>currency</code>, <code>grid</code>, <code>instanceList</code>, <code>pod</code>.</li>
<li><b>grid</b>: bind <code>rows</code> to a collection (e.g. <code>&lt;% getEmployees.data %&gt;</code>), name each row with <code>rowVariableName</code>, then reference it inside column <code>cellTemplate</code> values (<code>&lt;% employee.name %&gt;</code>).</li>
<li><b>instanceList</b>: pick instances of a business object; uses an <code>idKey</code> and can be backed by a <b>search endpoint</b> (deferred) for type-ahead.</li>
<li><b>pods</b>: reusable presentation fragments (own .pod files) for common widget groups/logic, included into pages.</li>
<li>Common attributes: <code>visible</code> (expression-driven show/hide), <code>enabled</code>, <code>required</code>, <code>label</code>, <code>value</code>, widget-level validation attributes; widgets are referenced in script by their <code>id</code> (e.g. <code>txtUserEntry.value</code>).</li>
</ul>
<pre><code>{
  "type": "grid", "id": "employeeGrid", "label": "Employees",
  "rows": "&lt;% getEmployees.data %&gt;",
  "rowVariableName": "employee",
  "columns": [{
    "type": "column", "columnId": "nameCol", "label": "Employee Name",
    "cellTemplate": { "type": "text", "value": "&lt;% employee.name %&gt;" }
  }]
}</code></pre>
<div class="tip"><b>Exam tip (practice exam):</b> grid <code>rows</code> binds to <code>endpointName.data</code> (the response data), not <code>endPoints.endpointName</code> (the endpoint object).</div>`);

S('AE','PMD Structure','Exam guide: explain the structure of a PMD, including the main subschemas.',`
<table class="t">
<tr><th>PMD subschema</th><th>Contents</th></tr>
<tr><td><code>id</code></td><td>Page identifier (matches the file name).</td></tr>
<tr><td><code>securityDomains</code></td><td>Domain(s) a user needs to open the page (page-level security).</td></tr>
<tr><td><code>include</code></td><td>Other files pulled in &mdash; <code>.script</code> files (shared functions, static picklists), pods.</td></tr>
<tr><td><code>script</code></td><td>Page-level script: functions and logic available to expressions on the page.</td></tr>
<tr><td><code>endPoints</code></td><td>Inbound (and deferred) endpoints fetched for the page.</td></tr>
<tr><td><code>outboundData</code></td><td><code>outboundEndPoints</code> that send data on submit/action.</td></tr>
<tr><td><code>onLoad</code> / <code>onSubmit</code></td><td>Page lifecycle hooks for script.</td></tr>
<tr><td><code>presentation</code></td><td>The UI: page <code>title</code>, <code>body</code> (widget tree/layout), <code>footer</code> (buttons), tabs, micro-page conclusions.</td></tr>
</table>
<div class="tip"><b>Exam tip:</b> layout lives in <code>presentation</code> (inside the PMD). The AMD does <i>not</i> control page layout &mdash; a favorite distractor.</div>`);

S('AE','PMD Scripting &amp; Functions','Exam guide: variables, invoking deferred endpoints, validations, script events, query/route parameters, flow variables.',`
<ul class="pts">
<li>Expressions live in <code>&lt;% ... %&gt;</code>. Script supports <code>const</code>/<code>let</code>-style declarations, functions, and a standard library of namespaced functions: <code>string:</code>, <code>date:</code>, <code>list:</code>/collection helpers like <code>.contains()</code>, <code>.filter()</code>, <code>.map()</code>, <code>.add()</code>, <code>.size()</code>, plus <code>graph:createId()</code> for new instance references.</li>
<li><b>Parameter scopes:</b> <code>queryParams.x</code> (URL query string), route parameters (path segments defined in the AMD routes), <code>flowVariables.x</code> (shared across steps of a flow), <code>pageVariables</code> (page scope), <code>site</code> values like <code>site.applicationId</code>.</li>
<li><b>Events:</b> page <code>onLoad</code>/<code>onSubmit</code>; widget events like <code>onChange</code>/<code>onSelect</code>; endpoint <code>onSend</code>/<code>onFail</code>. Deferred endpoints are invoked from script when needed.</li>
<li><b>Validations:</b> widget-level (attributes on the widget) and page-level (e.g. onSubmit checks that block submission with an error message).</li>
<li>Booleans behave like booleans: <code>['Beth','Logan','George'].contains('Logan')</code> returns <code>true</code> &mdash; watch for questions passing a widget's <code>.value</code> into a function.</li>
</ul>
<pre><code>"script": "&lt;%
  const isValidInput = function(input){
    const validValues = ['Beth','Logan','George'];
    return validValues.contains(input);   // boolean
  }
%&gt;"</code></pre>`);

S('AE','Flows, Error Handling &amp; UI Experience','Exam guide: flow definitions (steps, transitions, flow variables), error handling, micro pages, page design.',`
<ul class="pts">
<li><b>flowDefinitions</b> live in the <b>AMD</b> and define multi-step, wizard-style navigation between otherwise independent tasks: each <code>flowStep</code> has an <code>id</code>, a <code>taskId</code>, optional <code>startsFlow: true</code>, and <code>transitions</code>.</li>
<li><b>Transitions evaluate in order</b> (<code>"order": "a"</code>, <code>"b"</code>, <code>"c"</code>...). The first transition whose <code>condition</code> is true wins &mdash; so a final transition with condition <code>&lt;% true %&gt;</code> is the standard catch-all/default route.</li>
<li><b>flowVariables</b> carry values between steps (<code>&lt;% flowVariables.transportationType %&gt;</code>).</li>
<li><b>Error handling UX:</b> endpoint <code>failOnStatusCodes</code>/<code>onFail</code> + banners/messages to surface failures; page-level validation errors block submit with feedback.</li>
<li><b>Micro pages</b> give lightweight single-purpose experiences (e.g. quick actions) with a conclusion step; consider them plus overall page design (sections, progressive disclosure) when building the UX.</li>
</ul>
<pre><code>"transitions": [
  { "order": "a", "value": "passengerVehicleStep",
    "condition": "&lt;% flowVariables.transportationType == 'passengerVehicle' %&gt;" },
  { "order": "b", "value": "publicTransitStep",
    "condition": "&lt;% flowVariables.transportationType == 'publicTransit' %&gt;" },
  { "order": "c", "value": "workFromHomeStep", "condition": "&lt;% true %&gt;" }
]</code></pre>
<div class="tip"><b>Exam tip (practice exam):</b> the catch-all transition uses <code>true</code> &mdash; ordered evaluation means it only fires when earlier conditions fail. <code>false</code> would never fire.</div>`);

S('AE','Tasks &amp; App Access','Exam guide: create model component tasks to access different parts of an app.',`
<ul class="pts">
<li>A <b>task</b> is a model component that maps a task name to a page (and route) in your app. Tasks are what make pages reachable: Workday search, related actions, the app's landing experience, deep links, and flow steps (<code>taskId</code>) all navigate via tasks.</li>
<li>Secure tasks with security domains so only the right groups can reach each part of the app.</li>
<li>Buttons, business objects, and orchestrations are <i>not</i> navigation mechanisms &mdash; a button can act within a page, but the model component for navigating users to a page is the <b>task</b>.</li>
</ul>
<div class="tip"><b>Exam tip (practice exam):</b> "Which model component navigates users directly to a page?" &rarr; <b>Task</b>.</div>`);

S('AE','Orchestrations: Sync vs Async','Exam guide: differentiate between synchronous and asynchronous orchestration templates.',`
<ul class="pts">
<li>Orchestrations are built in <b>Orchestration Builder</b> and integrate data and process flows: call Workday REST/SOAP APIs, your app's APIs, transform data, loop, branch.</li>
<li><b>Synchronous (API) orchestrations</b>: called like an API (e.g. from a PMD endpoint), run immediately, and return a response to the caller. Use for request/response work the page waits on &mdash; keep them fast.</li>
<li><b>Asynchronous orchestrations</b> (including business-process-launched and scheduled): run in the background, no caller waiting. Use for long-running, bulk, or event-driven work &mdash; e.g. a BP step that launches an orchestration after approval, or scheduled batch processing.</li>
<li><b>Launch parameters</b> pass values in (from a BP step configuration or the calling request). Looping patterns: process a collection with batch-style loops vs joining parallel work &mdash; know that big batch work belongs in async orchestrations.</li>
<li>SOAP-only operations (e.g. <code>Import_Change_Home_Contact_Information</code>) are executed from orchestrations, not from PMD endpoints.</li>
</ul>
<div class="tip"><b>Exam tip:</b> page needs an immediate answer &rarr; synchronous. Launched by a business process / long-running / no one waiting &rarr; asynchronous.</div>`);

S('DL','The Extend App Lifecycle','Exam guide: promotion levels, promotion deadlines, and maintenance windows.',`
<ul class="pts">
<li>Develop in <b>App Builder</b> (cloud IDE) &rarr; deploy to a development environment/tenant to test &rarr; <b>promote</b> the app through environments (development &rarr; sandbox/test &rarr; production) via the Developer Site / console tooling.</li>
<li><b>Promotion levels</b> gate where an app can run; production promotion is a controlled step with review of the app's APIs/scopes.</li>
<li><b>Promotion deadlines and maintenance windows</b> follow the Workday release calendar &mdash; promotions are restricted around weekly service updates and the twice-yearly feature releases, so plan promotions outside blackout/maintenance windows.</li>
<li>The <b>Developer Site Console</b> manages app-level administration: attributes/configuration values per tenant, promotion, monitoring. The <b>Extend App Manager</b> (in the tenant) manages installed apps, their tasks and security domains.</li>
<li><b>Attributes</b> are application-level, tenant-specific variables (set per environment in the console) that your app reads at runtime &mdash; use them for environment-specific configuration, not for BP-to-orchestration value passing.</li>
</ul>`);

S('DL','Choosing Data Sources &amp; Securing Access','Exam guide: select the appropriate data source for a use case and explain how that data is secured.',`
<ul class="pts">
<li>Match the tool to the job: app BO API for your data; Workday REST for delivered data; WQL for cross-source, field-selective reads; RaaS for existing report logic; SOAP via orchestration for WWS-only operations.</li>
<li>Every read is security-checked in the requesting user's context: app data sources enforce the MCBO's security domain policy; delivered data sources enforce their delivered domain policies; traversals require access on both.</li>
<li>Custom reports over app data sources expose SINGLE_INSTANCE-related fields; secure the report like any report, and remember web-service-enablement is only needed to call the report as RaaS &mdash; not to see related fields.</li>
</ul>`);

S('DL','Logs &amp; Troubleshooting','Exam guide: use logging for testing and troubleshooting; view and filter logs.',`
<ul class="pts">
<li>App logs are viewed from the developer tooling (console log viewer) &mdash; filter by app, environment, time range, severity, and log fields.</li>
<li><b><code>wd_common_request_id</code></b> is the correlation id that ties together every log line for one transaction. Page errors show an id (e.g. <code>Internal Server Error (id: VPS|5a43a81...)</code>) &mdash; filter logs on <code>wd_common_request_id</code> with that value to see everything related to the failure.</li>
<li>Other fields you may see: <code>wd_api_client_id</code> (which client called), <code>wd_response_time</code> (latency), <code>wd_request_bytes</code> (payload size) &mdash; useful for performance triage, not for tracing a specific error.</li>
<li>Add your own diagnostics: script logging/console output during development, plus endpoint <code>onFail</code> handlers to capture failures with context.</li>
</ul>
<div class="tip"><b>Exam tip (practice exam):</b> "see all logs for this error id" &rarr; filter on <code>wd_common_request_id</code>.</div>`);
})();

</script>
