cpp:`#include <iostream>
#include <stdexcept>

// A minimal std::vector<int> clone showing the growth mechanics.
class DynArray {
    int* data;
    int  sz  = 0;    // elements in use
    int  cap = 2;    // allocated slots
    void grow() {                       // O(n), but rare
        cap *= 2;
        int* bigger = new int[cap];
        for (int i = 0; i < sz; ++i) bigger[i] = data[i];
        delete[] data;
        data = bigger;
    }
public:
    DynArray() : data(new int[cap]) {}
    ~DynArray() { delete[] data; }

    int  size() const { return sz; }
    int& operator[](int i) { return data[i]; }   // O(1) access

    void push_back(int v) {             // amortized O(1)
        if (sz == cap) grow();
        data[sz++] = v;
    }
    void insertAt(int i, int v) {       // O(n): shift right
        if (i < 0 || i > sz) throw std::out_of_range("bad index");
        if (sz == cap) grow();
        for (int j = sz; j > i; --j) data[j] = data[j-1];
        data[i] = v; ++sz;
    }
    void removeAt(int i) {              // O(n): shift left
        for (int j = i; j < sz-1; ++j) data[j] = data[j+1];
        --sz;
    }
};

int main() {
    DynArray a;
    for (int v : {7, 12, 31, 54}) a.push_back(v);
    a.insertAt(2, 99);                  // 7 12 99 31 54
    a.removeAt(0);                      // 12 99 31 54
    for (int i = 0; i < a.size(); ++i) std::cout << a[i] << ' ';
}`,
py:`# Python's list IS a dynamic array (of object pointers).
# Below: the same mechanics made explicit.

class DynArray:
    def __init__(self):
        self._cap = 2
        self._n = 0
        self._data = [None] * self._cap

    def __len__(self):            return self._n
    def __getitem__(self, i):     return self._data[i]   # O(1)

    def _grow(self):                       # O(n), but rare
        self._cap *= 2
        bigger = [None] * self._cap
        for i in range(self._n):
            bigger[i] = self._data[i]
        self._data = bigger

    def append(self, v):                   # amortized O(1)
        if self._n == self._cap:
            self._grow()
        self._data[self._n] = v
        self._n += 1

    def insert_at(self, i, v):             # O(n): shift right
        if self._n == self._cap:
            self._grow()
        for j in range(self._n, i, -1):
            self._data[j] = self._data[j - 1]
        self._data[i] = v
        self._n += 1

    def remove_at(self, i):                # O(n): shift left
        for j in range(i, self._n - 1):
            self._data[j] = self._data[j + 1]
        self._n -= 1

// contiguous storage for dense numeric arrays).
// Below: the growth mechanics made explicit.

class DynArray {
  constructor() {
    this.cap = 2;
    this.n = 0;
    this.data = new Array(this.cap);
  }
  get size() { return this.n; }
  get(i) { return this.data[i]; }          // O(1)

  grow() {                                  // O(n), but rare
    this.cap *= 2;
    const bigger = new Array(this.cap);
    for (let i = 0; i < this.n; i++) bigger[i] = this.data[i];
    this.data = bigger;
  }
  push(v) {                                 // amortized O(1)
    if (this.n === this.cap) this.grow();
    this.data[this.n++] = v;
  }
  insertAt(i, v) {                          // O(n): shift right
    if (this.n === this.cap) this.grow();
    for (let j = this.n; j > i; j--) this.data[j] = this.data[j-1];
    this.data[i] = v;
    this.n++;
  }
  removeAt(i) {                             // O(n): shift left
    for (let j = i; j < this.n - 1; j++) this.data[j] = this.data[j+1];
    this.n--;
  }
}

using namespace std;

void rotate(vector<int>& a, int k) {
    int n = a.size();
    if (n == 0) return;
    k %= n;

struct Node {
    int val;
    Node* next;
    Node(int v) : val(v), next(nullptr) {}
};

class LinkedList {
    Node* head = nullptr;
public:
    void pushFront(int v) {                 // O(1)
        Node* n = new Node(v);
        n->next = head;
        head = n;
    }
    void insertAfter(Node* cur, int v) {    // O(1)
        Node* n = new Node(v);
        n->next = cur->next;                // wire new node FIRST
        cur->next = n;
    }
    bool remove(int v) {                    // O(n) to find
        Node dummy(0); dummy.next = head;   // dummy kills edge cases
        for (Node* p = &dummy; p->next; p = p->next)
            if (p->next->val == v) {
                Node* dead = p->next;
                p->next = dead->next;
                delete dead;
                head = dummy.next;
                return true;
            }
        return false;
    }
    void reverse() {                        // the classic — O(n)
        Node *prev = nullptr, *cur = head;
        while (cur) {
            Node* nxt = cur->next;
            cur->next = prev;               // flip the arrow
            prev = cur;
            cur = nxt;
        }
        head = prev;
    }
    void print() {
        for (Node* p = head; p; p = p->next) std::cout << p->val << " -> ";
        std::cout << "null\\n";
    }
};

int main() {

    L.pushFront(31); L.pushFront(12); L.pushFront(7);   // 7 12 31

cpp:`#include <iostream>
#include <vector>
#include <stdexcept>

class CircularQueue {
    std::vector<int> a;
    int front_ = 0, count_ = 0;
    int rear() const { return (front_ + count_) % (int)a.size(); }
public:
    explicit CircularQueue(int cap) : a(cap) {}

    bool empty() const { return count_ == 0; }
    bool full()  const { return count_ == (int)a.size(); }
    int  size()  const { return count_; }

    void enqueue(int v) {                     // O(1)
        if (full()) throw std::runtime_error("queue full");
        a[rear()] = v;                        // write at rear...
        ++count_;                             // ...then advance it
    }
    int dequeue() {                           // O(1) — nothing shifts
        if (empty()) throw std::runtime_error("queue empty");
        int v = a[front_];
        front_ = (front_ + 1) % (int)a.size();  // wrap with modulo
        --count_;
        return v;
    }
    int peek() const { return a[front_]; }
};

int main() {
    CircularQueue q(4);
    q.enqueue(7); q.enqueue(12); q.enqueue(31);
    std::cout << q.dequeue() << "\\n";  // 7  (first in, first out)
    q.enqueue(54); q.enqueue(99);      // rear wraps to index 0
    while (!q.empty()) std::cout << q.dequeue() << ' ';  // 12 31 54 99
}

    def __len__(self): return self._n
    def empty(self):   return self._n == 0
    def full(self):    return self._n == len(self._a)

    def enqueue(self, v):                    # O(1)
        if self.full(): raise OverflowError("queue full")
        rear = (self._front + self._n) % len(self._a)
        self._a[rear] = v                    # write at rear...
        self._n += 1                         # ...then advance it

    def dequeue(self):                       # O(1) — nothing shifts
        if self.empty(): raise IndexError("queue empty")
        v = self._a[self._front]
        self._front = (self._front + 1) % len(self._a)  # wrap
        self._n -= 1
        return v

    def peek(self): return self._a[self._front]

for v in (7, 12, 31): q.enqueue(v)
print(q.dequeue())        # 7 (first in, first out)
q.enqueue(54); q.enqueue(99)   # rear wraps to index 0
while not q.empty(): print(q.dequeue(), end=" ")  # 12 31 54 99

#   deque.append / deque.popleft are both O(1)`,
js:`class CircularQueue {
  constructor(cap) {
    this.a = new Array(cap);
    this.front = 0;
    this.n = 0;
  }
  get size() { return this.n; }
  empty()    { return this.n === 0; }
  full()     { return this.n === this.a.length; }

  enqueue(v) {                              // O(1)
    if (this.full()) throw new Error("queue full");
    const rear = (this.front + this.n) % this.a.length;
    this.a[rear] = v;                       // write at rear...
    this.n++;                               // ...then advance it
  }
  dequeue() {                               // O(1) — nothing shifts
    if (this.empty()) throw new Error("queue empty");
    const v = this.a[this.front];
    this.front = (this.front + 1) % this.a.length;   // wrap
    this.n--;
    return v;
  }
  peek() { return this.a[this.front]; }
}

[7, 12, 31].forEach(v => q.enqueue(v));
console.log(q.dequeue());     // 7 (first in, first out)
q.enqueue(54); q.enqueue(99); // rear wraps to index 0
// NOTE: plain array.shift() is O(n) — avoid it in hot loops.`

vector<int> maxSlidingWindow(vector<int>& nums, int k) {

def max_sliding_window(nums, k):
    dq, out = deque(), []        # dq holds indices, values decreasing
    for i, v in enumerate(nums):
        if dq and dq[0] <= i - k:
            dq.popleft()                      # left of window
        while dq and nums[dq[-1]] <= v:

using namespace std;

// Separate-chaining hash map: string -> int
class HashMap {
    vector<list<pair<string,int>>> buckets;
    int n = 0;

    size_t idx(const string& key) const {
        size_t h = 0;
        for (char c : key) h = h * 31 + (unsigned char)c;  // poly hash
        return h % buckets.size();
    }
    void rehash() {                       // double + reinsert
        vector<list<pair<string,int>>> old = move(buckets);
        buckets.assign(old.size() * 2, {});
        n = 0;
        for (auto& chain : old)
            for (auto& kv : chain) put(kv.first, kv.second);
    }
public:
    HashMap() : buckets(8) {}

    void put(const string& k, int v) {            // avg O(1)
        for (auto& kv : buckets[idx(k)])
            if (kv.first == k) { kv.second = v; return; }   // update
        buckets[idx(k)].push_back({k, v});                  // insert
        if (++n > (int)(buckets.size() * 0.75)) rehash();
    }
    int* get(const string& k) {                   // avg O(1)
        for (auto& kv : buckets[idx(k)])
            if (kv.first == k) return &kv.second;
        return nullptr;
    }
    bool erase(const string& k) {                 // avg O(1)
        auto& chain = buckets[idx(k)];
        for (auto it = chain.begin(); it != chain.end(); ++it)
            if (it->first == k) { chain.erase(it); --n; return true; }
        return false;
    }
};

int main() {
    HashMap m;
    m.put("ada", 5); m.put("tim", 3); m.put("ada", 6);  // update
    if (int* p = m.get("ada")) cout << *p << "\\n";      // 6
    m.erase("tim");
    cout << (m.get("tim") ? "found" : "gone") << "\\n";  // gone
}`,
py:`# Python's dict is a highly tuned open-addressing hash table.
# Below: separate chaining made explicit.

class HashMap:
    def __init__(self):
        self._buckets = [[] for _ in range(8)]
        self._n = 0

    def _idx(self, key):
        return hash(key) % len(self._buckets)

    def _rehash(self):                    # double + reinsert
        old = self._buckets
        self._buckets = [[] for _ in range(len(old) * 2)]
        self._n = 0
        for chain in old:
            for k, v in chain:
                self.put(k, v)

    def put(self, k, v):                  # avg O(1)
        chain = self._buckets[self._idx(k)]
        for i, (ck, _) in enumerate(chain):
            if ck == k:
                chain[i] = (k, v)         # update in place
                return
        chain.append((k, v))              # insert
        self._n += 1
        if self._n > 0.75 * len(self._buckets):
            self._rehash()

    def get(self, k, default=None):       # avg O(1)
        for ck, cv in self._buckets[self._idx(k)]:
            if ck == k:
                return cv
        return default

    def delete(self, k):                  # avg O(1)
        chain = self._buckets[self._idx(k)]
        for i, (ck, _) in enumerate(chain):
            if ck == k:
                chain.pop(i)
                self._n -= 1
                return True
        return False

m = HashMap()
m.put("ada", 5); m.put("tim", 3); m.put("ada", 6)   # update
print(m.get("ada"))      # 6
m.delete("tim")
print(m.get("tim", "gone"))   # gone`,
js:`// JS gives you Map (any key type) and plain objects.
// Below: separate chaining made explicit.

class HashMap {
  constructor() {
    this.buckets = Array.from({ length: 8 }, () => []);
    this.n = 0;
  }
  _hash(key) {                    // polynomial string hash
    let h = 0;
    for (let i = 0; i < key.length; i++)
      h = (h * 31 + key.charCodeAt(i)) >>> 0;   // keep unsigned
    return h % this.buckets.length;
  }
  _rehash() {                     // double + reinsert
    const old = this.buckets;
    this.buckets = Array.from({ length: old.length * 2 }, () => []);
    this.n = 0;
    for (const chain of old)
      for (const [k, v] of chain) this.put(k, v);
  }
  put(k, v) {                     // avg O(1)
    const chain = this.buckets[this._hash(k)];
    for (const kv of chain)
      if (kv[0] === k) { kv[1] = v; return; }   // update
    chain.push([k, v]);                         // insert
    if (++this.n > 0.75 * this.buckets.length) this._rehash();
  }
  get(k) {                        // avg O(1)
    for (const [ck, cv] of this.buckets[this._hash(k)])
      if (ck === k) return cv;
    return undefined;
  }
  delete(k) {                     // avg O(1)
    const chain = this.buckets[this._hash(k)];
    const i = chain.findIndex(kv => kv[0] === k);
    if (i === -1) return false;
    chain.splice(i, 1);
    this.n--;
    return true;
  }
}

const m = new HashMap();
m.put("ada", 5); m.put("tim", 3); m.put("ada", 6);  // update
console.log(m.get("ada"));                  // 6
m.delete("tim");
console.log(m.get("tim") ?? "gone");        // gone`

    for (int i = 0; i < (int)nums.size(); ++i) {

struct Node {
    int val;
    Node *left = nullptr, *right = nullptr;
    Node(int v) : val(v) {}
};

Node* insert(Node* root, int v) {            // O(h)
    if (!root) return new Node(v);           // fell off — attach here
    if (v < root->val)      root->left  = insert(root->left, v);
    else if (v > root->val) root->right = insert(root->right, v);
    return root;                             // duplicates ignored
}

bool search(Node* root, int v) {             // O(h)
    while (root) {
        if (v == root->val) return true;
        root = (v < root->val) ? root->left : root->right;
    }
    return false;
}

Node* minNode(Node* n) { while (n->left) n = n->left; return n; }

Node* erase(Node* root, int v) {             // O(h)
    if (!root) return nullptr;
    if (v < root->val)      root->left  = erase(root->left, v);
    else if (v > root->val) root->right = erase(root->right, v);
    else {                                   // found the node
        if (!root->left)  { Node* r = root->right; delete root; return r; }
        if (!root->right) { Node* l = root->left;  delete root; return l; }
        Node* s = minNode(root->right);      // inorder successor
        root->val = s->val;
        root->right = erase(root->right, s->val);
    }
    return root;
}

void inorder(Node* n) {                      // sorted output
    if (!n) return;
    inorder(n->left);
    std::cout << n->val << ' ';
    inorder(n->right);
}

    for (int v : {50, 27, 74, 11, 31, 61, 89}) root = insert(root, v);

overview:'<p>A <b>binary heap</b> is a complete binary tree with the <b>heap property</b>: in a <b>min-heap</b>, every parent ≤ its children (max-heap: ≥). Because the tree is complete, it lives flat in an array — node i has children at <code class="k">2i+1</code> and <code class="k">2i+2</code>, parent at <code class="k">(i−1)/2</code>. No pointers at all. The min (or max) is always at index 0: peek is O(1), push and pop are O(log n) via <b>sift-up</b> / <b>sift-down</b>. This is the engine of priority queues, Dijkstra, heapsort, top-K, and every job scheduler.</p>',

cpp:`#include <iostream>
#include <vector>
using namespace std;

class MinHeap {
    vector<int> a;
    void siftUp(int i) {
        while (i > 0) {
            int p = (i - 1) / 2;
            if (a[i] >= a[p]) break;
            swap(a[i], a[p]);
            i = p;                       // keep bubbling
        }
    }
    void siftDown(int i) {
        int n = a.size();
        while (true) {
            int l = 2*i + 1, r = 2*i + 2, s = i;
            if (l < n && a[l] < a[s]) s = l;
            if (r < n && a[r] < a[s]) s = r;   // smaller child
            if (s == i) break;
            swap(a[i], a[s]);
            i = s;
        }
    }
public:
    bool empty() const { return a.empty(); }
    int  peek()  const { return a[0]; }         // O(1)

    void push(int v) {                          // O(log n)
        a.push_back(v);                         // keep completeness
        siftUp(a.size() - 1);
    }
    int pop() {                                 // O(log n)
        int top = a[0];
        a[0] = a.back();                        // last -> root
        a.pop_back();
        if (!a.empty()) siftDown(0);
        return top;
    }
};

int main() {
    MinHeap h;
    for (int v : {9, 3, 14, 5, 11, 8}) h.push(v);
    while (!h.empty()) cout << h.pop() << ' ';  // 3 5 8 9 11 14
}

# Below: the mechanics made explicit.

class MinHeap:
    def __init__(self):
        self.a = []

    def peek(self):                    # O(1)
        return self.a[0]

    def push(self, v):                 # O(log n)
        self.a.append(v)               # keep completeness
        i = len(self.a) - 1
        while i > 0:                   # sift up
            p = (i - 1) // 2
            if self.a[i] >= self.a[p]:
                break
            self.a[i], self.a[p] = self.a[p], self.a[i]
            i = p

    def pop(self):                     # O(log n)
        a = self.a
        top = a[0]
        a[0] = a[-1]                   # last -> root
        a.pop()
        i, n = 0, len(a)
        while True:                    # sift down
            l, r, s = 2*i + 1, 2*i + 2, i
            if l < n and a[l] < a[s]: s = l
            if r < n and a[r] < a[s]: s = r      # smaller child
            if s == i:
                break
            a[i], a[s] = a[s], a[i]
            i = s
        return top

js:`// JS has no built-in heap — interviews often ask you to write one.

class MinHeap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  peek() { return this.a[0]; }               // O(1)

  push(v) {                                  // O(log n)
    const a = this.a;
    a.push(v);                               // keep completeness
    let i = a.length - 1;
    while (i > 0) {                          // sift up
      const p = (i - 1) >> 1;
      if (a[i] >= a[p]) break;
      [a[i], a[p]] = [a[p], a[i]];
      i = p;
    }
  }
  pop() {                                    // O(log n)
    const a = this.a;
    const top = a[0];
    a[0] = a[a.length - 1];                  // last -> root
    a.pop();
    let i = 0;
    while (true) {                           // sift down
      const l = 2*i + 1, r = 2*i + 2;
      let s = i;
      if (l < a.length && a[l] < a[s]) s = l;
      if (r < a.length && a[r] < a[s]) s = r;   // smaller child
      if (s === i) break;
      [a[i], a[s]] = [a[s], a[i]];
      i = s;
    }
    return top;
  }
}

#include <vector>
#include <functional>
using namespace std;

int findKthLargest(vector<int>& nums, int k) {
    priority_queue<int, vector<int>, greater<int>> h;  // MIN-heap
    for (int v : nums) {
        h.push(v);
        if ((int)h.size() > k) h.pop();   // evict the smallest
    }
    return h.top();      // root of a size-k min-heap = kth largest

def find_kth_largest(nums, k):
    h = []                          # MIN-heap of size <= k
    for v in nums:
        heapq.heappush(h, v)
        if len(h) > k:
            heapq.heappop(h)        # evict the smallest
    return h[0]     # root of a size-k min-heap = kth largest

  for (const v of nums) {

    if (h.size > k) h.pop();        // evict the smallest

cpp:`#include <vector>
#include <queue>
using namespace std;

bool canFinish(int n, vector<vector<int>>& prereq) {
    vector<vector<int>> adj(n);
    vector<int> indeg(n, 0);
    for (auto& p : prereq) {          // p[1] -> p[0]
        adj[p[1]].push_back(p[0]);
        indeg[p[0]]++;
    }
    queue<int> q;
    for (int i = 0; i < n; ++i)
        if (indeg[i] == 0) q.push(i);   // no prerequisites
    int done = 0;
    while (!q.empty()) {
        int u = q.front(); q.pop();
        ++done;
        for (int v : adj[u])
            if (--indeg[v] == 0) q.push(v);
    }
    return done == n;   // fewer => a cycle held courses hostage
}   // O(V + E)`,
py:`from collections import deque

def can_finish(n, prereq):
    adj = [[] for _ in range(n)]
    indeg = [0] * n
    for course, pre in prereq:        # pre -> course
        adj[pre].append(course)
        indeg[course] += 1

    q = deque(i for i in range(n) if indeg[i] == 0)
    done = 0
    while q:
        u = q.popleft()
        done += 1
        for v in adj[u]:
            indeg[v] -= 1
            if indeg[v] == 0:
                q.append(v)
    return done == n   # fewer => a cycle held courses hostage
# O(V + E)

code:{
cpp:`#include <iostream>
#include <string>
using namespace std;

struct TrieNode {
    TrieNode* child[26] = {};
    bool isEnd = false;
};

class Trie {
    TrieNode* root = new TrieNode();
public:
    void insert(const string& w) {           // O(L)
        TrieNode* cur = root;
        for (char c : w) {
            int i = c - 'a';
            if (!cur->child[i]) cur->child[i] = new TrieNode();
            cur = cur->child[i];
        }
        cur->isEnd = true;                   // mark the word ending
    }
    TrieNode* walk(const string& s) {        // shared path-follower
        TrieNode* cur = root;
        for (char c : s) {
            cur = cur->child[c - 'a'];
            if (!cur) return nullptr;        // path breaks — absent
        }
        return cur;
    }
    bool search(const string& w) {           // O(L)
        TrieNode* n = walk(w);
        return n && n->isEnd;                // must be a real ending
    }
    bool startsWith(const string& p) {       // O(L)
        return walk(p) != nullptr;           // reaching it is enough
    }
};

int main() {
    Trie t;
    for (auto w : {"car", "cart", "care", "dog"}) t.insert(w);
    cout << t.search("car")      << "\\n";   // 1
    cout << t.search("ca")       << "\\n";   // 0 — prefix, not word
    cout << t.startsWith("ca")   << "\\n";   // 1
}`,
py:`class TrieNode:
    __slots__ = ("child", "is_end")
    def __init__(self):
        self.child = {}          # char -> TrieNode
        self.is_end = False

class Trie:
    def __init__(self):
        self.root = TrieNode()

    def insert(self, w):                 # O(L)
        cur = self.root
        for c in w:
            if c not in cur.child:
                cur.child[c] = TrieNode()
            cur = cur.child[c]
        cur.is_end = True                # mark the word ending

    def _walk(self, s):                  # shared path-follower
        cur = self.root
        for c in s:
            cur = cur.child.get(c)
            if cur is None:
                return None              # path breaks — absent
        return cur

    def search(self, w):                 # O(L)
        n = self._walk(w)
        return n is not None and n.is_end    # must be a real ending

    def starts_with(self, p):            # O(L)
        return self._walk(p) is not None     # reaching it is enough

t = Trie()
for w in ("car", "cart", "care", "dog"):
    t.insert(w)
print(t.search("car"))        # True
print(t.search("ca"))         # False — prefix, not a word
print(t.starts_with("ca"))    # True`,

    for (const c of w) {
      if (!cur.child.has(c)) cur.child.set(c, new TrieNode());
      cur = cur.child.get(c);
    }
    cur.isEnd = true;                    // mark the word ending
  }
  _walk(s) {                             // shared path-follower
    let cur = this.root;
    for (const c of s) {
      cur = cur.child.get(c);
      if (!cur) return null;             // path breaks — absent
    }
    return cur;
  }
  search(w) {                            // O(L)
    const n = this._walk(w);
    return n !== null && n.isEnd;        // must be a real ending
  }
  startsWith(p) {                        // O(L)
    return this._walk(p) !== null;       // reaching it is enough
  }
}

 prompt:'Design a structure where addWord("bad"), addWord("dad"), then search("b..") → true and search(".ad") → true. The dot matches ANY single character — exact trie walking is not enough.',

cpp:`// Uses TrieNode { child[26], isEnd } from the implementation tab.
class WordDictionary {
    TrieNode* root = new TrieNode();

    bool dfs(const string& w, int i, TrieNode* n) {
        if (!n) return false;
        if (i == (int)w.size()) return n->isEnd;
        char c = w[i];
        if (c != '.')
            return dfs(w, i + 1, n->child[c - 'a']);
        for (int k = 0; k < 26; ++k)            // '.' — try them all
            if (dfs(w, i + 1, n->child[k])) return true;
        return false;
    }
public:
    void addWord(const string& w) {             // plain trie insert
        TrieNode* cur = root;
        for (char c : w) {
            int i = c - 'a';
            if (!cur->child[i]) cur->child[i] = new TrieNode();
            cur = cur->child[i];
        }
        cur->isEnd = true;
    }
    bool search(const string& w) { return dfs(w, 0, root); }
};`,
py:`class WordDictionary:
    def __init__(self):
        self.root = TrieNode()       # from the implementation tab

    def add_word(self, w):           # plain trie insert
        cur = self.root
        for c in w:
            cur = cur.child.setdefault(c, TrieNode())
        cur.is_end = True

    def search(self, w):
        def dfs(i, node):
            if i == len(w):
                return node.is_end
            c = w[i]
            if c != ".":
                nxt = node.child.get(c)
                return nxt is not None and dfs(i + 1, nxt)
            # '.' — try every child
            return any(dfs(i + 1, nxt) for nxt in node.child.values())
        return dfs(0, self.root)

  search(w) {
    const dfs = (i, node) => {
      if (i === w.length) return node.isEnd;
      const c = w[i];
      if (c !== ".") {
        const nxt = node.child.get(c);
        return !!nxt && dfs(i + 1, nxt);
      }
      for (const nxt of node.child.values())   // '.' — try them all
        if (dfs(i + 1, nxt)) return true;
      return false;
    };
    return dfs(0, this.root);
  }
}

id:'avl', name:'AVL Trees (Self-Balancing BST)', tier:'advanced', tagline:'A BST that refuses to lean — rotations keep every operation at a guaranteed O(log n).',
overview:'<p>An <b>AVL tree</b> is a BST that maintains a strict balance invariant: for every node, the heights of the left and right subtrees differ by at most 1 (the <b>balance factor</b> is −1, 0, or +1). After every insert or delete, the tree walks back up the insertion path; the first node whose balance factor hits ±2 gets fixed with one of <b>four rotations</b> (LL, RR, LR, RL). Result: height ≤ 1.44·log n, so search/insert/delete are guaranteed O(log n) — even for sorted input that would destroy a plain BST.</p>',
steps:[
 {t:'Store height in every node', d:'height(leaf) = 1. balance(n) = height(left) − height(right). Recompute on the way back up after every structural change.'},
 {t:'Insert like a BST', d:'Normal BST insert down one path — then the interesting part happens while the recursion unwinds.'},
 {t:'Detect imbalance', d:'On the way up, if some node has balance +2 (left-heavy) or −2 (right-heavy), it is the pivot to fix.'},
 {t:'LL case → right-rotate', d:'Left child of left subtree caused it (balance +2, new key < left child): a single right rotation restores balance.'},
 {t:'RR case → left-rotate', d:'Mirror image: single left rotation.'},
 {t:'LR / RL → double rotation', d:'Zig-zag insertions need two rotations: first rotate the child to straighten the path (turning LR into LL), then rotate the pivot.'}
],

cpp:`#include <iostream>
#include <algorithm>
using namespace std;

struct Node {
    int val, height = 1;
    Node *left = nullptr, *right = nullptr;
    Node(int v) : val(v) {}
};

int h(Node* n)   { return n ? n->height : 0; }
int bal(Node* n) { return n ? h(n->left) - h(n->right) : 0; }
void up(Node* n) { n->height = 1 + max(h(n->left), h(n->right)); }

Node* rotRight(Node* y) {       //     y            x
    Node* x = y->left;          //    / \\          / \\
    Node* T = x->right;         //   x   c   =>   a   y
    x->right = y;               //  / \\              / \\
    y->left  = T;               // a   T            T   c
    up(y); up(x);
    return x;                   // x is the new subtree root
}
Node* rotLeft(Node* x) {        // mirror image
    Node* y = x->right;
    Node* T = y->left;
    y->left  = x;
    x->right = T;
    up(x); up(y);
    return y;
}

Node* insert(Node* n, int v) {
    if (!n) return new Node(v);
    if (v < n->val)      n->left  = insert(n->left, v);
    else if (v > n->val) n->right = insert(n->right, v);
    else return n;
    up(n);
    int b = bal(n);
    if (b >  1 && v < n->left->val)  return rotRight(n);        // LL
    if (b < -1 && v > n->right->val) return rotLeft(n);         // RR
    if (b >  1 && v > n->left->val)  {                          // LR
        n->left = rotLeft(n->left);
        return rotRight(n);
    }
    if (b < -1 && v < n->right->val) {                          // RL
        n->right = rotRight(n->right);
        return rotLeft(n);
    }
    return n;
}

void inorder(Node* n) {
    if (!n) return;
    inorder(n->left); cout << n->val << ' '; inorder(n->right);
}

int main() {
    Node* root = nullptr;
    for (int v : {10, 20, 30, 40, 50, 25})   // sorted-ish: BST killer
        root = insert(root, v);
    inorder(root);                    // 10 20 25 30 40 50
    cout << "\\nheight=" << h(root);  // 3, not 6
}`,
py:`class Node:
    def __init__(self, val):
        self.val = val
        self.left = self.right = None
        self.height = 1

def h(n):   return n.height if n else 0
def bal(n): return h(n.left) - h(n.right) if n else 0
def up(n):  n.height = 1 + max(h(n.left), h(n.right))

def rot_right(y):            #     y            x
    x = y.left               #    / \\          / \\
    T = x.right              #   x   c   =>   a   y
    x.right = y              #  / \\              / \\
    y.left = T               # a   T            T   c
    up(y); up(x)
    return x                 # x is the new subtree root

def rot_left(x):             # mirror image
    y = x.right
    T = y.left
    y.left = x
    x.right = T
    up(x); up(y)
    return y

def insert(n, v):
    if n is None:
        return Node(v)
    if v < n.val:
        n.left = insert(n.left, v)
    elif v > n.val:
        n.right = insert(n.right, v)
    else:
        return n
    up(n)
    b = bal(n)
    if b > 1 and v < n.left.val:      # LL
        return rot_right(n)
    if b < -1 and v > n.right.val:    # RR
        return rot_left(n)
    if b > 1 and v > n.left.val:      # LR
        n.left = rot_left(n.left)
        return rot_right(n)
    if b < -1 and v < n.right.val:    # RL
        n.right = rot_right(n.right)
        return rot_left(n)
    return n

def inorder(n, out):
    if n:
        inorder(n.left, out); out.append(n.val); inorder(n.right, out)

root = None
for v in (10, 20, 30, 40, 50, 25):   # sorted-ish: BST killer
    root = insert(root, v)
out = []; inorder(root, out)
print(out)          # [10, 20, 25, 30, 40, 50]
print(h(root))      # 3, not 6`,
js:`class Node {
  constructor(val) {
    this.val = val;
    this.left = this.right = null;
    this.height = 1;
  }
}
const h   = n => n ? n.height : 0;
const bal = n => n ? h(n.left) - h(n.right) : 0;
const up  = n => { n.height = 1 + Math.max(h(n.left), h(n.right)); };

function rotRight(y) {        //     y            x
  const x = y.left;           //    / \\          / \\
  const T = x.right;          //   x   c   =>   a   y
  x.right = y;                //  / \\              / \\
  y.left = T;                 // a   T            T   c
  up(y); up(x);
  return x;                   // x is the new subtree root
}
function rotLeft(x) {         // mirror image
  const y = x.right;
  const T = y.left;
  y.left = x;
  x.right = T;
  up(x); up(y);
  return y;
}

function insert(n, v) {
  if (!n) return new Node(v);
  if (v < n.val)      n.left  = insert(n.left, v);
  else if (v > n.val) n.right = insert(n.right, v);
  else return n;
  up(n);
  const b = bal(n);
  if (b >  1 && v < n.left.val)  return rotRight(n);       // LL
  if (b < -1 && v > n.right.val) return rotLeft(n);        // RR
  if (b >  1 && v > n.left.val)  {                         // LR
    n.left = rotLeft(n.left);
    return rotRight(n);
  }
  if (b < -1 && v < n.right.val) {                         // RL
    n.right = rotRight(n.right);
    return rotLeft(n);
  }
  return n;
}

let root = null;
[10, 20, 30, 40, 50, 25].forEach(v => root = insert(root, v));
const out = [];
(function inorder(n) {
  if (n) { inorder(n.left); out.push(n.val); inorder(n.right); }
})(root);
console.log(out);        // [10, 20, 25, 30, 40, 50]
console.log(h(root));    // 3, not 6`

challenge:{
 title:'Challenge · Is this binary tree height-balanced?',
 prompt:'Return true if, at every node, the two subtree heights differ by at most 1 (the AVL condition). Naive height-per-node is O(n²); do it in one O(n) pass.',
 hint:'Post-order: compute each subtree\u2019s height bottom-up, and propagate a sentinel (−1) upward the instant any node is unbalanced — parents can then short-circuit.',
 solutions:{
cpp:`int check(Node* n) {              // returns height, or -1 = broken
    if (!n) return 0;
    int L = check(n->left);
    if (L == -1) return -1;       // short-circuit up the tree
    int R = check(n->right);
    if (R == -1) return -1;
    if (abs(L - R) > 1) return -1;
    return 1 + max(L, R);
}
bool isBalanced(Node* root) { return check(root) != -1; }
// O(n) time, O(h) stack`,
py:`def is_balanced(root):
    def check(n):                 # returns height, or -1 = broken
        if n is None:
            return 0
        L = check(n.left)
        if L == -1: return -1     # short-circuit up the tree
        R = check(n.right)
        if R == -1: return -1
        if abs(L - R) > 1: return -1
        return 1 + max(L, R)
    return check(root) != -1
# O(n) time, O(h) stack`,
js:`function isBalanced(root) {
  function check(n) {             // returns height, or -1 = broken
    if (!n) return 0;
    const L = check(n.left);
    if (L === -1) return -1;      // short-circuit up the tree
    const R = check(n.right);
    if (R === -1) return -1;
    if (Math.abs(L - R) > 1) return -1;
    return 1 + Math.max(L, R);
  }
  return check(root) !== -1;
}  // O(n) time, O(h) stack`}
}

id:'segtree', name:'Segment Trees', tier:'advanced', tagline:'Answer any range query — sum, min, max — in O(log n), while the underlying array keeps changing.',
overview:'<p>A <b>segment tree</b> covers an array with a binary tree of intervals: the root covers [0, n−1], each node splits its range in half, and leaves are single elements. Every node caches an aggregate (sum, min, max, gcd…) of its range. A <b>range query</b> stitches its answer from O(log n) disjoint nodes; a <b>point update</b> refreshes one leaf-to-root path. That is O(log n) for both — where a plain array gives O(n) queries and a prefix-sum array gives O(n) updates. Add <b>lazy propagation</b> and even range <i>updates</i> become O(log n).</p>',
steps:[

cpp:`#include <iostream>
#include <vector>
using namespace std;

class SegTree {                       // range-sum, point-update
    int n;
    vector<long long> t;
    void build(const vector<int>& a, int node, int lo, int hi) {
        if (lo == hi) { t[node] = a[lo]; return; }
        int mid = (lo + hi) / 2;
        build(a, 2*node,   lo,     mid);
        build(a, 2*node+1, mid+1,  hi);
        t[node] = t[2*node] + t[2*node+1];        // combine
    }
    long long query(int node, int lo, int hi, int l, int r) {
        if (r < lo || hi < l) return 0;           // no overlap
        if (l <= lo && hi <= r) return t[node];   // total overlap
        int mid = (lo + hi) / 2;                  // partial: recurse
        return query(2*node,   lo,    mid, l, r)
             + query(2*node+1, mid+1, hi,  l, r);
    }
    void update(int node, int lo, int hi, int i, int v) {
        if (lo == hi) { t[node] = v; return; }    // the leaf
        int mid = (lo + hi) / 2;
        if (i <= mid) update(2*node,   lo,    mid, i, v);
        else          update(2*node+1, mid+1, hi,  i, v);
        t[node] = t[2*node] + t[2*node+1];        // refresh path
    }
public:
    SegTree(const vector<int>& a) : n(a.size()), t(4 * a.size()) {
        build(a, 1, 0, n - 1);
    }
    long long query(int l, int r) { return query(1, 0, n-1, l, r); }
    void update(int i, int v)     { update(1, 0, n-1, i, v); }
};

int main() {
    vector<int> a = {2, 5, 1, 4, 9, 3};
    SegTree st(a);
    cout << st.query(1, 4) << "\\n";   // 19
    st.update(2, 10);                  // a[2] = 10
    cout << st.query(1, 4) << "\\n";   // 28
}`,

id:'fenwick', name:'Fenwick Trees (Binary Indexed Trees)', tier:'advanced', tagline:'Prefix sums with updates in O(log n) — a segment tree compressed into one array and ten lines of code.',
overview:'<p>A <b>Fenwick tree</b> (BIT) answers prefix-sum queries on a changing array using just a flat array and bit tricks. Cell <code class="k">tree[i]</code> (1-indexed) is responsible for a block of <code class="k">i & −i</code> elements ending at i — that expression isolates the <b>lowest set bit</b> of i. Queries hop <i>down</i> by stripping that bit (<code class="k">i −= i & −i</code>); updates hop <i>up</i> by adding it (<code class="k">i += i & −i</code>). Both touch O(log n) cells. Less flexible than a segment tree (sums/invertible ops only) but smaller, faster in practice, and beloved for counting problems like inversions.</p>',
steps:[
 {t:'Go 1-indexed', d:'The bit trick needs indices starting at 1. tree has n+1 slots; tree[0] is unused.'},
 {t:'Understand responsibility', d:'tree[i] stores the sum of the (i & −i) elements ending at position i. tree[12] (binary 1100) covers 4 elements: 9..12.'},
 {t:'prefix(i): strip the low bit', d:'sum(1..i) = tree[i] + tree[i − lowbit] + …, until i hits 0. Example: prefix(13) = tree[13] + tree[12] + tree[8].'},
 {t:'update(i, Δ): add the low bit', d:'Every cell whose block covers position i must absorb Δ: i, then i + lowbit, then … until past n.'},
 {t:'Range sums', d:'sum(l..r) = prefix(r) − prefix(l−1). Only invertible operations (sum, xor, count) allow this subtraction — min/max do not.'},
 {t:'Know when to prefer it', d:'Point update + prefix/range query on sums → Fenwick. Arbitrary range aggregates or lazy range updates → segment tree.'}

code:{
cpp:`#include <iostream>
#include <vector>
using namespace std;

class Fenwick {
    int n;
    vector<long long> t;              // 1-indexed
public:
    Fenwick(int n) : n(n), t(n + 1, 0) {}

    void update(int i, long long d) {     // a[i] += d, O(log n)
        for (; i <= n; i += i & -i)       // hop UP: add low bit
            t[i] += d;
    }
    long long prefix(int i) const {       // sum(1..i), O(log n)
        long long s = 0;
        for (; i > 0; i -= i & -i)        // hop DOWN: strip low bit
            s += t[i];
        return s;
    }
    long long range(int l, int r) const { // sum(l..r)
        return prefix(r) - prefix(l - 1);
    }
};

int main() {
    // array (1-indexed): 2 5 1 4 9 3
    int a[] = {0, 2, 5, 1, 4, 9, 3};
    Fenwick fw(6);
    for (int i = 1; i <= 6; ++i) fw.update(i, a[i]);

    cout << fw.range(2, 5) << "\\n";   // 5+1+4+9 = 19
    fw.update(3, 9);                   // a[3]: 1 -> 10 (delta +9)
    cout << fw.range(2, 5) << "\\n";   // 28
}`,

        self.t = [0] * (n + 1)        # 1-indexed

        while i <= self.n:
            self.t[i] += d
            i += i & -i               # hop UP: add low bit

    def prefix(self, i):              # sum(1..i), O(log n)
        s = 0
        while i > 0:
            s += self.t[i]
            i -= i & -i               # hop DOWN: strip low bit
        return s

cpp:`#include <vector>
#include <algorithm>
using namespace std;
// Uses the Fenwick class from the implementation tab.

long long countInversions(vector<int> a) {
    // coordinate-compress values to 1..m
    vector<int> s(a);
    sort(s.begin(), s.end());
    s.erase(unique(s.begin(), s.end()), s.end());
    for (int& v : a)
        v = lower_bound(s.begin(), s.end(), v) - s.begin() + 1;

    Fenwick fw(s.size());
    long long inv = 0;
    for (int i = (int)a.size() - 1; i >= 0; --i) {
        inv += fw.prefix(a[i] - 1);   // smaller values to my right
        fw.update(a[i], 1);           // record me
    }
    return inv;
}   // O(n log n)   — [5,2,6,1] -> 4`,

def count_inversions(a):
    # coordinate-compress values to 1..m
    ranks = {v: i + 1 for i, v in enumerate(sorted(set(a)))}
    fw = Fenwick(len(ranks))
    inv = 0
    for v in reversed(a):
        r = ranks[v]
        inv += fw.prefix(r - 1)      # smaller values to my right
        fw.update(r, 1)              # record me

  for (let i = a.length - 1; i >= 0; i--) {
    const r = rank.get(a[i]);
    inv += fw.prefix(r - 1);         // smaller values to my right
    fw.update(r, 1);                 // record me
  }
  return inv;
}  // O(n log n)

console.log(countInversions([5, 2, 6, 1]));  // 4
// pairs: (5,2) (5,1) (2,1) (6,1)`}

class DSU {
    vector<int> parent, sz;

    int components;
    DSU(int n) : parent(n), sz(n, 1), components(n) {
        iota(parent.begin(), parent.end(), 0);   // parent[i] = i
    }
    int find(int x) {                       // with path compression
        if (parent[x] != x)
            parent[x] = find(parent[x]);    // point straight at root
        return parent[x];
    }

        parent[b] = a;
        sz[a] += sz[b];
        --components;
        return true;
    }
    bool connected(int a, int b) { return find(a) == find(b); }

    def __init__(self, n):
        self.parent = list(range(n))     # parent[i] = i
        self.size = [1] * n
        self.components = n

    def find(self, x):                   # with path compression
        root = x
        while self.parent[root] != root:
            root = self.parent[root]
        while self.parent[x] != root:    # second pass: compress
            self.parent[x], x = root, self.parent[x]
        return root

    def unite(self, a, b):               # union by size
        a, b = self.find(a), self.find(b)
        if a == b:
            return False                 # already connected
        if self.size[a] < self.size[b]:
            a, b = b, a                  # a = bigger tree
        self.parent[b] = a
        self.size[a] += self.size[b]
        self.components -= 1
        return True

    def connected(self, a, b):
        return self.find(a) == self.find(b)

    this.size[a] += this.size[b];

    a.classList.toggle('done', doneSet.has(a.dataset.page));
  });
  document.querySelectorAll('#memstrip i').forEach(i=>{
    i.classList.toggle('on', doneSet.has(i.dataset.id));
  });
}

/* ---------- code blocks ---------- */
function codeBlock(code, base){
  let html = '<div class="codeblk"><div class="codehead">';
  ['cpp','py','js'].forEach(l=>{
    html += '<button data-l="'+l+'" class="'+(l===curLang?'on':'')+'">'+LANG_LABEL[l]+'</button>';
  });
  html += '<span class="fname">'+base+'<span class="ext">'+LANG_FILE[curLang]+'</span></span></div>';
  ['cpp','py','js'].forEach(l=>{
    html += '<pre data-l="'+l+'" class="'+(l===curLang?'on':'')+'">'+esc(code[l])+'</pre>';
  });
  return html + '</div>';
}
function wireCodeBlocks(scope){
  scope.querySelectorAll('.codeblk').forEach(blk=>{
    blk.querySelectorAll('.codehead button').forEach(btn=>{
      btn.addEventListener('click',()=> setLang(btn.dataset.l));
    });
  });
}
function setLang(l){
  curLang = l;
  document.querySelectorAll('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.l===l));
  document.querySelectorAll('.codeblk').forEach(blk=>{
    blk.querySelectorAll('.codehead button').forEach(b=>b.classList.toggle('on', b.dataset.l===l));
    blk.querySelectorAll('pre').forEach(p=>p.classList.toggle('on', p.dataset.l===l));
    const ext = blk.querySelector('.ext');
    if (ext) ext.textContent = LANG_FILE[l];
  });
}

/* ---------- pages ---------- */
function renderHome(){
  const core = DATA.filter(d=>d.tier==='core'), adv = DATA.filter(d=>d.tier==='advanced');
  let html = '<div class="eyebrow">field guide</div><h1 class="dsname">DSA::Atlas</h1>'
    + '<p class="tagline">'+DATA.length+' data structures, each with a step-by-step guide, a diagram, working implementations in C++, Python, and JavaScript, and a solved challenge — capped by a '+QUIZ.length+'-question interview quiz.</p>'
    + '<p>Use the language switch (top right) to flip <b>every</b> code block on every page at once. Mark structures complete as you go — the strip under the logo tracks your coverage.</p>'
    + '<h2><span class="hash">##</span> Core structures</h2><div class="grid2">'
    + core.map((d,i)=>'<div class="card" data-page="'+d.id+'"><div class="c-i">'+String(i+1).padStart(2,'0')+'</div><div class="c-n">'+d.name+'</div><div class="c-t">'+d.tagline+'</div></div>').join('')
    + '</div><h2><span class="hash">##</span> Advanced structures</h2><div class="grid2">'
    + adv.map((d,i)=>'<div class="card" data-page="'+d.id+'"><div class="c-i">'+String(i+1+core.length).padStart(2,'0')+'</div><div class="c-n">'+d.name+'</div><div class="c-t">'+d.tagline+'</div></div>').join('')
    + '</div><h2><span class="hash">##</span> Assessment</h2><div class="grid2">'
    + '<div class="card" data-page="quiz"><div class="c-i">'+QUIZ.length+' questions</div><div class="c-n">Interview Quiz</div><div class="c-t">Learning mode for instant feedback, exam mode for a scored run across every topic.</div></div></div>';
  content.innerHTML = html;
  content.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>go(c.dataset.page)));
}

function renderDS(d){
  const i = DATA.indexOf(d);
  const prev = DATA[i-1], next = DATA[i+1];
  let html = '<div class="eyebrow">'+(d.tier==='core'?'core structure':'advanced structure')+' · '+String(i+1).padStart(2,'0')+' / '+String(DATA.length).padStart(2,'0')+'</div>'
    + '<h1 class="dsname">'+d.name+'</h1><p class="tagline">'+d.tagline+'</p>'
    + '<h2><span class="hash">01</span> What it is</h2>'+d.overview
    + '<h2><span class="hash">02</span> How it works — step by step</h2><div class="steps">'
    + d.steps.map(s=>'<div class="step"><div><div class="st-t">'+s.t+'</div><div class="st-d">'+s.d+'</div></div></div>').join('')
    + '</div><h2><span class="hash">03</span> Picture it</h2><div class="fig">'+d.svg+'<div class="figcap">'+d.svgCaption+'</div></div>'
    + '<h2><span class="hash">04</span> Complexity</h2><table class="cx"><tr><th>Operation</th><th>Typical</th><th>Worst</th></tr>'
    + d.complexity.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="'+(String(r[2]).includes('O(n')&&!String(r[2]).includes('log')?'w':'')+'">'+r[2]+'</td></tr>').join('')
    + '</table><h2><span class="hash">05</span> Implementation</h2>'
    + codeBlock(d.code, d.id)
    + '<h2><span class="hash">06</span> '+d.challenge.title.split(' · ')[0]+'</h2>'
    + '<div class="chal"><div class="ch-t">'+d.challenge.title.split(' · ')[1]+'</div>'
    + '<p>'+d.challenge.prompt+'</p>'
    + '<details><summary>▸ hint</summary><div class="hint">'+d.challenge.hint+'</div></details>'
    + '<details><summary>▸ solution (C++ · Python · JS)</summary>'+codeBlock(d.challenge.solutions, d.id+'_solution')+'</details></div>'
    + '<div class="markdone"><label><input type="checkbox" id="doneChk" '+(doneSet.has(d.id)?'checked':'')+'> mark '+d.name.split(' ')[0].toLowerCase()+' complete</label></div>'
    + '<div class="next-row"><a data-page="'+(prev?prev.id:'home')+'">← '+(prev?prev.name.split(' ·')[0].split(' (')[0]:'Overview')+'</a>'
    + '<a data-page="'+(next?next.id:'quiz')+'">'+(next?next.name.split(' ·')[0].split(' (')[0]:'Interview Quiz')+' →</a></div>';
  content.innerHTML = html;
  wireCodeBlocks(content);
  content.querySelectorAll('.next-row a').forEach(a=>a.addEventListener('click',()=>go(a.dataset.page)));
  $('#doneChk').addEventListener('change', e=>{
    e.target.checked ? doneSet.add(d.id) : doneSet.delete(d.id);
    refreshNav(d.id);
  });
}

/* ---------- quiz ---------- */
function renderQuiz(){
  let html = '<div class="eyebrow">assessment</div><h1 class="dsname">Interview Quiz</h1>'
    + '<p class="tagline">'+QUIZ.length+' questions across every structure in the atlas — the kind interviewers actually ask.</p>'
    + '<div class="quiz-modes">'
    + '<button data-m="learn" class="'+(quizMode==='learn'?'on':'')+'">Learning mode — instant feedback</button>'
    + '<button data-m="exam" class="'+(quizMode==='exam'?'on':'')+'">Exam mode — score at the end</button>'
    + '</div><div id="quizList"></div>'
    + (quizMode==='exam' ? '<div class="submit-row"><button class="bigbtn" id="submitExam">Submit exam</button><button class="bigbtn ghost" id="resetExam">Reset</button><span class="scorebox" id="score"></span></div>' : '');
  content.innerHTML = html;
  content.querySelectorAll('.quiz-modes button').forEach(b=>b.addEventListener('click',()=>{
    quizMode = b.dataset.m; examAnswers = {}; renderQuiz();
  }));
  const list = $('#quizList');
  list.innerHTML = QUIZ.map((q,qi)=>{
    return '<div class="qcard" data-qi="'+qi+'"><div class="qtop"><span>Q'+String(qi+1).padStart(2,'0')+'</span><span class="tpc">'+q.t+'</span></div>'
      + '<div class="qq">'+q.q+'</div>'
      + q.o.map((o,oi)=>'<button class="qopt" data-oi="'+oi+'">'+String.fromCharCode(65+oi)+'.&#160; '+o+'</button>').join('')
      + '<div class="qexp"><b>Answer: '+String.fromCharCode(65+q.a)+'.</b> '+q.e+'</div></div>';
  }).join('');
  list.querySelectorAll('.qcard').forEach(card=>{
    const qi = +card.dataset.qi, q = QUIZ[qi];
    card.querySelectorAll('.qopt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const oi = +btn.dataset.oi;
        if (quizMode==='learn'){
          if (card.dataset.locked) return;
          card.dataset.locked = '1';
          card.querySelectorAll('.qopt').forEach(b=>{
            const i2 = +b.dataset.oi;
            if (i2===q.a) b.classList.add('ok');
            else if (i2===oi) b.classList.add('no');
          });
          card.querySelector('.qexp').classList.add('show');
        } else {
          examAnswers[qi] = oi;
          card.querySelectorAll('.qopt').forEach(b=>b.classList.toggle('sel', +b.dataset.oi===oi));
        }
      });
    });
  });
  if (quizMode==='exam'){
    $('#submitExam').addEventListener('click',()=>{
      let right = 0;
      list.querySelectorAll('.qcard').forEach(card=>{
        const qi = +card.dataset.qi, q = QUIZ[qi], picked = examAnswers[qi];
        card.querySelectorAll('.qopt').forEach(b=>{
          const oi = +b.dataset.oi;
          b.classList.remove('sel');
          if (oi===q.a) b.classList.add('ok');
          else if (oi===picked) b.classList.add('no');
        });
        card.querySelector('.qexp').classList.add('show');
        if (picked===q.a) right++;
      });
      const pct = Math.round(100*right/QUIZ.length);
      $('#score').textContent = right+' / '+QUIZ.length+' — '+pct+'%'+(pct>=80?' · interview-ready':' · keep drilling');
    });
    $('#resetExam').addEventListener('click',()=>{ examAnswers={}; renderQuiz(); });
  }
}

/* ---------- router ---------- */
function go(page){
  if (page==='home') renderHome();
  else if (page==='quiz') renderQuiz();
  else {
    const d = DATA.find(x=>x.id===page);
    if (d) renderDS(d); else renderHome();
  }
  refreshNav(page);
  $('#crumb').innerHTML = 'DSA::Atlas / <b>'+(page==='home'?'home':page)+'</b>';
  window.scrollTo(0,0);
}

document.querySelectorAll('#langsw button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
$('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
buildNav();
go('home');
</script>
</body>
</html>
